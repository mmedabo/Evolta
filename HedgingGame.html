<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Safe Harbor — Portfolio Hedging, From Scratch | Evolta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf7ee;
    --bg2:#ffffff;
    --panel:#ffffff;
    --panel2:#f7f2e6;
    --line:#ece4d2;
    --line2:#e0d5bd;
    /* Yellow / gold theme */
    --gold:#b8860b;        /* primary brand gold */
    --gold-lt:#d4a017;
    --slate:#5a4a1f;       /* deep warm ink as secondary */
    --slate-lt:#8a7430;
    --amber:#e0902a;       /* accent */
    --accent:#b8860b;
    --pos:#1a7a4c;         /* up — stays green for P&L meaning */
    --neg:#c0392b;         /* down */
    --white:#2a230f;
    --txt:#352c14;
    --txt-dim:#6e6038;
    --txt-faint:#a89868;
    --mono:'IBM Plex Mono',monospace;
    --sans:'Inter',-apple-system,sans-serif;
    --disp:'Fraunces',serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:
      radial-gradient(ellipse at 12% -5%, #f6eccf 0%, transparent 45%),
      radial-gradient(ellipse at 95% 5%, #f3e9d2 0%, transparent 42%),
      var(--bg);
    color:var(--txt);font-family:var(--sans);font-size:13px;line-height:1.5;
    min-height:100vh;padding:0 0 60px;-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:0 20px;position:relative;z-index:2}
  header{border-bottom:1px solid var(--line);padding:24px 0 20px;margin-bottom:24px;
    display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
  .brand h1{font-family:var(--disp);font-weight:500;font-size:38px;line-height:.95;letter-spacing:-.02em;color:var(--gold)}
  .brand h1 .amp{color:var(--slate);font-style:italic}
  .brand h1 .bolt{color:var(--amber);font-style:normal}
  .brand .sub{color:var(--txt-dim);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;margin-top:8px;font-family:var(--mono)}
  .brand .evolta{color:var(--slate);font-weight:600}
  .topbar{display:flex;align-items:center;gap:14px}
  .back-btn{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;color:var(--txt-dim);
    text-decoration:none;border:1px solid var(--line2);border-radius:8px;padding:8px 13px;transition:.15s;white-space:nowrap}
  .back-btn:hover{border-color:var(--gold);color:var(--gold)}
  .clock{text-align:right}
  .clock .month{font-family:var(--disp);font-size:26px;color:var(--slate);font-weight:500}
  .clock .turn{color:var(--txt-faint);font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-family:var(--mono)}

  .grid{display:grid;grid-template-columns:1fr 340px;gap:18px;align-items:start}
  @media(max-width:880px){.grid{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:18px;
    box-shadow:0 1px 2px rgba(184,134,11,.05),0 6px 22px rgba(90,74,31,.05)}
  .panel h2{font-family:var(--mono);font-weight:500;font-size:11px;color:var(--txt-faint);letter-spacing:.14em;
    text-transform:uppercase;margin-bottom:14px;display:flex;align-items:center;gap:8px}
  .panel h2 .dot{width:5px;height:5px;border-radius:50%;background:var(--gold)}

  .mkt{width:100%;border-collapse:collapse}
  .mkt th{text-align:left;color:var(--txt-faint);font-weight:500;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
    padding:4px 8px;border-bottom:1px solid var(--line);font-family:var(--mono)}
  .mkt td{padding:9px 8px;border-bottom:1px solid var(--line)}
  .mkt tr:last-child td{border-bottom:none}
  .mkt .nm{color:var(--txt);font-weight:500}
  .mkt .nm small{display:block;color:var(--txt-faint);font-size:10px;font-weight:400}
  .mkt .px{font-weight:600;font-size:15px;text-align:right;font-family:var(--mono)}
  .mkt .chg{text-align:right;font-size:12px;font-family:var(--mono)}
  .up{color:var(--pos)}.down{color:var(--neg)}.flat{color:var(--txt-faint)}

  .news{border-left:3px solid var(--gold);padding:2px 0 2px 14px;margin-bottom:8px}
  .news .hl{color:var(--white);font-weight:600;margin-bottom:4px;font-size:14px}
  .news .src{color:var(--slate);font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-family:var(--mono);font-weight:500}
  .news .ex{color:var(--txt-dim);font-size:12px;margin-top:8px;line-height:1.6;border-top:1px solid var(--line);padding-top:8px}
  .news .ex b{color:var(--gold)}

  .act-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .trade-card{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:13px}
  .trade-card .tt{font-family:var(--disp);font-size:15px;color:var(--gold);margin-bottom:3px;font-weight:500}
  .trade-card .td{color:var(--txt-dim);font-size:10.5px;margin-bottom:11px;min-height:30px;line-height:1.5}
  .qty-row{display:flex;align-items:center;gap:6px;margin-bottom:9px}
  .qty-row label{color:var(--txt-dim);font-size:10px;flex:1;font-family:var(--mono);text-transform:uppercase;letter-spacing:.05em}
  select,input[type=number]{background:var(--bg2);border:1px solid var(--line2);color:var(--txt);
    font-family:var(--mono);font-size:12px;padding:5px 7px;border-radius:6px}
  select{flex:1}
  input[type=number]{width:74px;text-align:right}
  input:focus,select:focus{outline:none;border-color:var(--gold)}
  input[type=range]{accent-color:var(--gold);width:100%}
  .btn-row{display:flex;gap:6px}
  button{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.03em;border:1px solid var(--line2);
    background:var(--bg2);color:var(--txt);padding:8px 10px;border-radius:7px;cursor:pointer;transition:.13s;flex:1}
  button:hover{border-color:var(--gold);color:var(--gold)}
  button.buy:hover{border-color:var(--pos);color:var(--pos);background:rgba(26,122,76,.06)}
  button.sell:hover{border-color:var(--neg);color:var(--neg);background:rgba(192,57,43,.05)}
  button:active{transform:translateY(1px)}
  button:disabled{opacity:.4;cursor:not-allowed}
  .big-btn{width:100%;padding:15px;font-size:14px;font-family:var(--sans);font-weight:600;
    background:linear-gradient(135deg,var(--gold),var(--amber));color:#fff;border:none;letter-spacing:.02em;
    border-radius:10px;box-shadow:0 4px 14px rgba(184,134,11,.22)}
  .big-btn:hover{filter:brightness(1.06);color:#fff}
  .ghost-btn{background:transparent;border:1px solid var(--line2);color:var(--txt-dim);padding:10px 16px;border-radius:9px;font-family:var(--mono);font-size:11px}
  .ghost-btn:hover{border-color:var(--gold);color:var(--gold)}

  .stat{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line)}
  .stat:last-child{border-bottom:none}
  .stat .k{color:var(--txt-dim);font-size:11px}
  .stat .v{font-weight:600;font-family:var(--mono)}
  .big-num{font-family:var(--disp);font-size:32px;font-weight:500;line-height:1;margin:2px 0 8px;color:var(--slate)}

  .pos{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:12px}
  .pos:last-child{border-bottom:none}
  .pos .pl{color:var(--txt);display:flex;flex-direction:column;gap:2px}
  .pos .pl small{color:var(--txt-faint);font-size:10px;font-family:var(--mono)}
  .pos .pr{text-align:right;font-family:var(--mono)}
  .tag{display:inline-block;font-size:9px;padding:2px 6px;border-radius:4px;letter-spacing:.05em;text-transform:uppercase;font-weight:600;font-family:var(--mono)}
  .tag.long{background:rgba(184,134,11,.14);color:var(--gold)}
  .tag.hedge{background:rgba(26,122,76,.12);color:var(--pos)}

  .meter{height:7px;background:var(--line);border-radius:5px;overflow:hidden;margin:8px 0}
  .meter span{display:block;height:100%;transition:.4s;border-radius:5px}

  .toast{position:fixed;left:50%;top:20px;transform:translateX(-50%);z-index:50;background:var(--bg2);border:1px solid var(--gold);
    border-radius:10px;padding:12px 22px;color:var(--txt);font-size:12px;box-shadow:0 10px 36px rgba(90,74,31,.16);max-width:90vw;
    opacity:0;transition:.3s;pointer-events:none;font-family:var(--mono)}
  .toast.show{opacity:1;top:32px}
  .toast.warn{border-color:var(--neg);color:var(--neg)}

  .modal-bg{position:fixed;inset:0;background:rgba(42,35,15,.5);backdrop-filter:blur(4px);z-index:40;display:none;align-items:center;justify-content:center;padding:20px}
  .modal-bg.show{display:flex}
  .modal{background:var(--bg2);border:1px solid var(--line);border-radius:18px;padding:30px;max-width:560px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(90,74,31,.22)}
  .modal h2{font-family:var(--disp);font-size:28px;color:var(--gold);font-weight:500;margin-bottom:6px}
  .modal .score{font-family:var(--disp);font-size:52px;font-weight:500;line-height:1;margin:10px 0;color:var(--slate)}
  .grade{display:inline-block;font-family:var(--disp);font-size:22px;font-weight:600;padding:3px 16px;border-radius:10px;background:var(--gold);color:#fff;margin-left:10px}
  .debrief-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);gap:14px}
  .debrief-row .lbl{color:var(--txt-dim)}
  .debrief-row .rating{font-weight:600;text-align:right;font-family:var(--mono);font-size:11.5px}

  .hint{color:var(--txt-faint);font-size:10.5px;margin-top:6px;line-height:1.5}
  .hint b{color:var(--txt-dim)}
  .tip{cursor:help;border-bottom:1px dotted var(--txt-faint)}
  svg text{font-family:var(--mono)}

  /* Academy */
  #academy{max-width:920px;margin:0 auto}
  .acad-panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px 32px;box-shadow:0 1px 2px rgba(184,134,11,.05),0 10px 36px rgba(90,74,31,.07)}
  .acad-steps{display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap}
  .acad-steps .s{flex:1;min-width:70px;height:5px;border-radius:4px;background:var(--line);transition:.3s}
  .acad-steps .s.done{background:var(--gold)}
  .acad-steps .s.cur{background:linear-gradient(90deg,var(--gold),var(--amber))}
  .lesson-kicker{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--amber);font-weight:500;margin-bottom:8px}
  .lesson-title{font-family:var(--disp);font-size:30px;font-weight:500;color:var(--gold);line-height:1.05;margin-bottom:10px;letter-spacing:-.01em}
  .lesson-lede{color:var(--txt-dim);font-size:14px;line-height:1.65;margin-bottom:6px;max-width:62ch}
  .lesson-lede b{color:var(--gold)}
  .lesson-body{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start;margin:22px 0 8px}
  @media(max-width:760px){.lesson-body{grid-template-columns:1fr}}
  .viz-box{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:18px;min-height:300px}
  .viz-controls{margin-top:14px;display:flex;flex-direction:column;gap:12px}
  .ctrl-row{display:flex;align-items:center;gap:10px}
  .ctrl-row label{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--txt-dim);min-width:96px}
  .chip-row{display:flex;gap:8px;flex-wrap:wrap}
  .chip{font-family:var(--mono);font-size:10.5px;padding:7px 12px;border-radius:20px;border:1px solid var(--line2);background:var(--bg2);color:var(--txt-dim);cursor:pointer;transition:.13s;flex:none}
  .chip:hover{border-color:var(--amber);color:var(--amber)}
  .takeaway{background:rgba(224,144,42,.08);border:1px solid rgba(224,144,42,.28);border-radius:10px;padding:13px 15px;margin-top:6px}
  .takeaway .lab{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);font-weight:600;margin-bottom:5px}
  .takeaway .txt{color:var(--txt);font-size:12.5px;line-height:1.6}
  .takeaway .txt b{color:var(--gold)}
  .lesson-points{list-style:none;margin:14px 0}
  .lesson-points li{padding:7px 0 7px 26px;position:relative;color:var(--txt-dim);font-size:13px;line-height:1.55}
  .lesson-points li::before{content:"";position:absolute;left:0;top:9px;width:13px;height:13px;border-radius:50%;border:2px solid var(--gold)}
  .lesson-points li b{color:var(--txt)}
  .acad-nav{display:flex;justify-content:space-between;align-items:center;margin-top:24px;gap:12px}
  .acad-nav .right{display:flex;gap:10px}
  .read-out{font-family:var(--mono);font-size:12px;color:var(--txt-dim)}
  .read-out b{font-size:14px;color:var(--slate)}
  .bar-anim{transition:height .5s cubic-bezier(.2,.8,.25,1),y .5s cubic-bezier(.2,.8,.25,1),fill .3s}
  .line-anim{transition:all .5s cubic-bezier(.2,.8,.25,1)}
  .hidden{display:none !important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1>Safe <span class="amp">&amp;</span> Sound <span class="bolt">🛡️</span></h1>
      <div class="sub" id="brandSub"></div>
    </div>
    <div class="topbar">
      <div class="clock" id="clock" style="display:none">
        <div class="month" id="monthLabel">—</div>
        <div class="turn" id="turnLabel"></div>
      </div>
      <button class="back-btn" id="langToggle" type="button" style="cursor:pointer;margin-right:8px">中文</button>
      <a class="back-btn" id="backAll" href="TradingGamePortal.html">‹ All games</a>
    </div>
  </header>

  <!-- ACADEMY -->
  <div id="academy">
    <div class="acad-panel">
      <div class="acad-steps" id="acadSteps"></div>
      <div id="lessonContent"></div>
      <div class="acad-nav">
        <button class="ghost-btn" id="backBtn" onclick="acadBack()" style="flex:none" data-i18n="nav_back">‹ Back</button>
        <div class="right">
          <button class="ghost-btn" id="skipBtn" onclick="startGame()" style="flex:none" data-i18n="nav_skip">Skip to game ›</button>
          <button class="big-btn" id="nextBtn" onclick="acadNext()" style="width:auto;flex:none;padding:11px 26px">Next ›</button>
        </div>
      </div>
    </div>
  </div>

  <!-- GAME -->
  <div id="game" class="grid hidden">
    <div>
      <div class="panel" id="newsPanel">
        <h2><span class="dot"></span><span data-i18n="pn_wire">Market Wire</span></h2>
        <div id="newsBox"></div>
      </div>

      <div class="panel">
        <h2><span class="dot"></span><span data-i18n="pn_hold">Your Holdings</span></h2>
        <table class="mkt">
          <thead><tr><th data-i18n="th_sector">Sector</th><th style="text-align:right" data-i18n="th_value">Value</th><th style="text-align:right" data-i18n="th_last">Δ last</th></tr></thead>
          <tbody id="mktBody"></tbody>
        </table>
        <div class="hint" id="concHint"></div>
      </div>

      <div class="panel">
        <h2><span class="dot"></span><span data-i18n="pn_desk">Insurance Desk</span></h2>
        <div class="act-grid" id="tradeGrid"></div>
        <div style="margin-top:14px">
          <button class="big-btn" id="advanceBtn" onclick="startOrAdvance()">▶ Start</button>
        </div>
      </div>
    </div>

    <div>
      <div class="panel">
        <h2><span class="dot"></span><span data-i18n="pn_port">Portfolio</span></h2>
        <div class="big-num" id="equityNum">$100.0k</div>
        <div class="stat"><span class="k" data-i18n="k_return">Total return</span><span class="v" id="retVal">0.0%</span></div>
        <div class="stat"><span class="k" data-i18n="k_prem">Premium paid</span><span class="v" id="premVal">$0</span></div>
        <div class="stat"><span class="k" data-i18n="k_pay">Hedge payouts</span><span class="v" id="payVal">$0</span></div>
        <div class="stat"><span class="k" data-i18n="k_cash">Cash</span><span class="v" id="cashVal">$10.0k</span></div>
      </div>

      <div class="panel">
        <h2><span class="dot"></span><span data-i18n="pn_risk">Risk</span></h2>
        <div class="stat"><span class="k tip" data-i18n="k_dd" data-i18n-title="tip_dd">Max drawdown</span><span class="v" id="ddVal">0.0%</span></div>
        <div class="meter"><span id="riskBar" style="width:0%;background:var(--pos)"></span></div>
        <div class="hint" id="riskHint"></div>
      </div>

      <div class="panel">
        <h2><span class="dot"></span><span data-i18n="pn_hedges">Active Hedges</span></h2>
        <div id="posBox"></div>
      </div>

      <div class="panel" id="recapPanel" style="display:none">
        <h2><span class="dot"></span><span data-i18n="pn_recap">This Round — What Happened</span></h2>
        <div id="recapBox"></div>
      </div>

      <div class="panel">
        <h2><span class="dot"></span><span data-i18n="pn_gloss">Glossary</span></h2>
        <div style="font-size:11px;color:var(--txt-dim);line-height:1.7" id="glossBox"></div>
        <div style="margin-top:12px"><button class="ghost-btn" onclick="openAcademy()" style="width:100%" data-i18n="replay_acad">↺ Replay the Academy</button></div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modalInner"></div></div>

<script>
/* =========================================================
   PART 1 — ACADEMY (teach hedging interactively)
   ========================================================= */

/* ================= i18n ================= */
const I18N={
en:{
  doc_title:'Safe & Sound — Portfolio Hedging | Evolta',
  lang_other:'中文', lang_aria:'Switch to Chinese',
  brand_sub:'Portfolio Hedging — from scratch · <span class="evolta">Evolta — learn · play · evolve</span>',
  back_all:'‹ All games', press_start:'Press start',
  round_n:n=>'Round '+n, round_of:n=>'of '+n,

  nav_back:'‹ Back', nav_skip:'Skip to game ›', nav_next:'Next ›', nav_open:'Open the desk 🛡️',

  pn_wire:'Market Wire', pn_hold:'Your Holdings', pn_desk:'Insurance Desk',
  pn_port:'Portfolio', pn_risk:'Risk', pn_hedges:'Active Hedges',
  pn_recap:'This Round — What Happened', pn_gloss:'Glossary',

  intro_hl:'You manage a $100,000 portfolio.',
  intro_src:'Evolta Investment Desk',
  intro_ex:'Over 10 rounds the market will throw shocks at your holdings. Buy <b>hedges</b> — insurance that pays off when things crash — to protect your downside, but mind the <b>premium</b> you pay for it. Press <b>Start</b> to see the first scenario.',
  reset_hl:'Fresh book. $100,000 to protect.',
  reset_ex:'Press <b>Start</b> to see the first scenario.',

  th_sector:'Sector', th_value:'Value', th_last:'Δ last',
  k_return:'Total return', k_prem:'Premium paid', k_pay:'Hedge payouts', k_cash:'Cash',
  k_dd:'Max drawdown', tip_dd:'The largest peak-to-trough drop in your portfolio value so far. Lower is better.',
  no_hedges:'No hedges in place for this round.',
  replay_acad:'↺ Replay the Academy',
  btn_start:'▶ Start', btn_resolve:'▶ Resolve Round',

  gloss:'<b style="color:var(--gold)">Exposure</b> how much you\'d lose if a sector falls<br><b style="color:var(--gold)">Hedge</b> a position that gains when your portfolio loses<br><b style="color:var(--gold)">Put option</b> insurance that pays off if a price falls below a level<br><b style="color:var(--gold)">Premium</b> the upfront cost of a hedge — the "drag"<br><b style="color:var(--gold)">Diversification</b> spreading risk so no single shock sinks you<br><b style="color:var(--gold)">Drawdown</b> the worst peak-to-trough fall in your value',

  sec_tech:'Tech', sec_banks:'Banks', sec_energy:'Energy', sec_intl:'Intl',
  cash_row:'Cash', cash_sub:'safe, no return',
  insured:'🛡️ insured this round', unhedged:'unhedged',
  what_means:'What it means:',

  conc_high:c=>'<b>Concentration '+c+'%</b> in your biggest sector — a shock there would sting. Consider Rebalance or a put.',
  conc_ok:c=>'Concentration '+c+'% in your biggest sector — reasonably balanced.',

  tc_put:'Sector Put', tc_put_d:(d,pr)=>'Insure one sector. Caps its loss this round at about −'+d+'%. Costs '+pr+'% of that sector.',
  tc_put_b:'Buy Put',
  tc_idx:'Index Put', tc_idx_d:(d,pr,amt)=>'Insure the whole book against a broad crash. Caps total loss at about −'+d+'%. Costs '+pr+'% of stocks ('+amt+').',

  tc_reb:'Rebalance', tc_reb_d:'Spread money evenly across sectors to cut concentration. Free — but you trim your winners.',
  tc_reb_b:'Rebalance',
  tc_cash:'Raise Cash', tc_cash_d:'Move 20% of each sector into safe cash. Lowers risk and upside — pure de-risking.',
  tc_cash_b:'De-risk',

function updatePut(c){
  putCover=c;
  const x0=40,x1=344,zeroY=115,topY=25,botY=205;
  // market return from -40 (x0) to +40 (x1); floor at -(40*(1-c/100))
  const floorRet=-40*(1-c/100);
  const premium=(c/100)*4; // up to ~4% premium drag
  const pts=[];
  for(let i=0;i<=40;i++){
    const mret=-40+i*2; // -40..+40
    let pret=Math.max(mret,floorRet)-premium;
    const x=x0+(i/40)*(x1-x0);
    const y=zeroY-(pret/40)*(zeroY-topY);
    pts.push(`${x.toFixed(1)},${Math.max(topY,Math.min(botY,y)).toFixed(1)}`);
  }
  document.getElementById('hedgeLine').setAttribute('points',pts.join(' '));
  document.getElementById('putRead').innerHTML=t('l2_read',floorRet.toFixed(0),premium.toFixed(1),c<25?t('l2_cheap'):c>80?t('l2_strong'):t('l2_bal'));
}

          <text x="280" y="214" text-anchor="middle" font-size="9.5" fill="#6e6038">${t('l4_combined')}</text>
        </svg>
        <div class="viz-controls">
          <div class="ctrl-row"><label>Correlation</label><input type="range" min="-100" max="100" value="80" id="corrSlider" oninput="updateCorr(+this.value)"></div>
          <div class="read-out" id="corrRead"></div>
        </div>

          <li>${t('l4_p1')}</li>

}
function updateCorr(c){
  corr=c/100;
  // combined vol of two equal assets each vol 1: sqrt(0.5*(1+corr))
  const vol=Math.sqrt(0.5*(1+corr));
  const base=130, h=base*vol;
  const r=document.getElementById('barCombo'); r.setAttribute('height',h); r.setAttribute('y',190-h);
  document.getElementById('lblCombo').setAttribute('y',190-h-6);
  document.getElementById('lblCombo').textContent=(vol*100).toFixed(0)+'%';
  document.getElementById('corrRead').innerHTML=t('l4_read',corr.toFixed(2),(vol*100).toFixed(0),corr<-0.3?t('l4_strong'):corr<0.4?t('l4_nice'):t('l4_little'));
}

/* =========================================================
   PART 2 — THE GAME
   ========================================================= */
const START={tech:30000,banks:25000,energy:20000,intl:15000,cash:10000};
const ROUNDS=10;
const PUT_DEDUCT=4;     // % deductible on a sector put
const PUT_PREM=2.0;     // % premium of insured sector value
const IDX_DEDUCT=6;     // % deductible on index put
const IDX_PREM=2.5;     // % premium of total
let S=null;

function freshState(){
  return {started:false, round:0,
    val:{tech:START.tech,banks:START.banks,energy:START.energy,intl:START.intl},
    cash:START.cash,
    startEquity:100000, peak:100000, maxDD:0,
    premiumPaid:0, payoutReceived:0,
    hedges:{tech:false,banks:false,energy:false,intl:false,index:false},
    last:{tech:0,banks:0,energy:0,intl:0},
    pendingEvent:null, recap:null, newsMode:'intro',
    rebalances:0, crashesProtected:0, crashesUnprotected:0, hedgeRounds:0,
  };
}
const EVENTS=[
  {id:0,ret:{tech:18,banks:3,energy:1,intl:4}},
  {id:1,ret:{tech:-22,banks:-3,energy:-2,intl:-4},crash:'tech'},
  {id:2,ret:{tech:-6,banks:-25,energy:-2,intl:-8},crash:'banks'},
  {id:3,ret:{tech:9,banks:14,energy:5,intl:7}},
  {id:4,ret:{tech:-5,banks:1,energy:20,intl:-4}},
  {id:5,ret:{tech:2,banks:2,energy:-19,intl:1},crash:'energy'},
  {id:6,ret:{tech:-3,banks:-4,energy:-3,intl:-24},crash:'intl'},
  {id:7,ret:{tech:8,banks:7,energy:6,intl:9}},
  {id:8,ret:{tech:-16,banks:-15,energy:-13,intl:-17},crash:'index'},
  {id:9,ret:{tech:-8,banks:6,energy:11,intl:2}},
  {id:10,ret:{tech:5,banks:4,energy:3,intl:5}},
];
function pickEvent(){ return EVENTS[Math.floor(Math.random()*EVENTS.length)]; }
function newsHTML(){
  if(S.newsMode==='event'&&S.pendingEvent){
    const n=S.pendingEvent;
    return '<div class="news"><div class="hl">'+t('ev'+n.id+'_hl')+'</div><div class="src">'+t('ev'+n.id+'_src')+'</div>'+
           '<div class="ex"><b>'+t('what_means')+'</b> '+t('ev'+n.id+'_ex')+'</div></div>';
  }
  if(S.newsMode==='reset'){
    return '<div class="news"><div class="hl">'+t('reset_hl')+'</div><div class="src">'+t('intro_src')+'</div>'+
           '<div class="ex">'+t('reset_ex')+'</div></div>';
  }
  return '<div class="news"><div class="hl">'+t('intro_hl')+'</div><div class="src">'+t('intro_src')+'</div>'+
         '<div class="ex">'+t('intro_ex')+'</div></div>';
}

function totalStocks(){ return S.val.tech+S.val.banks+S.val.energy+S.val.intl; }
function equity(){ return totalStocks()+S.cash; }

function buyPut(sector){
  if(!S.started){toast(t('toast_start'));return;}
  if(S.hedges[sector]){toast(t('toast_insured'));return;}
  const prem=S.val[sector]*PUT_PREM/100;
  if(prem>S.cash){toast(t('toast_nocash'),true);return;}
  S.cash-=prem; S.premiumPaid+=prem; S.hedges[sector]=true;
  toast(t('toast_bought',sectorName(sector),fmtUSD(prem))); render();
}
function buyIndexPut(){
  if(!S.started){toast(t('toast_start'));return;}
  if(S.hedges.index){toast(t('toast_idx_have'));return;}
  const prem=totalStocks()*IDX_PREM/100;
  if(prem>S.cash){toast(t('toast_idx_nocash'),true);return;}
  S.cash-=prem; S.premiumPaid+=prem; S.hedges.index=true;
  toast(t('toast_bought_idx',fmtUSD(prem))); render();
}
function rebalance(){
  if(!S.started){toast(t('toast_start'));return;}
  const tot=totalStocks(); const each=tot/4;
  S.val={tech:each,banks:each,energy:each,intl:each};
  S.rebalances++;
  toast(t('toast_reb')); render();
}
function raiseCash(){
  if(!S.started){toast(t('toast_start'));return;}
  // move 20% of each sector to cash (de-risk)
  let moved=0;
  for(const k of ['tech','banks','energy','intl']){ const m=S.val[k]*0.2; S.val[k]-=m; moved+=m; }
  S.cash+=moved;
  toast(t('toast_cash',fmtUSD(moved))); render();
}
function sectorName(k){return t('sec_'+k);}

function startOrAdvance(){
  if(!S.started){ S.started=true; S.round=0; S.pendingEvent=pickEvent();
    document.getElementById('advanceBtn').textContent=t('btn_resolve'); S.newsMode='event'; render(); return; }
  resolveRound();
}
function resolveRound(){
  const ev=S.pendingEvent;
  const before={...S.val,cash:S.cash,equity:equity()};
  const anyHedge=Object.values(S.hedges).some(Boolean); if(anyHedge)S.hedgeRounds++;

  // apply returns
  const lines=[]; let payout=0;
  for(const k of ['tech','banks','energy','intl']){
    const r=ev.ret[k]; const v0=S.val[k];
    S.val[k]=v0*(1+r/100);
    S.last[k]=r;
    // sector put payout
    if(S.hedges[k] && r<0){
      const lossPct=Math.max(0,-r-PUT_DEDUCT);
      const pay=lossPct/100*v0;
      if(pay>0){ S.val[k]+=pay; payout+=pay; }
    }
    lines.push({k,r,v0});
  }
  // index put payout on whole book
  if(S.hedges.index){
    const portRet=(totalStocks()-(before.tech+before.banks+before.energy+before.intl))/(before.tech+before.banks+before.energy+before.intl)*100;
    const lossPct=Math.max(0,-portRet-IDX_DEDUCT);
    if(lossPct>0){ const pay=lossPct/100*(before.tech+before.banks+before.energy+before.intl); S.cash+=pay; payout+=pay; }
  }
  S.payoutReceived+=payout;

  // crash protection tracking
  if(ev.crash){
    const protectedNow = ev.crash==='index'?S.hedges.index : S.hedges[ev.crash];
    if(protectedNow) S.crashesProtected++; else S.crashesUnprotected++;
  }

  // drawdown
  const eq=equity();
  if(eq>S.peak)S.peak=eq;
  const dd=(S.peak-eq)/S.peak*100; if(dd>S.maxDD)S.maxDD=dd;

  // recap
  S.recap={ ev, lines, payout, swing:eq-before.equity, hedged:{...S.hedges} };

  // reset hedges (one-round insurance)
  S.hedges={tech:false,banks:false,energy:false,intl:false,index:false};
  S.round++;
  if(S.round>=ROUNDS){ render(); endGame(); return; }
  S.pendingEvent=pickEvent(); render();
}

/* ---- render ---- */
function fmtUSD(n){const s=n<0?"-":"";const a=Math.abs(n);
  if(a>=1e6)return s+"$"+(a/1e6).toFixed(2)+"M";
  if(a>=1e3)return s+"$"+(a/1e3).toFixed(1)+"k";
  return s+"$"+a.toFixed(0);}
function colorPL(n){return n>0?'up':n<0?'down':'flat';}
function arrow(n){return n>0?'▲':n<0?'▼':'—';}

function render(){
  document.getElementById('monthLabel').textContent=S.started?t('round_n',Math.min(S.round+1,ROUNDS)):"—";
  document.getElementById('turnLabel').textContent=S.started?t('round_of',ROUNDS):t('press_start');

  document.getElementById('newsBox').innerHTML=newsHTML();

  // holdings table
  const rows=['tech','banks','energy','intl'].map(k=>{
    const v=S.val[k]; const ch=S.last[k];
    return '<tr><td class="nm">'+sectorName(k)+'<small>'+(S.hedges[k]?t('insured'):t('unhedged'))+'</small></td>'+
      '<td class="px">'+fmtUSD(v)+'</td><td class="chg '+(ch>0?'up':ch<0?'down':'flat')+'">'+(ch?arrow(ch)+' '+Math.abs(ch).toFixed(0)+'%':'—')+'</td></tr>';
  }).join('');
  document.getElementById('mktBody').innerHTML=rows+
    '<tr><td class="nm">'+t('cash_row')+'<small>'+t('cash_sub')+'</small></td><td class="px">'+fmtUSD(S.cash)+'</td><td class="chg flat">—</td></tr>';

  // concentration hint
  const tot=totalStocks(); const top=Math.max(S.val.tech,S.val.banks,S.val.energy,S.val.intl);
  const conc=tot>0?top/tot*100:0;
  const ch=document.getElementById('concHint');
  ch.innerHTML = conc>40?t('conc_high',conc.toFixed(0)):t('conc_ok',conc.toFixed(0));

  // insurance desk
  const tg=document.getElementById('tradeGrid');
  const secOptions=['tech','banks','energy','intl'].map(k=>'<option value="'+k+'">'+t('opt_prem',sectorName(k),fmtUSD(S.val[k]*PUT_PREM/100))+'</option>').join('');
  tg.innerHTML=`
    <div class="trade-card">
      <div class="tt">${t('tc_put')}</div>
      <div class="td">${t('tc_put_d',PUT_DEDUCT,PUT_PREM)}</div>
      <div class="qty-row"><select id="putSel">${secOptions}</select></div>
      <div class="btn-row"><button class="buy" onclick="buyPut(document.getElementById('putSel').value)">${t('tc_put_b')}</button></div>
    </div>
    <div class="trade-card">
      <div class="tt">${t('tc_idx')}</div>
      <div class="td">${t('tc_idx_d',IDX_DEDUCT,IDX_PREM,fmtUSD(totalStocks()*IDX_PREM/100))}</div>
      <div class="btn-row"><button class="buy" onclick="buyIndexPut()">${t('tc_idx_b')}</button></div>
    </div>
    <div class="trade-card">
      <div class="tt">${t('tc_reb')}</div>
      <div class="td">${t('tc_reb_d')}</div>
      <div class="btn-row"><button onclick="rebalance()">${t('tc_reb_b')}</button></div>
    </div>
    <div class="trade-card">
      <div class="tt">${t('tc_cash')}</div>
      <div class="td">${t('tc_cash_d')}</div>
      <div class="btn-row"><button onclick="raiseCash()">${t('tc_cash_b')}</button></div>
    </div>`;

  // portfolio sidebar
  const eq=equity(); const ret=(eq-S.startEquity)/S.startEquity*100;
  document.getElementById('equityNum').textContent=fmtUSD(eq);
  document.getElementById('equityNum').className='big-num '+colorPL(ret);
  document.getElementById('retVal').innerHTML=`<span class="${colorPL(ret)}">${ret>=0?'+':''}${ret.toFixed(1)}%</span>`;
  document.getElementById('premVal').textContent=fmtUSD(S.premiumPaid);
  document.getElementById('payVal').innerHTML=`<span class="up">${fmtUSD(S.payoutReceived)}</span>`;
  document.getElementById('cashVal').textContent=fmtUSD(S.cash);

  // risk / drawdown
  document.getElementById('ddVal').innerHTML=`<span class="${S.maxDD>10?'down':'flat'}">${S.maxDD.toFixed(1)}%</span>`;
  const bar=document.getElementById('riskBar'); bar.style.width=Math.min(100,S.maxDD/30*100)+'%';
  bar.style.background=S.maxDD<8?'var(--pos)':S.maxDD<18?'var(--amber)':'var(--neg)';
  document.getElementById('riskHint').textContent=
    S.maxDD<1?t('dd_none'):
    S.maxDD<8?t('dd_shallow',S.maxDD.toFixed(0)):
    S.maxDD<18?t('dd_bumpy',S.maxDD.toFixed(0)):
    t('dd_deep',S.maxDD.toFixed(0));

  // active hedges
  const pb=document.getElementById('posBox'); let html='';
  ['tech','banks','energy','intl'].forEach(k=>{ if(S.hedges[k])
    html+='<div class="pos"><div class="pl"><span><span class="tag hedge">'+t('tag_put')+'</span> '+sectorName(k)+'</span><small>'+t('caps_sector',PUT_DEDUCT)+'</small></div></div>';});
  if(S.hedges.index) html+='<div class="pos"><div class="pl"><span><span class="tag hedge">'+t('tag_put')+'</span> '+t('whole_book')+'</span><small>'+t('caps_book',IDX_DEDUCT)+'</small></div></div>';
  pb.innerHTML=html||'<div class="hint">'+t('no_hedges')+'</div>';

  // recap
  const rp=document.getElementById('recapPanel'), rb=document.getElementById('recapBox');
  if(S.recap){
    const r=S.recap; const swCls=colorPL(r.swing);
    let h='<div style="margin-bottom:10px"><span style="font-family:var(--mono);font-size:10px;color:var(--txt-faint);text-transform:uppercase;letter-spacing:.1em">'+t('r_swing')+'</span><br>'+
      '<span class="big-num '+swCls+'" style="font-size:24px">'+(r.swing>=0?'+':'')+fmtUSD(r.swing)+'</span></div>';
    h+='<div style="font-size:11.5px;color:var(--txt-dim);line-height:1.7"><b style="color:var(--gold)">'+t('r_moves')+'</b><br>'+
      r.lines.map(l=>'· '+sectorName(l.k)+' '+(l.r>=0?'+':'')+l.r+'%'+((r.hedged[l.k]&&l.r<0)?' <span class="up">'+t('r_put_paid')+'</span>':'')).join('<br>')+'</div>';
    if(r.payout>0) h+='<div style="font-size:11.5px;border-top:1px solid var(--line);padding-top:8px;margin-top:8px"><b style="color:var(--gold)">'+t('r_payouts')+'</b> <span class="up">'+t('r_payouts_t',fmtUSD(r.payout))+'</span></div>';
    else if(Object.values(r.hedged).some(Boolean)) h+='<div class="hint" style="margin-top:8px">'+t('r_unused')+'</div>';
    rb.innerHTML=h; rp.style.display='block';
  } else rp.style.display='none';
}

let toastT;
function toast(msg,warn){const t=document.getElementById('toast');t.innerHTML=msg;t.className='toast show'+(warn?' warn':'');
  clearTimeout(toastT);toastT=setTimeout(()=>t.className='toast'+(warn?' warn':''),2600);}

function endGame(){
  const eq=equity(); const ret=(eq-S.startEquity)/S.startEquity*100;
  const hedgeEff=S.premiumPaid>0?S.payoutReceived/S.premiumPaid:(S.payoutReceived>0?2:1);
  const premPct=S.premiumPaid/S.startEquity*100;
  let pts=50;
  pts+=Math.max(-35,Math.min(45,ret*1.4));
  pts-=Math.max(0,(S.maxDD-8)*2.2);
  pts+=Math.min(14,S.crashesProtected*7);
  pts-=S.crashesUnprotected*8;
  pts-=Math.max(0,(premPct-12)*1.5);
  pts=Math.max(0,Math.min(100,Math.round(pts)));
  const grade=pts>=85?'A':pts>=70?'B':pts>=55?'C':pts>=40?'D':'F';
  const ddScore=S.maxDD<8?t('d_smooth'):S.maxDD<18?t('d_bumpy'):t('d_volatile');
  const effScore=hedgeEff>=1.2?t('d_paid'):hedgeEff>=0.6?t('d_reasonable'):t('d_heavy');

  const dbg=[
    [t('d_final'), t('d_final_v',fmtUSD(eq),(ret>=0?'+':'')+ret.toFixed(1)+'%'), ret>=0?'up':'down'],
    [t('d_dd'), t('d_dd_v',ddScore,S.maxDD.toFixed(1)), S.maxDD<8?'up':S.maxDD<18?'flat':'down'],
    [t('d_crashes'), t('d_crash_v',S.crashesProtected,S.crashesUnprotected), S.crashesUnprotected===0?'up':S.crashesProtected>=S.crashesUnprotected?'flat':'down'],
    [t('d_eff'), t('d_eff_v',effScore,hedgeEff.toFixed(2)), hedgeEff>=1?'up':'flat'],
    [t('d_prem'), t('d_prem_v',fmtUSD(S.premiumPaid),premPct.toFixed(1)), premPct<12?'up':'down'],
  ];
  const coaching=coach(ret,S,hedgeEff,premPct);
  document.getElementById('modalInner').innerHTML=`
    <h2>${t('d_title')} <span class="grade" style="background:${grade==='F'||grade==='D'?'var(--neg)':grade==='A'?'var(--pos)':'var(--gold)'}">${grade}</span></h2>
    <div class="score ${ret>=0?'up':'down'}">${pts}<span style="font-size:18px;color:var(--txt-dim)">/100</span></div>
    ${dbg.map(d=>`<div class="debrief-row"><span class="lbl">${d[0]}</span><span class="rating ${d[2]}">${d[1]}</span></div>`).join('')}
    <div style="margin-top:16px;padding:14px;background:var(--panel2);border-radius:8px;border-left:3px solid var(--gold)">
      <div style="font-family:var(--disp);color:var(--gold);font-size:14px;margin-bottom:6px">${t('d_notes')}</div>
      <div style="color:var(--txt-dim);font-size:12px;line-height:1.65">${coaching}</div>
    </div>
    <button class="big-btn" style="margin-top:18px" onclick="restart()">${t('d_again')}</button>`;
  document.getElementById('modalBg').classList.add('show');
}
function coach(ret,s,eff,premPct){
  const n=[];
  if(ret>10) n.push(t('c_strong'));
  else if(ret<0) n.push(t('c_down'));
  if(s.crashesUnprotected>0) n.push(t('c_unprot',s.crashesUnprotected));
  if(premPct>14) n.push(t('c_prem'));
  if(eff<0.5 && s.premiumPaid>0) n.push(t('c_unused'));
  if(s.maxDD>18) n.push(t('c_dd'));
  if(s.rebalances===0) n.push(t('c_noreb'));
  if(n.length===0) n.push(t('c_ok'));
  return n.join(' ');
}
function restart(){
  document.getElementById('modalBg').classList.remove('show');
  S=freshState();
  document.getElementById('advanceBtn').textContent=t('btn_start');
  S.newsMode='reset';
  render();
}
function startGame(){
  document.getElementById('academy').classList.add('hidden');
  document.getElementById('game').classList.remove('hidden');
  document.getElementById('clock').style.display='block';
  S=freshState(); document.getElementById('advanceBtn').textContent=t('btn_start'); render(); window.scrollTo({top:0,behavior:'smooth'});
}
