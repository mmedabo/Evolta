<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Momentum &amp; Energy Lab</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+SC:wght@400;500;600;700&family=Ma+Shan+Zheng&display=swap');

:root{
  --paper:#F5F6F1;
  --grid:#C9D6E0;
  --ink:#20242B;
  --marker-blue:#2B5FAD;
  --marker-red:#C0392B;
  --marker-green:#2E8B57;
  --highlight:#FFE066;
  --panel:#FFFFFF;
  --panel-edge:#DCE1DA;

  /* CJK glyphs fall through to Noto Sans SC per-character; Latin stays on the original face */
  --sans:'Inter','Noto Sans SC',sans-serif;
  --mono:'JetBrains Mono','Noto Sans SC',monospace;
  --hand:'Kalam','Noto Sans SC',cursive;
  --hand-title:'Kalam','Ma Shan Zheng',cursive;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--paper);
  font-family:var(--sans);
  color:var(--ink);
  min-height:100vh;
  padding:24px 16px 60px;
}
.wrap{max-width:920px;margin:0 auto;}

.top-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:14px;
}
.back-btn{
  font-family:var(--mono);
  font-size:12px;
  letter-spacing:.03em;
  color:#5b6270;
  text-decoration:none;
  border:1.5px solid var(--ink);
  border-radius:6px;
  padding:6px 12px;
  display:inline-block;
  transition:.15s;
}
.back-btn:hover{background:var(--ink);color:#fff;}

.lang-toggle{
  font-family:var(--mono);
  font-size:12px;
  letter-spacing:.03em;
  color:#5b6270;
  background:var(--panel);
  border:1.5px solid var(--ink);
  border-radius:6px;
  padding:6px 12px;
  cursor:pointer;
  margin:0;
  transition:.15s;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
.lang-toggle:hover{background:var(--ink);color:#fff;}

.title-row{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:4px;}
h1{
  font-family:var(--hand-title);
  font-size:34px;
  margin:0;
  font-weight:700;
  transform:rotate(-0.6deg);
}
.subtitle{
  font-family:var(--hand);
  font-size:16px;
  color:#5b6270;
}
.score-badge{
  margin-left:auto;
  font-family:var(--mono);
  font-size:14px;
  background:linear-gradient(120deg, var(--highlight) 0%, var(--highlight) 100%);
  background-repeat:no-repeat;
  padding:6px 12px;
  border-radius:2px;
  font-weight:600;
}

.tabs{display:flex;gap:8px;margin:18px 0 16px;flex-wrap:wrap;}
.tab{
  font-family:var(--hand);
  font-size:17px;
  padding:8px 18px;
  border:2px solid var(--ink);
  border-bottom:none;
  border-radius:8px 8px 0 0;
  background:#eceee7;
  cursor:pointer;
  transform:translateY(2px);
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
.tab.active{background:var(--panel);transform:translateY(0);font-weight:700;}

.board{
  border:2px solid var(--ink);
  border-radius:0 8px 8px 8px;
  background:var(--panel);
  padding:20px;
  display:grid;
  grid-template-columns:1fr 300px;
  gap:20px;
}
@media (max-width:720px){ .board{grid-template-columns:1fr;} }

canvas{
  width:100%;
  height:auto;
  background:
    linear-gradient(var(--grid) 1px, transparent 1px) 0 0/24px 24px,
    linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0/24px 24px,
    #FBFCFA;
  border:1px solid var(--panel-edge);
  border-radius:6px;
  display:block;
}

.panel-section{
  border:1px solid var(--panel-edge);
  border-radius:6px;
  padding:12px 14px;
  margin-bottom:12px;
}
.panel-label{
  font-family:var(--hand);
  font-size:15px;
  margin:0 0 8px;
  color:#444;
}
.given-row{
  display:flex;
  justify-content:space-between;
  font-family:var(--mono);
  font-size:13.5px;
  padding:2px 0;
}
.given-row .a{color:var(--marker-blue);font-weight:600;}
.given-row .b{color:var(--marker-red);font-weight:600;}
.given-row .neutral{color:var(--ink);font-weight:600;}

.predict-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.predict-row label{
  font-family:var(--mono);
  font-size:13.5px;
  min-width:70px;
}
.predict-row input{
  font-family:var(--mono);
  font-size:14px;
  width:90px;
  padding:5px 7px;
  border:1.5px solid var(--ink);
  border-radius:4px;
}

button{
  font-family:var(--hand);
  font-size:15px;
  border:2px solid var(--ink);
  background:var(--panel);
  border-radius:6px;
  padding:8px 14px;
  cursor:pointer;
  margin-right:8px;
  margin-bottom:8px;
}
button:hover{background:#eef1ea;}
button.primary{background:var(--ink);color:#fff;}
button.primary:hover{background:#3a3f4a;}
button:disabled{opacity:0.4;cursor:not-allowed;}

.diff-row{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;}
.diff-btn{
  font-family:var(--mono);
  font-size:12.5px;
  padding:5px 10px;
  border:1.5px solid var(--ink);
  border-radius:14px;
  background:#fff;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
.diff-btn.active{background:var(--ink);color:#fff;}

.feedback{
  font-family:var(--hand);
  font-size:16px;
  padding:10px 12px;
  border-radius:6px;
  margin-top:4px;
  min-height:24px;
}
.hint-box{
  font-family:var(--mono);
  font-size:12.5px;
  line-height:1.6;
  background:#FDF7E3;
  border:1.5px dashed #C9A227;
  border-radius:6px;
  padding:9px 11px;
  margin-top:2px;
  margin-bottom:8px;
  display:none;
}
.hint-box.show{display:block;}
.hint-box .formula{color:#8a6d00;font-weight:600;}
button.hint-btn{background:#FFF6DA;}
button.hint-btn:hover{background:#FBEDBF;}
.feedback.correct{background:#E4F3E9;color:var(--marker-green);}
.feedback.wrong{background:#FBE9E7;color:var(--marker-red);}
.feedback.neutral{color:#777;}

.legend{
  display:flex;
  gap:14px;
  font-family:var(--mono);
  font-size:11.5px;
  margin-top:6px;
  color:#666;
}
.legend span::before{content:'■ ';}
.legend .a::before{color:var(--marker-blue);}
.legend .b::before{color:var(--marker-red);}
.legend .ke::before{color:#E08A2B;}
.legend .pe::before{color:var(--marker-green);}

/* Chinese labels run wider than the English abbreviations */
.lang-zh .predict-row label{min-width:96px;}
.lang-zh .hint-box{line-height:1.75;}

@keyframes impact-shake{
  0%{transform:translate(0,0);}
  20%{transform:translate(-5px,3px);}
  40%{transform:translate(5px,-3px);}
  60%{transform:translate(-4px,2px);}
  80%{transform:translate(3px,-1px);}
  100%{transform:translate(0,0);}
}
canvas.shake{animation:impact-shake 0.35s ease;}

@media (max-width:480px){
  body{padding:16px 10px 48px;}
  h1{font-size:26px;}
  .subtitle{font-size:14px;}
  .tab{font-size:15px;padding:7px 14px;}
  .predict-row label{min-width:60px;font-size:12.5px;}
  .lang-zh .predict-row label{min-width:84px;}
  .board{padding:14px;}
}
</style>
</head>
<body>
<div class="wrap">

  <div class="top-row">
    <a class="back-btn" href="index.html">&larr; Evolta</a>
    <button class="lang-toggle" id="langToggle" type="button">中文</button>
  </div>

  <div class="title-row">
    <h1 id="mainTitle">Momentum Lab</h1>
    <div class="score-badge" id="scoreBadge">0 / 0 correct</div>
  </div>

  <div class="tabs" id="tabsRow">
    <div class="tab active" id="tabMomentum" data-i18n="tab_momentum">Momentum</div>
    <div class="tab" id="tabEnergy" data-i18n="tab_energy">Energy</div>
  </div>

  <div class="board">
    <div>
      <canvas id="canvas" width="600" height="340"></canvas>
      <div class="legend" id="legend"></div>
    </div>

    <div>
      <div class="diff-row" id="diffRow"></div>

      <div class="panel-section">
        <p class="panel-label" data-i18n="label_given">Given</p>
        <div id="givenBox"></div>
      </div>

      <div class="panel-section">
        <p class="panel-label" data-i18n="label_predict">Your prediction</p>
        <div id="predictBox"></div>
        <div class="hint-box" id="hintBox"></div>
        <button class="primary" id="checkBtn" data-i18n="btn_check">Check &amp; Run</button>
        <button class="hint-btn" id="hintBtn" data-i18n="btn_hint">Hint</button>
        <button id="newBtn" data-i18n="btn_new">New Problem</button>
      </div>

      <div class="feedback neutral" id="feedback">Set your prediction, then hit Check &amp; Run.</div>
    </div>
  </div>

</div>

<script>
// ============================================================
//  i18n
//  Strings with interpolated values are stored as functions so
//  word order stays free across languages.
// ============================================================
const I18N = {
  en: {
    doc_title:        'Momentum & Energy Lab',
    lang_other:       '中文',
    lang_aria:        'Switch to Chinese',

    title_momentum:   'Momentum Lab',
    title_energy:     'Energy Lab',
    tab_momentum:     'Momentum',
    tab_energy:       'Energy',

    label_given:      'Given',
    label_predict:    'Your prediction',
    btn_check:        'Check & Run',
    btn_hint:         'Hint',
    btn_new:          'New Problem',

    score:            (s,a) => `${s} / ${a} correct`,
    feedback_start:   'Set your prediction, then hit Check & Run.',

    diff_easy:        'Easy',
    diff_hard:        'Hard',
    diff_2d:          '2D',
    diff_lvl1:        'Level 1',
    diff_lvl2:        'Level 2',
    diff_lvl3:        'Level 3',

    legend_a:         'object A',
    legend_b:         'object B',
    legend_pe:        'PE',
    legend_ke:        'KE',

    given_equal_mass: 'equal mass',
    given_b_rest:     'B at rest',
    given_v0_a:       'v₀ (A, before)',
    given_theta1:     "θ₁ (A's angle after)",
    given_collision:  'collision:',
    coll_elastic:     'elastic',
    coll_inelastic:   'perfectly inelastic',
    coll_elastic2d:   'elastic, top-down 2D',
    given_h0:         'start height h₀',
    given_v0:         'launch speed v₀',
    given_h2:         'second hill h₂',
    given_frictionless:'frictionless ramp',

    predict_maxh:     'max h (m)',
    predict_speed:    'speed (m/s)',

    hint_why:         'Why:',
    hint_plugged:     'Plugged in:',
    hint_2d_head:     'Equal-mass elastic collision, target at rest — a classic result: the two paths end up perpendicular (θ₁+θ₂=90°):',
    hint_el_head:     'Elastic collision — both quantities are conserved:',
    hint_el_momentum: 'Momentum:',
    hint_el_ke:       'KE:',
    hint_el_general:  'Overall formula (solving that system):',
    hint_inel_head:   'Perfectly inelastic — objects stick together, only momentum is conserved:',
    hint_inel_general:"Overall formula (solving for v'):",
    hint_e_bottom:    'Energy conservation: PE at top → KE at bottom (m cancels):',
    hint_e_peak:      'Energy conservation: KE at launch → PE at peak (m cancels):',
    hint_e_hill:      'Energy conservation between start height and second hill:',

    res_2d_ok:        (a,b,c) => `Nailed it — v₁' = ${a} m/s, v₂' = ${b} m/s, θ₂ = ${c}°.`,
    res_2d_no:        (a,b,c) => `Not quite. Actual: v₁' = ${a} m/s, v₂' = ${b} m/s, θ₂ = ${c}°.`,
    res_el_ok:        (a,b)   => `Nailed it — v₁' = ${a}, v₂' = ${b} m/s.`,
    res_el_no:        (a,b)   => `Not quite. Actual: v₁' = ${a} m/s, v₂' = ${b} m/s.`,
    res_inel_ok:      v => `Nailed it — combined v' = ${v} m/s.`,
    res_inel_no:      v => `Not quite. Actual combined v' = ${v} m/s.`,
    res_h_ok:         h => `Nailed it — max height = ${h} m.`,
    res_h_no:         h => `Not quite. Actual max height = ${h} m.`,
    res_v_ok:         v => `Nailed it — speed = ${v} m/s.`,
    res_v_no:         v => `Not quite. Actual speed = ${v} m/s.`,

    canvas_speed:     v => `speed ≈ ${v} m/s`,
    canvas_combined:  v => `v' (combined) = ${v} m/s`
  },

  zh: {
    doc_title:        '动量与能量实验室',
    lang_other:       'EN',
    lang_aria:        '切换到英文',

    title_momentum:   '动量实验室',
    title_energy:     '能量实验室',
    tab_momentum:     '动量',
    tab_energy:       '能量',

    label_given:      '已知条件',
    label_predict:    '你的预测',
    btn_check:        '检验并运行',
    btn_hint:         '提示',
    btn_new:          '换一题',

    score:            (s,a) => `${s} / ${a} 正确`,
    feedback_start:   '填入你的预测，然后点击"检验并运行"。',

    diff_easy:        '简单',
    diff_hard:        '困难',
    diff_2d:          '二维',
    diff_lvl1:        '第 1 关',
    diff_lvl2:        '第 2 关',
    diff_lvl3:        '第 3 关',

    legend_a:         '物体 A',
    legend_b:         '物体 B',
    legend_pe:        '势能',
    legend_ke:        '动能',

    given_equal_mass: '质量相等',
    given_b_rest:     'B 初始静止',
    given_v0_a:       'v₀（A 碰前）',
    given_theta1:     'θ₁（A 碰后偏角）',
    given_collision:  '碰撞类型：',
    coll_elastic:     '弹性碰撞',
    coll_inelastic:   '完全非弹性碰撞',
    coll_elastic2d:   '弹性碰撞（俯视二维）',
    given_h0:         '初始高度 h₀',
    given_v0:         '发射速度 v₀',
    given_h2:         '第二个坡顶 h₂',
    given_frictionless:'光滑轨道（无摩擦）',

    predict_maxh:     '最大高度 (m)',
    predict_speed:    '速度 (m/s)',

    hint_why:         '为什么：',
    hint_plugged:     '代入数值：',
    hint_2d_head:     '等质量弹性碰撞、被撞物初始静止 —— 经典结论：碰后两者的速度方向互相垂直（θ₁+θ₂=90°）：',
    hint_el_head:     '弹性碰撞 —— 动量与动能同时守恒：',
    hint_el_momentum: '动量守恒：',
    hint_el_ke:       '动能守恒：',
    hint_el_general:  '联立求解后的通式：',
    hint_inel_head:   '完全非弹性碰撞 —— 两物体碰后粘在一起，只有动量守恒：',
    hint_inel_general:"解出 v' 的通式：",
    hint_e_bottom:    '机械能守恒：顶端的重力势能 → 底端的动能（质量 m 可约去）：',
    hint_e_peak:      '机械能守恒：出发时的动能 → 最高点的重力势能（质量 m 可约去）：',
    hint_e_hill:      '初始高度与第二个坡顶之间的机械能守恒：',

    res_2d_ok:        (a,b,c) => `答对了 —— v₁' = ${a} m/s，v₂' = ${b} m/s，θ₂ = ${c}°。`,
    res_2d_no:        (a,b,c) => `还差一点。正确答案：v₁' = ${a} m/s，v₂' = ${b} m/s，θ₂ = ${c}°。`,
    res_el_ok:        (a,b)   => `答对了 —— v₁' = ${a} m/s，v₂' = ${b} m/s。`,
    res_el_no:        (a,b)   => `还差一点。正确答案：v₁' = ${a} m/s，v₂' = ${b} m/s。`,
    res_inel_ok:      v => `答对了 —— 碰后共同速度 v' = ${v} m/s。`,
    res_inel_no:      v => `还差一点。碰后共同速度 v' = ${v} m/s。`,
    res_h_ok:         h => `答对了 —— 最大高度 = ${h} m。`,
    res_h_no:         h => `还差一点。实际最大高度 = ${h} m。`,
    res_v_ok:         v => `答对了 —— 速度 = ${v} m/s。`,
    res_v_no:         v => `还差一点。实际速度 = ${v} m/s。`,

    canvas_speed:     v => `速度 ≈ ${v} m/s`,
    canvas_combined:  v => `v'（共同速度）= ${v} m/s`
  }
};

let LANG = (function(){
  const q = new URLSearchParams(location.search).get('lang');
  if(q && I18N[q]) return q;
  const saved = localStorage.getItem('evolta_lang');
  if(saved && I18N[saved]) return saved;
  return 'en';
})();

function t(key, ...args){
  const v = I18N[LANG][key] !== undefined ? I18N[LANG][key] : I18N.en[key];
  return typeof v === 'function' ? v(...args) : v;
}

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const G = 9.8;

let mode = 'momentum'; // 'momentum' | 'energy'
let difficulty = { momentum: 1, energy: 1 };
let storedProblems = { momentum: {}, energy: {} };
let score = 0, attempts = 0;
let anim = null; // active animation state
let phase = 'setup'; // 'setup' | 'running' | 'result'
let problem = null;
let lastFeedback = { key:'feedback_start', args:[] }; // re-rendered on language switch
let hintWhy = false;

const scoreBadge = document.getElementById('scoreBadge');
const givenBox = document.getElementById('givenBox');
const predictBox = document.getElementById('predictBox');
const feedback = document.getElementById('feedback');
const checkBtn = document.getElementById('checkBtn');
const newBtn = document.getElementById('newBtn');
const diffRow = document.getElementById('diffRow');
const legend = document.getElementById('legend');
const mainTitle = document.getElementById('mainTitle');
const tabMomentum = document.getElementById('tabMomentum');
const tabEnergy = document.getElementById('tabEnergy');
const langToggle = document.getElementById('langToggle');

function rand(min, max){ return Math.round(Math.random()*(max-min))+min; }
function rnd1(x){ return Math.round(x*10)/10; }

// ---------- LANGUAGE SWITCHING ----------
function applyStaticI18n(){
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    el.textContent = t(el.dataset.i18n);
  });
}

function setLang(lang){
  if(!I18N[lang] || lang === LANG) return;
  LANG = lang;
  localStorage.setItem('evolta_lang', lang);
  applyLang();
}

function applyLang(){
  document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'en';
  document.body.classList.toggle('lang-zh', LANG === 'zh');
  document.title = t('doc_title');
  langToggle.textContent = t('lang_other');
  langToggle.setAttribute('aria-label', t('lang_aria'));

  applyStaticI18n();
  mainTitle.textContent = mode === 'momentum' ? t('title_momentum') : t('title_energy');
  scoreBadge.textContent = t('score', score, attempts);
  renderDiffRow();

  // Preserve anything already typed across the re-render
  const typed = ['p1','p2','p3'].map(id=>{
    const el = document.getElementById(id);
    return el ? el.value : null;
  });
  renderProblemUI();
  typed.forEach((v,i)=>{
    if(v === null || v === '') return;
    const el = document.getElementById('p'+(i+1));
    if(el) el.value = v;
  });

  feedback.textContent = t(lastFeedback.key, ...lastFeedback.args);
  if(hintBox.classList.contains('show')) renderHint();

  // Only the pre-run frame is safe to regenerate; a finished run keeps its overlay.
  if(phase === 'setup') drawStatic();
}

langToggle.addEventListener('click', ()=> setLang(LANG === 'en' ? 'zh' : 'en'));

// ---------- MODE TABS ----------
function switchMode(newMode){
  if(mode === newMode) return;
  if(anim) cancelAnimationFrame(anim);
  particles = [];
  mode = newMode;
  tabMomentum.classList.toggle('active', mode==='momentum');
  tabEnergy.classList.toggle('active', mode==='energy');
  mainTitle.textContent = mode==='momentum' ? t('title_momentum') : t('title_energy');
  renderDiffRow();
  newProblem();
}
tabMomentum.addEventListener('click', ()=>switchMode('momentum'));
tabEnergy.addEventListener('click', ()=>switchMode('energy'));

// ---------- DIFFICULTY UI ----------
const levelConfig = {
  momentum: [ {d:1, key:'diff_easy'}, {d:2, key:'diff_hard'}, {d:3, key:'diff_2d'} ],
  energy:   [ {d:1, key:'diff_lvl1'}, {d:2, key:'diff_lvl2'}, {d:3, key:'diff_lvl3'} ]
};
function renderDiffRow(){
  diffRow.innerHTML = '';
  levelConfig[mode].forEach(({d,key})=>{
    const b = document.createElement('div');
    b.className = 'diff-btn' + (difficulty[mode]===d ? ' active' : '');
    b.textContent = t(key);
    b.onclick = ()=>{
      if(difficulty[mode] === d) { renderDiffRow(); return; }
      difficulty[mode]=d;
      renderDiffRow();
      newProblem();
    };
    diffRow.appendChild(b);
  });
}

// ---------- MOMENTUM PROBLEM GENERATION ----------
function genMomentumProblem(){
  const d = difficulty.momentum;
  let m1,m2,v1,v2,type;
  if(d===1){
    m1 = rand(2,5); m2 = m1; // equal mass
    v1 = rand(2,6); v2 = -rand(1,4);
    type = 'elastic';
  } else if(d===2){
    m1 = rand(1,3); m2 = rand(4,8);
    v1 = rand(3,7); v2 = rand(-2,2);
    type = 'elastic';
  } else {
    // 2D billiard-style: equal masses, B at rest, A scatters off at a given angle
    const m = rand(2,5);
    const v0 = rand(4,8);
    const theta1 = rand(20,65); // degrees
    return { m1:m, m2:m, v0, theta1, type:'elastic2d' };
  }
  return {m1,m2,v1,v2,type};
}

function solveMomentum(p){
  if(p.type === 'elastic2d'){
    const theta1rad = p.theta1*Math.PI/180;
    return {
      v1f: rnd1(p.v0*Math.cos(theta1rad)),
      v2f: rnd1(p.v0*Math.sin(theta1rad)),
      theta2: rnd1(90 - p.theta1)
    };
  }
  const {m1,m2,v1,v2,type} = p;
  if(type==='elastic'){
    const v1f = ((m1-m2)*v1 + 2*m2*v2)/(m1+m2);
    const v2f = ((m2-m1)*v2 + 2*m1*v1)/(m1+m2);
    return {v1f: rnd1(v1f), v2f: rnd1(v2f)};
  } else {
    const vf = (m1*v1 + m2*v2)/(m1+m2);
    return {vf: rnd1(vf)};
  }
}

// ---------- ENERGY PROBLEM GENERATION ----------
function genEnergyProblem(){
  const d = difficulty.energy;
  if(d===1){
    const h0 = rand(3,10);
    return { kind:'speedAtBottom', h0 };
  } else if(d===2){
    const v0 = rand(4,9);
    return { kind:'heightFromSpeed', v0 };
  } else {
    const h0 = rand(6,12);
    const h2 = rand(1, h0-2);
    return { kind:'speedAtHill', h0, h2 };
  }
}

function solveEnergy(p){
  if(p.kind==='speedAtBottom'){
    return { v: rnd1(Math.sqrt(2*G*p.h0)) };
  } else if(p.kind==='heightFromSpeed'){
    return { h: rnd1((p.v0*p.v0)/(2*G)) };
  } else {
    return { v: rnd1(Math.sqrt(2*G*(p.h0-p.h2))) };
  }
}

// ---------- HINT ----------
const hintBox = document.getElementById('hintBox');
const hintBtn = document.getElementById('hintBtn');

function buildHint(){
  const plugged = `<div class="formula">${t('hint_plugged')}</div>`;
  if(mode==='momentum'){
    if(problem.type==='elastic2d'){
      const {v0,theta1} = problem;
      return `
        <div class="formula">${t('hint_2d_head')}</div>
        v₁' = v₀ cos θ₁<br>
        v₂' = v₀ sin θ₁<br>
        θ₂ = 90° − θ₁<br><br>
        ${plugged}
        v₁' = ${v0} × cos(${theta1}°)<br>
        v₂' = ${v0} × sin(${theta1}°)<br>
        θ₂ = 90° − ${theta1}°
      `;
    }
    const {m1,m2,v1,v2,type} = problem;
    if(type==='elastic'){
      return `
        <div class="formula">${t('hint_el_head')}</div>
        ${t('hint_el_momentum')} m₁v₁ + m₂v₂ = m₁v₁' + m₂v₂'<br>
        ${t('hint_el_ke')} ½m₁v₁² + ½m₂v₂² = ½m₁v₁'² + ½m₂v₂'²<br><br>
        ${plugged}
        (${m1})(${v1}) + (${m2})(${v2}) = (${m1})v₁' + (${m2})v₂'<br>
        ½(${m1})(${v1})² + ½(${m2})(${v2})² = ½(${m1})v₁'² + ½(${m2})v₂'²<br><br>
        <div class="formula">${t('hint_el_general')}</div>
        v₁' = [(m₁−m₂)v₁ + 2m₂v₂] / (m₁+m₂)<br>
        v₂' = [(m₂−m₁)v₂ + 2m₁v₁] / (m₁+m₂)<br><br>
        ${plugged}
        v₁' = [(${m1}−${m2})(${v1}) + 2(${m2})(${v2})] / (${m1}+${m2})<br>
        v₂' = [(${m2}−${m1})(${v2}) + 2(${m1})(${v1})] / (${m1}+${m2})
      `;
    } else {
      return `
        <div class="formula">${t('hint_inel_head')}</div>
        ${t('hint_el_momentum')} m₁v₁ + m₂v₂ = (m₁+m₂)v'<br><br>
        ${plugged}
        (${m1})(${v1}) + (${m2})(${v2}) = (${m1}+${m2})v'<br><br>
        <div class="formula">${t('hint_inel_general')}</div>
        v' = (m₁v₁ + m₂v₂) / (m₁+m₂)<br><br>
        ${plugged}
        v' = (${m1}×${v1} + ${m2}×${v2}) / (${m1}+${m2})
      `;
    }
  } else {
    if(problem.kind==='speedAtBottom'){
      return `
        <div class="formula">${t('hint_e_bottom')}</div>
        v = √(2 g h₀)<br><br>
        ${plugged}
        v = √(2 × 9.8 × ${problem.h0})
      `;
    } else if(problem.kind==='heightFromSpeed'){
      return `
        <div class="formula">${t('hint_e_peak')}</div>
        h = v₀² / (2g)<br><br>
        ${plugged}
        h = ${problem.v0}² / (2 × 9.8)
      `;
    } else {
      return `
        <div class="formula">${t('hint_e_hill')}</div>
        v = √(2 g (h₀ − h₂))<br><br>
        ${plugged}
        v = √(2 × 9.8 × (${problem.h0} − ${problem.h2}))
      `;
    }
  }
}

function renderHint(){
  const why = hintWhy ? `<div class="formula">${t('hint_why')}</div>` : '';
  hintBox.innerHTML = why + buildHint();
}

// ---------- CHECK BUTTON ----------
checkBtn.addEventListener('click', ()=>{
  if(phase!=='setup' || attempts_lock) return;
  attempts_lock = true;
  attempts++;
  let correct = false, fb = null;
  if(mode==='momentum'){
    const sol = solveMomentum(problem);
    const p1 = parseFloat(document.getElementById('p1').value);
    if(problem.type==='elastic2d'){
      const p2 = parseFloat(document.getElementById('p2').value);
      const p3 = parseFloat(document.getElementById('p3').value);
      const ok1 = Math.abs(p1 - sol.v1f) <= 0.3;
      const ok2 = Math.abs(p2 - sol.v2f) <= 0.3;
      const ok3 = Math.abs(p3 - sol.theta2) <= 3;
      correct = ok1 && ok2 && ok3;
      fb = { key: correct ? 'res_2d_ok' : 'res_2d_no', args:[sol.v1f, sol.v2f, sol.theta2] };
    } else if(problem.type==='elastic'){
      const p2 = parseFloat(document.getElementById('p2').value);
      const ok1 = Math.abs(p1 - sol.v1f) <= 0.3;
      const ok2 = Math.abs(p2 - sol.v2f) <= 0.3;
      correct = ok1 && ok2;
      fb = { key: correct ? 'res_el_ok' : 'res_el_no', args:[sol.v1f, sol.v2f] };
    } else {
      correct = Math.abs(p1 - sol.vf) <= 0.3;
      fb = { key: correct ? 'res_inel_ok' : 'res_inel_no', args:[sol.vf] };
    }
    startMomentumAnim(sol);
  } else {
    const sol = solveEnergy(problem);
    const p1 = parseFloat(document.getElementById('p1').value);
    if(problem.kind==='heightFromSpeed'){
      correct = Math.abs(p1 - sol.h) <= 0.3;
      fb = { key: correct ? 'res_h_ok' : 'res_h_no', args:[sol.h] };
    } else {
      correct = Math.abs(p1 - sol.v) <= 0.3;
      fb = { key: correct ? 'res_v_ok' : 'res_v_no', args:[sol.v] };
    }
    startEnergyAnim(sol);
  }
  if(correct) score++;
  scoreBadge.textContent = t('score', score, attempts);
  feedback.className = 'feedback ' + (correct?'correct':'wrong');
  lastFeedback = fb;
  feedback.textContent = t(fb.key, ...fb.args);
  checkBtn.disabled = true;
  if(!correct){
    hintWhy = true;
    renderHint();
    hintBox.classList.add('show');
  }
});

// ---------- CANVAS DRAWING ----------
const W = 600, H = 340;

// ---- impact particles / screen shake ----
let particles = [];
function spawnBurst(x, y, color){
  for(let i=0;i<14;i++){
    const angle = Math.random()*Math.PI*2;
    const speed = 1 + Math.random()*3.2;
    particles.push({x, y, vx:Math.cos(angle)*speed, vy:Math.sin(angle)*speed, life:1, color});
  }
}
function updateAndDrawParticles(){
  if(!particles.length) return;
  particles.forEach(p=>{ p.x += p.vx; p.y += p.vy; p.vx *= 0.94; p.vy *= 0.94; p.life -= 0.045; });
  particles = particles.filter(p=>p.life>0);
  particles.forEach(p=>{
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha = 1;
}
function impactBurst(x, y, colorA, colorB){
  spawnBurst(x, y, colorA || '#2B5FAD');
  spawnBurst(x, y, colorB || '#C0392B');
  canvas.classList.remove('shake');
  void canvas.offsetWidth; // restart animation
  canvas.classList.add('shake');
}

function drawStatic(){
  ctx.clearRect(0,0,W,H);
  particles = [];
  if(mode==='momentum'){
    if(problem.type==='elastic2d') drawMomentum2DFrame({ax:60, ay:175, bx:W/2, by:175, stage:'approach'});
    else drawMomentumFrame(problem.m1, problem.v1, problem.m2, problem.v2, 0);
  } else drawEnergyFrame(0);
}

// ---- Momentum drawing ----
function drawMomentumFrame(m1, v1, m2, v2, t, mergedInfo){
  ctx.clearRect(0,0,W,H);
  const trackY = 220;
  ctx.strokeStyle = '#8a8f86';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(30, trackY); ctx.lineTo(W-30, trackY); ctx.stroke();

  const scale = 22; // px per meter for size
  const w1 = 30 + Math.sqrt(m1)*8;
  const w2 = 30 + Math.sqrt(m2)*8;

  let x1, x2, merged=false;
  if(mergedInfo && mergedInfo.merged){
    x1 = mergedInfo.x; x2 = mergedInfo.x + w1 + 4;
    merged = true;
  } else {
    x1 = mergedInfo ? mergedInfo.x1 : W*0.32;
    x2 = mergedInfo ? mergedInfo.x2 : W*0.62;
  }

  // draw block A
  ctx.fillStyle = 'rgba(43,95,173,0.15)';
  ctx.strokeStyle = 'var(--marker-blue)';
  ctx.strokeStyle = '#2B5FAD';
  ctx.lineWidth = 2.5;
  roundRect(x1-w1/2, trackY-34, w1, 34, 5); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#2B5FAD';
  ctx.font = '600 12px JetBrains Mono';
  ctx.textAlign='center';
  ctx.fillText('A', x1, trackY-14);

  // draw block B
  ctx.fillStyle = 'rgba(192,57,43,0.15)';
  ctx.strokeStyle = '#C0392B';
  roundRect(x2-w2/2, trackY-34, w2, 34, 5); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#C0392B';
  ctx.fillText('B', x2, trackY-14);

  // velocity vectors (arrows above)
  drawVectorArrow(x1, trackY-52, v1, '#2B5FAD');
  if(!merged) drawVectorArrow(x2, trackY-52, v2, '#C0392B');

  updateAndDrawParticles();
  ctx.textAlign = 'left';

  return {x1,x2,w1,w2,trackY};
}

function drawVectorArrow(cx, y, v, color){
  if(Math.abs(v) < 0.05) return;
  const len = Math.max(-40, Math.min(40, v*6));
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(cx, y); ctx.lineTo(cx+len, y); ctx.stroke();
  const dir = len>=0?1:-1;
  ctx.beginPath();
  ctx.moveTo(cx+len, y);
  ctx.lineTo(cx+len-8*dir, y-5);
  ctx.lineTo(cx+len-8*dir, y+5);
  ctx.closePath(); ctx.fill();
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function startMomentumAnim(sol){
  if(problem.type==='elastic2d'){ startMomentum2DAnim(sol); return; }
  phase = 'running';
  const {m1,v1,m2,v2,type} = problem;
  const trackY = 220;
  let x1 = W*0.32, x2 = W*0.62;
  const meetX = (x1+x2)/2;
  const closingSpeed = Math.max(0.3, (v1-v2));
  const approachDuration = 900; // ms
  const startTime = performance.now();
  const postDuration = 1400;
  let burstDone = false;

  function step(now){
    const t = now - startTime;
    if(t < approachDuration){
      const f = t/approachDuration;
      const cx1 = x1 + (meetX-16 - x1)*f;
      const cx2 = x2 + (meetX+16 - x2)*f;
      drawMomentumFrame(m1,v1,m2,v2,t,{x1:cx1, x2:cx2});
      anim = requestAnimationFrame(step);
    } else {
      if(!burstDone){ impactBurst(meetX, trackY-17); burstDone = true; }
      const f = Math.min(1, (t-approachDuration)/postDuration);
      if(type==='elastic'){
        const cx1 = (meetX-16) + sol.v1f*6*f;
        const cx2 = (meetX+16) + sol.v2f*6*f;
        drawMomentumFrame(m1, f<1?v1:sol.v1f, m2, f<1?v2:sol.v2f, t, {x1:cx1, x2:cx2});
        if(f<1){
          drawFinalVelOverlay(sol);
          anim = requestAnimationFrame(step);
        } else {
          finishMomentumAnim(sol);
        }
      } else {
        const mx = meetX-16 + sol.vf*6*f;
        drawMomentumFrame(m1+m2, sol.vf, 0, 0, t, {merged:true, x:mx});
        if(f<1){ anim = requestAnimationFrame(step); }
        else { finishMomentumAnim(sol); }
      }
    }
  }
  anim = requestAnimationFrame(step);
}

function drawFinalVelOverlay(){}

function finishMomentumAnim(sol){
  phase = 'result';
  ctx.font = '600 13px JetBrains Mono';
  ctx.fillStyle = '#20242B';
  ctx.textAlign = 'center';
  if(problem.type==='elastic'){
    ctx.fillText(`v₁' = ${sol.v1f} m/s     v₂' = ${sol.v2f} m/s`, W/2, 300);
  } else {
    ctx.fillText(t('canvas_combined', sol.vf), W/2, 300);
  }
  ctx.textAlign = 'left';
}

// ---- 2D momentum drawing (top-down billiard scattering) ----
function drawMomentum2DFrame(state){
  const {ax, ay, bx, by, showAngles} = state;
  ctx.clearRect(0,0,W,H);
  const cx = W/2, cy = 175;

  ctx.strokeStyle = '#d8ddd2'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(30, cy); ctx.lineTo(W-30, cy); ctx.stroke();

  if(showAngles){
    ctx.setLineDash([4,4]);
    ctx.strokeStyle = '#aab0a5';
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(ax, ay); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(bx, by); ctx.stroke();
    ctx.setLineDash([]);
  }

  ctx.fillStyle = 'rgba(43,95,173,0.18)'; ctx.strokeStyle = '#2B5FAD'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(ax, ay, 14, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#2B5FAD'; ctx.font = '600 12px JetBrains Mono'; ctx.textAlign = 'center';
  ctx.fillText('A', ax, ay+4);

  ctx.fillStyle = 'rgba(192,57,43,0.18)'; ctx.strokeStyle = '#C0392B';
  ctx.beginPath(); ctx.arc(bx, by, 14, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#C0392B'; ctx.fillText('B', bx, by+4);

  updateAndDrawParticles();
  ctx.textAlign = 'left';
}

function startMomentum2DAnim(sol){
  phase = 'running';
  const cx = W/2, cy = 175;
  const startAx = 60;
  const approachDuration = 900;
  const postDuration = 1400;
  const startTime = performance.now();
  let burstDone = false;

  function step(now){
    const t = now - startTime;
    if(t < approachDuration){
      const f = t/approachDuration;
      const ax = startAx + (cx-16 - startAx)*f;
      drawMomentum2DFrame({ax, ay:cy, bx:cx, by:cy, stage:'approach'});
      anim = requestAnimationFrame(step);
    } else {
      if(!burstDone){ impactBurst(cx, cy); burstDone = true; }
      const f = Math.min(1, (t-approachDuration)/postDuration);
      const theta1rad = problem.theta1*Math.PI/180;
      const theta2rad = sol.theta2*Math.PI/180;
      const speedScale = 5.5;
      const ax = cx + Math.cos(theta1rad)*sol.v1f*speedScale*f;
      const ay = cy - Math.sin(theta1rad)*sol.v1f*speedScale*f;
      const bx = cx + Math.cos(theta2rad)*sol.v2f*speedScale*f;
      const by = cy + Math.sin(theta2rad)*sol.v2f*speedScale*f;
      drawMomentum2DFrame({ax, ay, bx, by, stage:'post', showAngles:true});
      if(f < 1){ anim = requestAnimationFrame(step); }
      else { finishMomentum2DAnim(sol); }
    }
  }
  anim = requestAnimationFrame(step);
}

function finishMomentum2DAnim(sol){
  phase = 'result';
  ctx.font = '600 13px JetBrains Mono';
  ctx.fillStyle = '#20242B';
  ctx.textAlign = 'center';
  ctx.fillText(`v₁' = ${sol.v1f} m/s   v₂' = ${sol.v2f} m/s   θ₂ = ${sol.theta2}°`, W/2, 300);
  ctx.textAlign = 'left';
}

// ---- Energy drawing ----
function rampHeight(x, h0, h2){
  // x in [0,1]: 0 = start (h0), 0.5 = bottom (0), 1 = far hill top (h2)
  if(x<=0.5){
    const u = x/0.5;
    return h0 * Math.cos(u*Math.PI/2)*Math.cos(u*Math.PI/2); // smooth h0->0
  } else {
    const u = (x-0.5)/0.5;
    return h2 * (Math.sin(u*Math.PI/2)*Math.sin(u*Math.PI/2));
  }
}

function drawEnergyFrame(ballX){
  ctx.clearRect(0,0,W,H);
  let h0, h2;
  if(problem.kind==='speedAtBottom'){ h0 = problem.h0; h2 = 0; }
  else if(problem.kind==='heightFromSpeed'){ h0 = (problem.v0*problem.v0)/(2*G); h2 = h0; }
  else { h0 = problem.h0; h2 = problem.h2; }

  const padX = 40, padTop = 30, padBottom = 40;
  const trackW = W - padX*2;
  const maxH = Math.max(h0, h2, 1);
  const trackH = H - padTop - padBottom;

  // draw ramp path
  ctx.strokeStyle = '#8a8f86'; ctx.lineWidth = 3;
  ctx.beginPath();
  for(let i=0;i<=100;i++){
    const u = i/100;
    const hx = rampHeight(u, h0, h2);
    const px = padX + u*trackW;
    const py = padTop + trackH - (hx/maxH)*trackH;
    if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  ctx.stroke();

  // ball
  const u = ballX;
  const hx = rampHeight(u, h0, h2);
  const bx = padX + u*trackW;
  const by = padTop + trackH - (hx/maxH)*trackH;
  ctx.fillStyle = '#E08A2B';
  ctx.beginPath(); ctx.arc(bx, by-10, 9, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#a5601a'; ctx.lineWidth=1.5; ctx.stroke();

  // energy bars
  const totalE = h0; // proportional (mgh0), using h as proxy since m cancels
  const curKE = Math.max(0, h0 - hx);
  const barX = W-100, barW = 26, barTop = 30, barH = 140;
  const peH = (hx/totalE)*barH;
  const keH = (curKE/totalE)*barH;
  ctx.fillStyle = '#2E8B57';
  ctx.fillRect(barX, barTop + (barH-peH), barW, peH);
  ctx.fillStyle = '#E08A2B';
  ctx.fillRect(barX+barW+6, barTop + (barH-keH), barW, keH);
  ctx.strokeStyle = '#20242B'; ctx.lineWidth=1.5;
  ctx.strokeRect(barX, barTop, barW, barH);
  ctx.strokeRect(barX+barW+6, barTop, barW, barH);
  ctx.font = `600 11px ${LANG==='zh' ? "'Noto Sans SC', sans-serif" : 'JetBrains Mono'}`;
  ctx.fillStyle='#20242B'; ctx.textAlign='center';
  ctx.fillText(t('legend_pe'), barX+barW/2, barTop+barH+16);
  ctx.fillText(t('legend_ke'), barX+barW+6+barW/2, barTop+barH+16);

  ctx.font = `600 12px ${LANG==='zh' ? "'Noto Sans SC', sans-serif" : 'JetBrains Mono'}`;
  ctx.textAlign='left'; ctx.fillStyle='#20242B';
  ctx.fillText(t('canvas_speed', rnd1(Math.sqrt(2*G*curKE))), padX, 24);
  ctx.textAlign='left';
}

function startEnergyAnim(){
  phase = 'running';
  const duration = 1800;
  const startTime = performance.now();
  function step(now){
    const t = (now-startTime)/duration;
    const u = Math.min(1, t);
    drawEnergyFrame(u);
    if(u<1) anim = requestAnimationFrame(step);
    else { phase='result'; }
  }
  anim = requestAnimationFrame(step);
}

// ---------- INIT ----------
document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'en';
document.body.classList.toggle('lang-zh', LANG === 'zh');
document.title = t('doc_title');
langToggle.textContent = t('lang_other');
langToggle.setAttribute('aria-label', t('lang_aria'));
applyStaticI18n();
mainTitle.textContent = t('title_momentum');
scoreBadge.textContent = t('score', score, attempts);
renderDiffRow();
newProblem();
</script>
