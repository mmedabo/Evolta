<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peak &amp; Dispatch — Power Trading, From Scratch | Evolta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f7f5;
    --bg2:#ffffff;
    --panel:#ffffff;
    --panel2:#f0f5f2;
    --line:#e2e9e4;
    --line2:#d6e0da;
    --green:#1577c9;       /* primary azure (blue theme) */
    --green-lt:#4a9fd8;
    --blue:#0b5ea8;        /* secondary blue */
    --blue-lt:#3a86c8;
    --amber:#d98a1f;       /* energy / spike accent */
    --amber-lt:#f0a83a;
    --accent:#1577c9;
    --pos:#1a7a4c;
    --neg:#c0392b;
    --white:#1a2622;
    --txt:#243530;
    --txt-dim:#5e7068;
    --txt-faint:#94a59d;
    --mono:'IBM Plex Mono',monospace;
    --sans:'Inter',-apple-system,sans-serif;
    --disp:'Fraunces',serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:
      radial-gradient(ellipse at 12% -5%, #e3eefa 0%, transparent 45%),
      radial-gradient(ellipse at 95% 5%, #e7f0f8 0%, transparent 42%),
      var(--bg);
    color:var(--txt);
    font-family:var(--sans);
    font-size:13px;
    line-height:1.5;
    min-height:100vh;
    padding:0 0 60px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:0 20px;position:relative;z-index:2}

  /* Header */
  header{
    border-bottom:1px solid var(--line);
    padding:30px 0 20px;
    margin-bottom:24px;
    display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;
  }
  .brand h1{
    font-family:var(--disp);font-weight:500;font-size:40px;line-height:.95;
    letter-spacing:-.02em;color:var(--green);
  }
  .brand h1 .amp{color:var(--blue);font-style:italic}
  .brand h1 .bolt{color:var(--amber);font-style:normal}
  .brand .sub{color:var(--txt-dim);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;margin-top:8px;font-family:var(--mono)}
  .brand .evolta{color:var(--blue);font-weight:600}
  .topbar{display:flex;align-items:center;gap:14px}
  .back-btn{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;color:var(--txt-dim);text-decoration:none;border:1px solid var(--line2);border-radius:8px;padding:8px 13px;transition:.15s;white-space:nowrap}
  .back-btn:hover{border-color:var(--green);color:var(--green)}
  .clock{text-align:right}
  .clock .month{font-family:var(--disp);font-size:28px;color:var(--blue);font-weight:500}
  .clock .turn{color:var(--txt-faint);font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-family:var(--mono)}

  /* Layout */
  .grid{display:grid;grid-template-columns:1fr 340px;gap:18px;align-items:start}
  @media(max-width:880px){.grid{grid-template-columns:1fr}}

  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:18px 20px;
    margin-bottom:18px;
    box-shadow:0 1px 2px rgba(26,122,76,.04), 0 6px 22px rgba(11,94,168,.04);
  }
  .panel h2{
    font-family:var(--mono);font-weight:500;font-size:11px;color:var(--txt-faint);
    letter-spacing:.14em;text-transform:uppercase;
    margin-bottom:14px;display:flex;align-items:center;gap:8px;
  }
  .panel h2 .dot{width:5px;height:5px;border-radius:50%;background:var(--green)}

  /* Market table */
  .mkt{width:100%;border-collapse:collapse}
  .mkt th{text-align:left;color:var(--txt-faint);font-weight:500;font-size:9.5px;
    letter-spacing:.1em;text-transform:uppercase;padding:4px 8px;border-bottom:1px solid var(--line);font-family:var(--mono)}
  .mkt td{padding:9px 8px;border-bottom:1px solid var(--line)}
  .mkt tr:last-child td{border-bottom:none}
  .mkt .nm{color:var(--txt);font-weight:500}
  .mkt .nm small{display:block;color:var(--txt-faint);font-size:10px;font-weight:400}
  .mkt .px{font-weight:600;font-size:15px;text-align:right;font-family:var(--mono)}
  .mkt .chg{text-align:right;font-size:12px;font-family:var(--mono)}
  .up{color:var(--pos)}.down{color:var(--neg)}.flat{color:var(--txt-faint)}

  /* News */
  .news{border-left:3px solid var(--green);padding:2px 0 2px 14px;margin-bottom:8px}
  .news .hl{color:var(--white);font-weight:600;margin-bottom:4px;font-size:14px}
  .news .src{color:var(--blue);font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-family:var(--mono);font-weight:500}
  .news .ex{color:var(--txt-dim);font-size:12px;margin-top:8px;line-height:1.6;
    border-top:1px solid var(--line);padding-top:8px}
  .news .ex b{color:var(--green)}

  /* Actions */
  .act-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .trade-card{
    background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:13px;
  }
  .trade-card .tt{font-family:var(--disp);font-size:15px;color:var(--green);margin-bottom:3px;font-weight:500}
  .trade-card .td{color:var(--txt-dim);font-size:10.5px;margin-bottom:11px;min-height:30px;line-height:1.5}
  .qty-row{display:flex;align-items:center;gap:6px;margin-bottom:9px}
  .qty-row label{color:var(--txt-dim);font-size:10px;flex:1;font-family:var(--mono);text-transform:uppercase;letter-spacing:.05em}
  input[type=number]{
    width:74px;background:var(--bg2);border:1px solid var(--line2);color:var(--txt);
    font-family:var(--mono);font-size:13px;padding:5px 7px;border-radius:6px;text-align:right;
  }
  input[type=number]:focus{outline:none;border-color:var(--blue)}
  input[type=range]{accent-color:var(--blue);width:100%}
  .btn-row{display:flex;gap:6px}
  button{
    font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.03em;
    border:1px solid var(--line2);background:var(--bg2);color:var(--txt);
    padding:8px 10px;border-radius:7px;cursor:pointer;transition:.13s;flex:1;
  }
  button:hover{border-color:var(--blue);color:var(--blue)}
  button.buy:hover{border-color:var(--green);color:var(--green);background:rgba(26,122,76,.06)}
  button.sell:hover{border-color:var(--neg);color:var(--neg);background:rgba(192,57,43,.05)}
  button:active{transform:translateY(1px)}
  button:disabled{opacity:.4;cursor:not-allowed}
  .big-btn{
    width:100%;padding:15px;font-size:14px;font-family:var(--sans);font-weight:600;
    background:linear-gradient(135deg,var(--green),var(--blue));color:#fff;border:none;
    letter-spacing:.02em;border-radius:10px;box-shadow:0 4px 14px rgba(11,94,168,.18);
  }
  .big-btn:hover{filter:brightness(1.07);color:#fff}
  .ghost-btn{background:transparent;border:1px solid var(--line2);color:var(--txt-dim);
    padding:10px 16px;border-radius:9px;font-family:var(--mono);font-size:11px}
  .ghost-btn:hover{border-color:var(--blue);color:var(--blue)}

  /* Sidebar stats */
  .stat{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line)}
  .stat:last-child{border-bottom:none}
  .stat .k{color:var(--txt-dim);font-size:11px}
  .stat .v{font-weight:600;font-family:var(--mono)}
  .big-num{font-family:var(--disp);font-size:32px;font-weight:500;line-height:1;margin:2px 0 8px;color:var(--blue)}

  /* Position rows */
  .pos{display:flex;justify-content:space-between;align-items:center;padding:8px 0;
    border-bottom:1px solid var(--line);font-size:12px}
  .pos:last-child{border-bottom:none}
  .pos .pl{color:var(--txt);display:flex;flex-direction:column;gap:2px}
  .pos .pl small{color:var(--txt-faint);font-size:10px;font-family:var(--mono)}
  .pos .pr{text-align:right;font-family:var(--mono)}
  .tag{display:inline-block;font-size:9px;padding:2px 6px;border-radius:4px;letter-spacing:.05em;
    text-transform:uppercase;font-weight:600;font-family:var(--mono)}
  .tag.long{background:rgba(26,122,76,.12);color:var(--green)}
  .tag.short{background:rgba(192,57,43,.10);color:var(--neg)}

  /* Risk meter */
  .meter{height:7px;background:var(--line);border-radius:5px;overflow:hidden;margin:8px 0}
  .meter span{display:block;height:100%;transition:.4s;border-radius:5px}

  /* Toast / margin call */
  .toast{
    position:fixed;left:50%;top:20px;transform:translateX(-50%);z-index:50;
    background:var(--bg2);border:1px solid var(--green);border-radius:10px;padding:12px 22px;
    color:var(--txt);font-size:12px;box-shadow:0 10px 36px rgba(11,94,168,.16);max-width:90vw;
    opacity:0;transition:.3s;pointer-events:none;font-family:var(--mono);
  }
  .toast.show{opacity:1;top:32px}
  .toast.warn{border-color:var(--neg);color:var(--neg)}

  /* Modal */
  .modal-bg{position:fixed;inset:0;background:rgba(26,38,34,.55);backdrop-filter:blur(4px);z-index:40;display:none;
    align-items:center;justify-content:center;padding:20px}
  .modal-bg.show{display:flex}
  .modal{background:var(--bg2);border:1px solid var(--line);
    border-radius:18px;padding:30px;max-width:560px;width:100%;max-height:88vh;overflow:auto;
    box-shadow:0 20px 60px rgba(11,94,168,.22)}
  .modal h2{font-family:var(--disp);font-size:28px;color:var(--green);font-weight:500;margin-bottom:6px}
  .modal .score{font-family:var(--disp);font-size:52px;font-weight:500;line-height:1;margin:10px 0;color:var(--blue)}
  .grade{display:inline-block;font-family:var(--disp);font-size:22px;font-weight:600;
    padding:3px 16px;border-radius:10px;background:var(--green);color:#fff;margin-left:10px}
  .debrief-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);gap:14px}
  .debrief-row .lbl{color:var(--txt-dim)}
  .debrief-row .rating{font-weight:600;text-align:right;font-family:var(--mono);font-size:11.5px}

  .hint{color:var(--txt-faint);font-size:10.5px;margin-top:6px;line-height:1.5}
  .hint b{color:var(--txt-dim)}
  .tip{cursor:help;border-bottom:1px dotted var(--txt-faint)}
  .intro-list{list-style:none;margin:10px 0}
  .intro-list li{padding:5px 0 5px 20px;position:relative;color:var(--txt-dim);font-size:12px}
  .intro-list li::before{content:"◆";position:absolute;left:0;color:var(--green);font-size:9px;top:7px}

  /* ============ ACADEMY ============ */
  #academy{max-width:920px;margin:0 auto}
  .acad-panel{
    background:var(--panel);border:1px solid var(--line);border-radius:18px;
    padding:28px 32px;box-shadow:0 1px 2px rgba(26,122,76,.04),0 10px 36px rgba(11,94,168,.06);
  }
  .acad-steps{display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap}
  .acad-steps .s{flex:1;min-width:80px;height:5px;border-radius:4px;background:var(--line);transition:.3s}
  .acad-steps .s.done{background:var(--green)}
  .acad-steps .s.cur{background:linear-gradient(90deg,var(--green),var(--blue))}
  .lesson-kicker{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--amber);font-weight:500;margin-bottom:8px}
  .lesson-title{font-family:var(--disp);font-size:30px;font-weight:500;color:var(--green);line-height:1.05;margin-bottom:10px;letter-spacing:-.01em}
  .lesson-lede{color:var(--txt-dim);font-size:14px;line-height:1.65;margin-bottom:6px;max-width:62ch}
  .lesson-lede b{color:var(--green)}
  .lesson-body{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start;margin:22px 0 8px}
  @media(max-width:760px){.lesson-body{grid-template-columns:1fr}}
  .viz-box{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:18px;min-height:300px}
  .viz-controls{margin-top:14px;display:flex;flex-direction:column;gap:12px}
  .ctrl-row{display:flex;align-items:center;gap:10px}
  .ctrl-row label{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--txt-dim);min-width:110px}
  .chip-row{display:flex;gap:8px;flex-wrap:wrap}
  .chip{font-family:var(--mono);font-size:10.5px;padding:7px 12px;border-radius:20px;border:1px solid var(--line2);background:var(--bg2);color:var(--txt-dim);cursor:pointer;transition:.13s;flex:none}
  .chip:hover{border-color:var(--amber);color:var(--amber)}
  .chip.amber{border-color:var(--amber)}
  .takeaway{background:rgba(217,138,31,.07);border:1px solid rgba(217,138,31,.25);border-radius:10px;padding:13px 15px;margin-top:6px}
  .takeaway .lab{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);font-weight:600;margin-bottom:5px}
  .takeaway .txt{color:var(--txt);font-size:12.5px;line-height:1.6}
  .takeaway .txt b{color:var(--green)}
  .lesson-points{list-style:none;margin:14px 0}
  .lesson-points li{padding:7px 0 7px 26px;position:relative;color:var(--txt-dim);font-size:13px;line-height:1.55}
  .lesson-points li::before{content:"";position:absolute;left:0;top:9px;width:13px;height:13px;border-radius:50%;border:2px solid var(--green)}
  .lesson-points li b{color:var(--txt)}
  .acad-nav{display:flex;justify-content:space-between;align-items:center;margin-top:24px;gap:12px}
  .acad-nav .right{display:flex;gap:10px}
  .read-out{font-family:var(--mono);font-size:12px;color:var(--txt-dim)}
  .read-out b{font-size:15px;color:var(--blue)}
  .big-read{font-family:var(--disp);font-size:26px;color:var(--blue);font-weight:500}
  .live-badge{display:inline-block;font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--green);border:1px solid var(--green);border-radius:5px;padding:2px 7px;margin-left:8px}
  .blink{animation:blink 1.1s steps(2,start) infinite}
  @keyframes blink{to{visibility:hidden}}
  svg text{font-family:var(--mono)}
  .frq-needle{transition:transform .5s cubic-bezier(.2,.8,.25,1)}
  .bar-anim{transition:height .5s cubic-bezier(.2,.8,.25,1),y .5s cubic-bezier(.2,.8,.25,1),fill .3s}
  .line-anim{transition:y1 .5s cubic-bezier(.2,.8,.25,1),y2 .5s cubic-bezier(.2,.8,.25,1),x1 .5s,x2 .5s}
  .price-anim{transition:.5s cubic-bezier(.2,.8,.25,1)}
  .glossary-grid{font-size:11px;color:var(--txt-dim);line-height:1.7}
  .glossary-grid b{color:var(--green)}
  .hidden{display:none !important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1>Peak <span class="amp">&amp;</span> Dispatch <span class="bolt">⚡</span></h1>
      <div class="sub" id="brandSub"></div>
    </div>
    <div class="topbar">
      <div class="clock" id="clock" style="display:none">
        <div class="month" id="monthLabel">—</div>
        <div class="turn" id="turnLabel"></div>
      </div>
      <button class="back-btn" id="langToggle" type="button" style="cursor:pointer;margin-right:8px">中文</button>
      <a class="back-btn" id="backAll" href="TradingGamePortal.html">‹ All games</a>
    </div>
  </header>

  <!-- ===================== ACADEMY ===================== -->
  <div id="academy">
    <div class="acad-panel">
      <div class="acad-steps" id="acadSteps"></div>
      <div id="lessonContent"></div>
      <div class="acad-nav">
        <button class="ghost-btn" id="backBtn" onclick="acadBack()" style="flex:none" data-i18n="nav_back">‹ Back</button>
        <div class="right">
          <button class="ghost-btn" id="skipBtn" onclick="skipToGame()" style="flex:none" data-i18n="nav_skip">Skip to trading ›</button>
          <button class="big-btn" id="nextBtn" onclick="acadNext()" style="width:auto;flex:none;padding:11px 26px">Next ›</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ===================== GAME ===================== -->
  <div id="game" class="grid hidden">
    <!-- LEFT COLUMN -->
    <div>
      <div class="panel" id="newsPanel">
        <h2><span class="dot"></span><span data-i18n="pn_wire">Control Room Wire</span></h2>
        <div id="newsBox"></div>
      </div>

      <div class="panel">
        <h2><span class="dot"></span><span data-i18n="pn_board">Market Board</span></h2>
        <table class="mkt">
          <thead><tr><th data-i18n="th_instrument">Instrument</th><th style="text-align:right" data-i18n="th_price">Price</th><th style="text-align:right" data-i18n="th_chg">Δ mo</th></tr></thead>
          <tbody id="mktBody"></tbody>
        </table>
        <div class="hint" id="sparkHint"></div>
      </div>

      <div class="panel">
        <h2><span class="dot"></span><span data-i18n="pn_desk">Trade Desk</span></h2>
        <div class="act-grid" id="tradeGrid"></div>
        <div style="margin-top:14px">
          <button class="big-btn" id="advanceBtn" onclick="startOrAdvance()">▶ Start Season</button>
        </div>
      </div>
    </div>

    <!-- RIGHT COLUMN -->
    <div>
      <div class="panel">
        <h2><span class="dot"></span><span data-i18n="pn_pnl">P&amp;L</span></h2>
        <div class="big-num" id="equityNum">$5.00M</div>
        <div class="stat"><span class="k" data-i18n="k_realised">Realised P&amp;L</span><span class="v" id="realisedPL">$0</span></div>
        <div class="stat"><span class="k" data-i18n="k_open">Open P&amp;L</span><span class="v" id="openPL">$0</span></div>
        <div class="stat"><span class="k" data-i18n="k_cash">Cash</span><span class="v" id="cashVal">$5.00M</span></div>
        <div class="stat"><span class="k" data-i18n="k_margin">Margin used</span><span class="v" id="marginVal">$0</span></div>
      </div>

      <div class="panel">
        <h2><span class="dot"></span><span data-i18n="pn_risk">Risk</span></h2>
        <div class="stat"><span class="k tip" title=t('tip_netexp')>Net exposure</span><span class="v" id="netExp">$0</span></div>
        <div class="meter"><span id="riskBar" style="width:0%;background:var(--green)"></span></div>
        <div class="hint" id="riskHint"></div>
      </div>

      <div class="panel">
        <h2><span class="dot"></span><span data-i18n="pn_pos">Open Positions</span></h2>
        <div id="posBox"></div>
      </div>

      <div class="panel" id="recapPanel" style="display:none">
        <h2><span class="dot"></span><span data-i18n="pn_recap">This Month's P&amp;L — Why</span></h2>
        <div id="recapBox"></div>
      </div>

      <div class="panel">
        <h2><span class="dot"></span><span data-i18n="pn_gloss">Glossary</span></h2>
        <div class="glossary-grid" id="glossBox"></div>
        <div style="margin-top:12px">
          <button class="ghost-btn" onclick="openAcademy()" style="width:100%" data-i18n="replay_acad">↺ Replay the Academy</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="modal-bg" id="modalBg">
  <div class="modal" id="modalInner"></div>
</div>

<script>
/* =====================================================================
   PART 1 — THE ACADEMY (teach a total beginner, interactively)
   ===================================================================== */

/* The merit order: the heart of power markets. Plants ranked cheapest-first.
   The price everyone gets paid = the running cost of the LAST plant needed
   to meet demand (the "marginal" plant). */

/* ================= i18n ================= */
const I18N={
en:{
  doc_title:'Peak & Dispatch — Power Trading | Evolta',
  lang_other:'中文', lang_aria:'Switch to Chinese',
  brand_sub:'Power Trading — from scratch · <span class="evolta">Evolta — learn · play · evolve</span>',
  back_all:'‹ All games', press_start:'Press start',
  month_of:(m,n)=>'Month '+m+' of '+n,
  months:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],

  nav_back:'‹ Back', nav_skip:'Skip to trading ›', nav_next:'Next ›', nav_enter:'Enter the trading floor ⚡',

  pn_wire:'Control Room Wire', pn_board:'Market Board', pn_desk:'Trade Desk',
  pn_pnl:'P&L', pn_risk:'Risk', pn_pos:'Open Positions',
  pn_recap:"This Month's P&L — Why", pn_gloss:'Glossary',
  th_instrument:'Instrument', th_price:'Price', th_chg:'Δ mo',
  k_realised:'Realised P&L', k_open:'Open P&L', k_cash:'Cash', k_margin:'Margin used',
  btn_start:'▶ Start Season', btn_advance:'▶ Advance Month',
  no_pos:'No open positions.', risk_flat:'Flat. No risk on the book.',
  replay_acad:'↺ Replay the Academy', why_matters:'Why it matters:',

  l0_ttl:"Electricity is a product you can't put in a warehouse",
  l0_lede:"Most things traders buy and sell can be stored — oil in tanks, sugar in sheds, gold in vaults. <b>Electricity is different.</b> It has to be made at the exact instant it's used. That single fact is why power is the most volatile market on earth, and why traders are needed at all.",
  l0_gen:'GENERATION', l0_dem:'DEMAND',
  l0_flows:'flows at the speed of light', l0_same:'made and used in the same instant',
  l0_nobat:"no battery big enough to store a country's power",
  l0_p1:"<b>You are a trader at a merchant power firm.</b> You don't build plants — you buy and sell electricity and the fuel that makes it, to profit from price moves and to manage risk.",
  l0_p2:"<b>Three things you'll trade:</b> power itself, natural gas (the fuel), and the <i>spread</i> between them.",
  l0_p3:"<b>Why it's hard:</b> because power can't be stored, a cold morning or a broken plant can send the price up 10× for a few hours — then back down.",
  l0_lab:'The one idea to hold onto',
  l0_txt:'Supply must equal demand <b>every single second</b>. When that balance is tight, prices explode. The next lesson lets you feel it.',

  l1_ttl:'The grid is a balancing act, live, 24/7',
  l1_lede:'Grid operators keep supply and demand matched to hold the system at <b>50 Hz</b> (its heartbeat). Too little supply and frequency drops toward a blackout; too much and it climbs. Drag the supply dial and watch what happens.',
  l1_supply:'Supply',
  l1_p1:"<b>Demand is fixed by us</b> — when millions of people switch on kettles and air-con, demand just <i>is</i> what it is. The grid can't ask them to wait.",
  l1_p2:'<b>So supply must chase demand</b> in real time. Operators turn plants up and down second by second.',
  l1_p3:"<b>Price is the lever.</b> When supply is scarce, the price is bid up to coax every last plant to run. When there's a glut, price can even go <i>negative</i> — generators pay to keep running.",
  l1_lab:'Try this',
  l1_txt:"Push supply well below demand. See the frequency crash toward blackout — that's the moment a trader who is <b>long power</b> makes a fortune, because the price spikes to keep the lights on.",

  l2_ttl:'The "merit order": cheapest plants run first',
  l2_lede:'Every plant has a running cost. The grid switches them on <b>cheapest first</b> — free solar &amp; wind, then nuclear, coal, gas, and finally expensive peakers. It stacks them up until supply meets demand. Here\'s the magic: <b>everyone gets paid the cost of the LAST plant needed</b> — the "marginal" plant. Drag demand and watch the price.',
  l2_demand:'Demand', l2_clearing:'Clearing price: ',
  l2_p1:'<b>Low demand</b> (night, mild weather): only cheap plants run. Price is low — maybe $0–35.',
  l2_p2:'<b>High demand</b> (cold evening): the grid is forced into expensive peakers. The clearing price jumps to <i>their</i> cost, and <b>every</b> plant — even free solar — gets paid that high price.',
  l2_p3:"That's why a small rise in demand can cause a <b>huge</b> jump in price: the supply stack is steep at the top.",
  l2_lab:'Why traders care',
  l2_txt:'If you can guess when demand will climb into the steep, expensive part of the stack, you buy power cheap today and sell it dear later. <b>Reading the stack is the job.</b>',

  l3_ttl:'Where the violent price spikes come from',
  l3_lede:'Now combine the two ideas. A <b>supply shock</b> (the wind drops, a plant breaks) or a <b>demand shock</b> (a cold snap) shoves the grid up the steep end of the stack. Hit the buttons and watch the price history react in real time.',
  l3_cold:'❄ Cold snap (demand ↑)', l3_wind:'🍃 Wind drops', l3_nuke:'⚙ Plant breaks', l3_calm:'☀ Mild &amp; windy (reset)',
  l3_p1:'<b>Cold snap:</b> heaters everywhere push demand up the stack into peakers. Price can go from $50 to $300+ in an hour.',
  l3_p2:'<b>Wind drops:</b> free wind vanishes from the bottom of the stack, so <i>more expensive</i> plants must fill the gap — the whole stack shifts and price rises.',
  l3_p3:'<b>Plant breaks:</b> sudden loss of cheap supply, same effect — scarcity.',
  l3_p4:'<b>Mild &amp; windy:</b> tons of free renewable supply, weak demand → price collapses, sometimes below zero.',
  l3_lab:"The trader's edge",
  l3_txt:"You can't predict the weather perfectly — but you can read forecasts, plant outages and fuel costs to lean the right way <b>before</b> the spike. That's what the next 12 months will test.",

  l4_ttl:'The spark spread — how a gas plant prints money',
  l4_lede:'A gas plant buys gas and sells electricity. Its profit per MWh is the <b>spark spread</b>: the power price, minus the cost of the gas it burns, minus a small running cost. The "<b>heat rate</b>" (here <b>7.5</b>) is how many units of gas it takes to make one MWh. Slide the prices and watch the margin.',
  l4_sold:'Power sold', l4_burned:'Gas burned', l4_spark:'Spark spread',
  l4_pw:'Power $/MWh', l4_gs:'Gas $/MMBtu',
  l4_p1:"<b>Spark spread = Power − (7.5 × Gas) − $4.</b> If it's positive, the plant earns money by running; if negative, it's cheaper to stay off.",
  l4_p2:'<b>Two ways to widen:</b> power price rises, or gas price falls. A power trader who is "long the spark" wins from either.',
  l4_p3:"<b>It's a cleaner bet than outright power</b> — you're insulated from gas-price swings that move power and gas together.",
  l4_p4:'In the game you\'ll <b>lock</b> a spark spread: secure today\'s margin on a block of generation that settles in ~2 months.',
  l4_lab:'Try this',
  l4_txt:'Drag gas up to $9 while power stays at $58 — the spread goes <b>negative</b>. That gas plant would now <i>lose</i> money running. Real plants shut down here; smart traders saw it coming.',

  l5_ttl:"You're ready for the desk",
  l5_lede:"You now know the four ideas that drive every decision you'll make over the next 12 months:",
  l5_p1:"<b>Power can't be stored</b> — supply must match demand every second, so prices are wild.",
  l5_p2:'<b>The merit order sets the price</b> — the cost of the last plant needed sets what everyone is paid.',
  l5_p3:'<b>Shocks cause spikes</b> — cold snaps, wind droughts and plant outages push the grid up the steep, expensive end of the stack.',
  l5_p4:"<b>The spark spread</b> — Power − 7.5×Gas − $4 — is a gas plant's margin, and your cleanest trade.",
  l5_lab:'Your job for 12 months',
  l5_txt:"Start with <b>$5M</b>. Read each news headline, decide whether it's bullish or bearish for power, gas, or the spark, and size your trades. Watch your <b>risk</b> — too much leverage and a spike can margin-call you. A full <b>debrief</b> grades you at the end. You can replay this Academy any time from the Glossary panel.",
  l5_tip:"Tip: hover any underlined term on the trading floor for a quick definition. There's a live spark-spread calculator on the desk, just like Lesson 5.",

function renderSteps(){
  const el = document.getElementById('acadSteps');
  el.innerHTML = ACAD_LESSONS.map((_,i)=>{
    const c = i<acadStep?'done':i===acadStep?'cur':'';
    return `<div class="s ${c}"></div>`;
  }).join('');
}

function renderAcademy(){
  renderSteps();
  ACAD_LESSONS[acadStep]();
  document.getElementById('backBtn').style.visibility = acadStep===0?'hidden':'visible';
  const next = document.getElementById('nextBtn');
  next.textContent = acadStep===ACAD_LESSONS.length-1 ? t('nav_enter') : t('nav_next');
  document.getElementById('skipBtn').style.display = acadStep===ACAD_LESSONS.length-1?'none':'inline-block';
}
function acadNext(){
  if(acadStep>=ACAD_LESSONS.length-1){ startGame(); return; }
  acadStep++; renderAcademy(); window.scrollTo({top:0,behavior:'smooth'});
}
function acadBack(){ if(acadStep>0){ acadStep--; renderAcademy(); window.scrollTo({top:0,behavior:'smooth'}); } }
function skipToGame(){ startGame(); }
function openAcademy(){
  document.getElementById('game').classList.add('hidden');
  document.getElementById('clock').style.display='none';
  document.getElementById('academy').classList.remove('hidden');
  acadStep=0; renderAcademy(); window.scrollTo({top:0,behavior:'smooth'});
}

function updateBalance(v){
  balSupply = +v;
  const demand = 50;
  const gap = balSupply - demand;                 // +surplus / -deficit
  const hz = (50 + gap*0.08).toFixed(1);
  const ang = Math.max(-78,Math.min(78, gap*2.4)); // needle rotation
  const ng = document.getElementById('needleG');
  if(ng) ng.style.transform = `rotate(${ang}deg)`;
  document.getElementById('hzNum').textContent = hz;
  const st = document.getElementById('gridState');
  const rd = document.getElementById('balRead');
  let label, col;
  if(Math.abs(gap)<=3){ label='● balanced — lights stay on'; col='#1a7a4c'; }
  else if(gap<-12){ label='⚠ severe shortfall — BLACKOUT risk, price spiking'; col='#c0392b'; }
  else if(gap<0){ label='▼ short of supply — price rising'; col='#d98a1f'; }
  else if(gap>12){ label='▲ big glut — price can go NEGATIVE'; col='#0b5ea8'; }
  else { label='▲ surplus — price falling'; col='#0b5ea8'; }
  st.textContent = label; st.setAttribute('fill',col);
  document.getElementById('hzNum').setAttribute('fill', Math.abs(gap)<=3?'#0b5ea8':col);
  rd.innerHTML = `Supply <b>${balSupply}</b> GW · Demand <b>${demand}</b> GW · ${gap===0?'matched':gap>0?('+'+gap+' surplus'):(gap+' short')}`;
}

function meritGeometry(){
  // x: 44..366 maps cumulative capacity 0..130 GW; y: 232(=$0)..20(=$ max, log-ish)
  const x0=44,x1=366,y0=232,yTop=20;
  const capMax=130;
  const xOf = c => x0 + (c/capMax)*(x1-x0);
  // price scale: 0..520 but compress high end so peakers fit
  const yOf = cost => {
    const frac = Math.sqrt(Math.min(cost,520)/520); // sqrt compression
    return y0 - frac*(y0-yTop);
  };
  return {xOf,yOf};
}
function updateMerit(d){
  moDemand=d;
  const {xOf,yOf}=meritGeometry();
  // build bars
  let cum=0, marginal=STACK[STACK.length-1], price=STACK[STACK.length-1].cost;
  let found=false;
  const bars = STACK.map(p=>{
    const x=xOf(cum), w=xOf(cum+p.cap)-xOf(cum), yTopB=yOf(p.cost), h=232-yTopB;
    const dim = cum>=d; // beyond demand = not dispatched
    if(!found && cum+p.cap>=d){ marginal=p; price=p.cost; found=true; }
    cum+=p.cap;
    return {x,w,yTopB,h,color:p.color,name:t(p.key),dim};
  });

  `).join('');

  const dl=document.getElementById('moDemandLine');
  dl.setAttribute('x1',dx); dl.setAttribute('x2',dx);
  document.getElementById('moDemandLbl').setAttribute('x',dx);

  pl.setAttribute('y1',py); pl.setAttribute('y2',py);
  const plbl=document.getElementById('moPriceLbl');
  plbl.setAttribute('y',py-4); plbl.textContent='$'+price;
  document.getElementById('moPrice').textContent='$'+price;

}

function computeSpikePrice(){
  // rebuild stack with current wind/nuke, find clearing price at demand
  let stack = STACK.map(p=>({...p}));
  stack[1].cap = spikeBase.wind;                 // wind capacity
  if(spikeBase.nukeOut) stack[2].cap = 4;        // nuclear partly out
  let cum=0, price=stack[stack.length-1].cost;
  for(const p of stack){ if(cum+p.cap>=spikeBase.demand){ price=p.cost; break; } cum+=p.cap; }
  return price;
}
function spikeEvent(kind){
  if(kind==='cold'){ spikeBase.demand=Math.min(120,spikeBase.demand+22); }
  else if(kind==='wind'){ spikeBase.wind=Math.max(2,spikeBase.wind-12); }

  else { spikeBase={demand:48, wind:24, nukeOut:false}; }

  priceHist.push(p); priceHist.push(p); if(priceHist.length>28) priceHist=priceHist.slice(-28);
  drawSpike();

              kind==='wind'?'🍃 Wind drops — cheap supply gone, costlier plants fill in.':

              '☀ Mild &amp; windy — free renewables flood in, price collapses.';
  rd.innerHTML = `${msg} &nbsp;Now <b>$${p}/MWh</b>.`;
}

/* =====================================================================
   PART 2 — THE TRADING GAME
   ===================================================================== */
const HEAT_RATE = 7.5;          // MMBtu of gas per MWh
const VOM = 4;                  // $/MWh variable running cost
const MWH_PER_LOT_PWR = 1000;   // power forward: 1 lot = 1,000 MWh (baseload block)
const MMBTU_PER_LOT_GAS = 10000;// gas: 1 lot = 10,000 MMBtu
const START_CASH = 5_000_000;
const MARGIN_RATE = 0.10;
const MAINT_RATE = 0.07;
const SPARK_MONTHS = 2;         // generation block settles in ~2 months
/* month labels live in the dictionary; MON(i) resolves them */

let S=null;
function freshState(){
  return {newsMode:'intro',
    started:false, turn:0, cash:START_CASH, realised:0,
    power:58,           // $/MWh baseload
    gas:4.0,            // $/MMBtu
    carbon:75,          // $/t CO2
    wind:55,            // % renewable output (affects power)
    peakPrem:34,        // $/MWh peak premium (info / colour)
    pos:[],             // {key,name,side,lots,entryPx}
    sparks:[],          // generation blocks {mwh, lockedSpark, monthsLeft, hedged}
    directionalRight:0, directionalWrong:0,
    sparksTaken:0, sparksMissed:0,
    maxRiskBreach:0, marginCalls:0, capacityEarned:0,
    lastPower:58, lastGas:4.0, lastCarbon:75, lastWind:55, lastSpark:0,
    history:[], pendingNews:null, recap:null,
  };
}

/* ---- news engine ---- */
const NEWS_POOL=[
  {id:0,  eff:s=>{s.dPower+=14; s.dGas+=0.5;}},
  {id:1,  eff:s=>{s.dPower-=12; s.dWind+=18;}},
  {id:2,  eff:s=>{s.dGas+=1.2; s.dPower+=9;}},
  {id:3,  eff:s=>{s.dGas+=0.9; s.dPower+=5;}},
  {id:4,  eff:s=>{s.dPower+=11;}},
  {id:5,  eff:s=>{s.dPower-=8; s.dWind+=10;}},
  {id:6,  eff:s=>{s.dCarbon+=14; s.dPower+=6;}},
  {id:7,  eff:s=>{s.dCarbon-=12; s.dPower-=5;}},
  {id:8,  eff:s=>{s.dPower+=12; s.dGas+=0.4;}},
  {id:9,  eff:s=>{s.dPower-=7; s.dGas-=0.3;}},
  {id:10, eff:s=>{s.dGas-=0.8; s.dPower-=3;}},
  {id:11, eff:s=>{s.dPower+=8; s.dGas+=0.3;}},
  {id:12, eff:s=>{s.dPower+=7; s.dCarbon+=3;}},
  {id:13, eff:s=>{s.dPower-=6;}},
];
function pickNews(){ return NEWS_POOL[Math.floor(Math.random()*NEWS_POOL.length)]; }
function newsHTML(){
  if(S.newsMode==='news'&&S.pendingNews){
    const n=S.pendingNews;
    return '<div class="news"><div class="hl">'+t('news'+n.id+'_hl')+'</div><div class="src">'+t('news'+n.id+'_src')+'</div>'+
           '<div class="ex"><b>'+t('why_matters')+'</b> '+t('news'+n.id+'_ex')+'</div></div>';
  }
  if(S.newsMode==='reset'){
    return '<div class="news"><div class="hl">'+t('reset_hl')+'</div><div class="src">'+t('intro_src')+'</div>'+
           '<div class="ex">'+t('reset_ex')+'</div></div>';
  }
  return '<div class="news"><div class="hl">'+t('intro_hl')+'</div><div class="src">'+t('intro_src')+'</div>'+
         '<div class="ex">'+t('intro_ex')+'</div></div>';
}

function applyMonth(news){
  S.dPower=0;S.dGas=0;S.dCarbon=0;S.dWind=0;
  news.eff(S);
  const noise=()=> (Math.random()-0.5);
  S.lastPower=S.power; S.lastGas=S.gas; S.lastCarbon=S.carbon; S.lastWind=S.wind; S.lastSpark=sparkSpread();
  S.power = Math.max(-20, Math.round(S.power + S.dPower + noise()*9));
  S.gas   = Math.max(1.0, +(S.gas + S.dGas + noise()*0.5).toFixed(2));
  S.carbon= Math.max(20, Math.round(S.carbon + S.dCarbon + noise()*5));
  S.wind  = Math.max(8, Math.min(98, Math.round(S.wind + S.dWind + noise()*8)));
  S.peakPrem = Math.max(8, Math.round(S.power*0.55 + noise()*6));
}

/* ---- valuation ---- */
function sparkSpread(){ return S.power - HEAT_RATE*S.gas - VOM; }   // $/MWh
function instrPrice(k){ return k==='power'?S.power : k==='gas'?S.gas : 0; }
function lotNotional(k){
  if(k==='power') return S.power*MWH_PER_LOT_PWR;
  if(k==='gas')   return S.gas*MMBTU_PER_LOT_GAS;
  return 0;
}
function posOpenPL(p){
  const cur=instrPrice(p.key);
  if(p.key==='power') return p.side*(cur-p.entryPx)*MWH_PER_LOT_PWR*p.lots;
  return p.side*(cur-p.entryPx)*MMBTU_PER_LOT_GAS*p.lots;
}
function sparkPL(b){
  if(b.hedged) return 0;
  return (sparkSpread()-b.lockedSpark)*b.mwh;
}
function totalOpenPL(){
  let pl=0; S.pos.forEach(p=>pl+=posOpenPL(p)); S.sparks.forEach(b=>pl+=sparkPL(b)); return pl;
}
function marginUsed(){
  let m=0;
  S.pos.forEach(p=> m+=lotNotional(p.key)*p.lots*MARGIN_RATE);
  S.sparks.forEach(b=> m+= S.power*b.mwh*MARGIN_RATE*0.4); // generation block margin (lighter)
  return m;
}
function netExposure(){
  let e=0;
  S.pos.forEach(p=> e+=p.side*lotNotional(p.key)*p.lots);
  S.sparks.forEach(b=> e+= S.power*b.mwh*0.3); // partial long-power exposure
  return e;
}
function equity(){ return S.cash + totalOpenPL(); }

/* ---- trading ---- */
function trade(key,name,side,lots){
  if(!S.started){ toast(t('toast_start')); return; }
  lots=Math.max(1,Math.floor(lots||1));
  const addMargin=lotNotional(key)*lots*MARGIN_RATE;
  if(marginUsed()+addMargin>equity()){ toast(t('toast_margin'),true); return; }
  let p=S.pos.find(x=>x.key===key);
  const px=instrPrice(key);
  if(p){
    if(p.side===side){
      const tot=p.lots+lots; p.entryPx=(p.entryPx*p.lots+px*lots)/tot; p.lots=tot;
    }else{
      const closeLots=Math.min(p.lots,lots);
      const realised = (key==='power')
        ? p.side*(px-p.entryPx)*MWH_PER_LOT_PWR*closeLots
        : p.side*(px-p.entryPx)*MMBTU_PER_LOT_GAS*closeLots;
      S.realised+=realised; S.cash+=realised; trackDir(realised);
      p.lots-=closeLots;
      const remain=lots-closeLots;
      if(p.lots<=0){ S.pos=S.pos.filter(x=>x!==p); if(remain>0) S.pos.push({key,name,side,lots:remain,entryPx:px}); }
    }
  }else{ S.pos.push({key,name,side,lots,entryPx:px}); }
  render();
}
function trackDir(r){ if(r>0.0001)S.directionalRight++; else if(r<-0.0001)S.directionalWrong++; }

function lockSpark(mwh,hedged){
  if(!S.started){ toast(t('toast_start')); return; }
  mwh=Math.max(5000,Math.floor(mwh||5000));
  let sp=sparkSpread();
  const hedgeCost = hedged?2:0;   // $/MWh to lock both legs
  sp-=hedgeCost;
  const addMargin=S.power*mwh*MARGIN_RATE*0.4;
  if(marginUsed()+addMargin>equity()){ toast(t('toast_margin_block'),true); return; }
  S.sparks.push({mwh,lockedSpark:sp,monthsLeft:SPARK_MONTHS,hedged:!!hedged});
  S.sparksTaken++;
  if(hedged) toast(t('toast_block_h'));
  else if(sp>0) toast(t('toast_block_u'));
  else toast(t('toast_block_neg'),true);
  render();
}
function closeSpark(b){
  const pl = b.hedged ? b.lockedSpark*b.mwh : sparkPL(b);
  S.realised+=pl; S.cash+=pl; trackDir(pl);
  S.sparks=S.sparks.filter(x=>x!==b);
  toast((pl>=0?"+":"")+fmtUSD(pl)+" on the generation block.");
  render();
}
/* Capacity: passive availability fee, low-risk income */
function sellCapacity(mw){
  if(!S.started){ toast(t('toast_start')); return; }
  mw=Math.max(10,Math.floor(mw||50));
  const fee=mw*1400; // $/MW for the month
  S.cash+=fee; S.realised+=fee; S.capacityEarned+=fee;
  toast(`+${fmtUSD(fee)} capacity payment for keeping ${mw} MW available.`);
  render();
}

/* ---- recap ---- */
function buildRecap(news,before){
  const moves=[];
  const fm=(label,b,a,dp,unit,pre)=>{
    const d=a-b; if(Math.abs(d)<(dp===2?0.005:0.5)) return null;
    const dir=d>0?'rose':'fell';
    return `${label} ${dir} ${(pre||'')}${Math.abs(d).toFixed(dp)}${unit} (${pre||''}${b.toFixed(dp)}→${pre||''}${a.toFixed(dp)}${unit})`;
  };
  [ fm('Power',before.power,S.power,0,'/MWh','$'),
    fm('Gas',before.gas,S.gas,2,'','$'),
    fm('Carbon',before.carbon,S.carbon,0,'/t','$'),
    fm('Wind output',before.wind,S.wind,0,'%','') ].forEach(m=>{ if(m)moves.push(m); });

  const lines=[];
  S.pos.forEach(p=>{
    const nowPL=posOpenPL(p);
    const prev=before.posPL.find(x=>x.name===p.name&&x.side===p.side);
    const delta=nowPL-(prev?prev.pl:0);
    if(Math.abs(delta)<1) return;
    lines.push({txt:(p.side>0?t('long'):t('short'))+' '+instrName(p.key)+': '+(delta>=0?'+':'')+fmtUSD(delta),delta});
  });

  let arbDriver='';
  if(S.sparks.some(b=>!b.hedged)){
    const mwh=S.sparks.filter(b=>!b.hedged).reduce((s,b)=>s+b.mwh,0);
    const d=(sparkSpread()-before.spark)*mwh;
    const dPower=S.power-before.power, dGasCost=-(HEAT_RATE*(S.gas-before.gas));
    const drivers=[['power price',dPower],['fuel cost',dGasCost]].sort((a,b)=>Math.abs(b[1])-Math.abs(a[1]));
    const top=drivers[0];
    arbDriver=`Unhedged block: ${d>=0?'+':''}${fmtUSD(d)} — mainly ${top[1]>=0?'a favourable':'an adverse'} move in ${top[0]} (${top[1]>=0?'+':''}$${Math.abs(top[1]).toFixed(0)}/MWh to the spark).`;
  }
  if(S.sparks.some(b=>b.hedged)) arbDriver+=(arbDriver?' ':'')+t('r_hedged_flat');

  S.recap={ month:MON(S.turn), headline:news.hl, moves,
    lines:lines.sort((a,b)=>Math.abs(b.delta)-Math.abs(a.delta)).map(l=>l.txt),
    arbDriver, totalSwing:totalOpenPL()-before.openPL };
}

/* ---- turn advance ---- */
function startOrAdvance(){
  if(!S.started){
    S.started=true; S.turn=0; S.pendingNews=pickNews();S.newsMode='news';
    document.getElementById('advanceBtn').textContent="▶ Advance Month";
    render(); return;
  }
  const news=S.pendingNews;
  const fatSpark = sparkSpread()>22;
  if(fatSpark && S.sparks.length===0) S.sparksMissed++;

  const before={ power:S.power,gas:S.gas,carbon:S.carbon,wind:S.wind, spark:sparkSpread(),
    openPL:totalOpenPL(), posPL:S.pos.map(p=>({name:p.name,side:p.side,pl:posOpenPL(p)})) };

  applyMonth(news);
  S.sparks.forEach(b=>{ if(b.monthsLeft>0)b.monthsLeft--; });
  buildRecap(news,before);

  const eq=equity(), mm=marginUsed()*MAINT_RATE/MARGIN_RATE;
  if(eq<mm){ S.marginCalls++; forceLiquidate(); toast("⚠ MARGIN CALL — positions force-liquidated.",true); }
  const lev=Math.abs(netExposure())/Math.max(1,equity());
  if(lev>S.maxRiskBreach)S.maxRiskBreach=lev;

  S.history.push({m:MON(S.turn),eq:equity()});
  S.turn++;
  if(S.turn>=12){ render(); endGame(); return; }
  S.pendingNews=pickNews();S.newsMode='news'; render();
}
function forceLiquidate(){
  S.pos.forEach(p=>{ S.realised+=posOpenPL(p); S.cash+=posOpenPL(p); });
  S.sparks.forEach(b=>{ const pl=sparkPL(b); S.realised+=pl; S.cash+=pl; });
  S.pos=[]; S.sparks=[];
}

/* ---- render ---- */
function fmtUSD(n){
  const sign=n<0?"-":""; const a=Math.abs(n);
  if(a>=1e6) return sign+"$"+(a/1e6).toFixed(2)+"M";
  if(a>=1e3) return sign+"$"+(a/1e3).toFixed(1)+"k";
  return sign+"$"+a.toFixed(0);
}
function colorPL(n){return n>0?'up':n<0?'down':'flat';}
function arrow(n){return n>0?'▲':n<0?'▼':'—';}

function render(){
  document.getElementById('monthLabel').textContent = S.started?MON(Math.min(S.turn,11)):"—";
  document.getElementById('turnLabel').textContent = S.started?`Month ${S.turn+1} of 12`:"Press start";

  document.getElementById('newsBox').innerHTML=newsHTML();

  const spark=sparkSpread();
  const dP=S.power-S.lastPower, dG=S.gas-S.lastGas, dC=S.carbon-S.lastCarbon, dW=S.wind-S.lastWind, dS=spark-(S.lastSpark??spark);
  const rows=[
    {nm:t('i_power'),sub:t('i_power_s'),px:'$'+S.power,chg:dP,fmt:v=>arrow(v)+' '+Math.abs(v).toFixed(0),tip:t('i_power_t')},
    {nm:t('i_peak'),sub:'$/MWh · daytime extra',px:'$'+S.peakPrem,chg:0,fmt:()=>'info',tip:t('i_peak_t')},
    {nm:'Natural gas',sub:'$/MMBtu · the fuel',px:'$'+S.gas.toFixed(2),chg:dG,fmt:v=>arrow(v)+' '+Math.abs(v).toFixed(2),tip:t('i_gas_t')},
    {nm:t('i_spark'),sub:'$/MWh · plant margin',px:'$'+spark.toFixed(0),chg:dS,fmt:v=>arrow(v)+' '+Math.abs(v).toFixed(0),tip:t('i_spark_t')},
    {nm:t('i_carbon'),sub:t('i_carbon_s'),px:'$'+S.carbon,chg:dC,fmt:v=>arrow(v)+' '+Math.abs(v).toFixed(0),tip:t('i_carbon_t')},
    {nm:t('i_wind'),sub:t('i_wind_s'),px:S.wind+'%',chg:dW,fmt:v=>arrow(v)+' '+Math.abs(v).toFixed(0),tip:t('i_wind_t')},
  ];
  document.getElementById('mktBody').innerHTML=rows.map(r=>{
    const cls=r.chg>0?'up':r.chg<0?'down':'flat';
    return `<tr><td class="nm"><span class="tip" title="${r.tip}">${r.nm}</span><small>${r.sub}</small></td>
      <td class="px">${r.px}</td><td class="chg ${cls}">${r.fmt(r.chg)}</td></tr>`;
  }).join('');

  const sh=document.getElementById('sparkHint');
  const gasCost=HEAT_RATE*S.gas;
  const math=`<span style="color:var(--txt-dim)">Power $${S.power} − fuel $${gasCost.toFixed(0)} (7.5×$${S.gas.toFixed(2)}) − $${VOM} run = </span>`;
  if(spark>22) sh.innerHTML=`${math}<b style="color:var(--green)">+$${spark.toFixed(0)}/MWh</b>. Fat margin — consider locking a generation block.`;
  else if(spark<0) sh.innerHTML=`${math}<b style="color:var(--neg)">-$${Math.abs(spark).toFixed(0)}/MWh</b>. Underwater — a gas plant would idle here.`;
  else sh.innerHTML=`${math}<b>$${spark.toFixed(0)}/MWh</b>. Thin margin.`;

  const tg=document.getElementById('tradeGrid');
  tg.innerHTML=`
    ${tradeCard('power',t('tc_power'),t('tc_power_d'))}
    ${tradeCard('gas',t('i_gas'),t('tc_gas_d'))}
    <div class="trade-card">
      <div class="tt">Spark Spread</div>
      <div class="td">${t('tc_spark_d1')}<span class="tip" title="${t('tc_spark_tip')}">${t('tc_spark_margin')}</span>${t('tc_spark_d2')}</div>
      <div class="qty-row"><label>MWh</label><input type="number" id="sparkQty" value="20000" min="5000" step="5000"></div>
      <div class="btn-row">
        <button class="buy" onclick="lockSpark(+document.getElementById('sparkQty').value,false)" title="${t('tc_lock_un_t')}">Lock — Unhedged</button>
        <button onclick="lockSpark(+document.getElementById('sparkQty').value,true)" title="${t('tc_lock_h_t')}">Lock — Hedged</button>
      </div>
    </div>
    <div class="trade-card">
      <div class="tt">Capacity Sale</div>
      <div class="td">${t('tc_cap_d1')}<span class="tip" title="${t('tc_cap_tip')}">${t('tc_cap_avail')}</span>${t('tc_cap_d2')}</div>
      <div class="qty-row"><label>MW offered</label><input type="number" id="capQty" value="50" min="10" step="10"></div>
      <div class="btn-row"><button onclick="sellCapacity(+document.getElementById('capQty').value)">Sell Capacity</button></div>
    </div>`;

  const open=totalOpenPL();
  document.getElementById('equityNum').textContent=fmtUSD(equity());
  document.getElementById('equityNum').className='big-num '+colorPL(equity()-START_CASH);
  document.getElementById('realisedPL').innerHTML=`<span class="${colorPL(S.realised)}">${fmtUSD(S.realised)}</span>`;
  document.getElementById('openPL').innerHTML=`<span class="${colorPL(open)}">${fmtUSD(open)}</span>`;
  document.getElementById('cashVal').textContent=fmtUSD(S.cash);
  document.getElementById('marginVal').textContent=fmtUSD(marginUsed());

  const ne=netExposure(), lev=Math.abs(ne)/Math.max(1,equity());
  document.getElementById('netExp').innerHTML=`<span class="${ne>0?'up':ne<0?'down':'flat'}">${fmtUSD(ne)}</span>`;
  const bar=document.getElementById('riskBar');
  bar.style.width=Math.min(100,lev/2*100)+'%';
  bar.style.background=lev<0.8?'var(--green)':lev<1.5?'var(--blue)':'var(--neg)';
  document.getElementById('riskHint').textContent=
    lev<0.05?'Flat. No risk on the book.':
    lev<0.8?`Leverage ${lev.toFixed(2)}x — comfortable.`:
    lev<1.5?`Leverage ${lev.toFixed(2)}x — getting heavy.`:
    `Leverage ${lev.toFixed(2)}x — danger zone, margin-call risk.`;

  const pb=document.getElementById('posBox'); let html='';
  S.pos.forEach((p,i)=>{
    const pl=posOpenPL(p);
    const unit=p.key==='power'?'$'+p.entryPx.toFixed(0)+'/MWh':'$'+p.entryPx.toFixed(2);
    html+=`<div class="pos"><div class="pl"><span><span class="tag ${p.side>0?'long':'short'}">${p.side>0?t('long'):t('short')}</span> ${instrName(p.key)}</span>
      <small>${p.lots} lot${p.lots>1?'s':''} @ ${unit}</small></div>
      <div class="pr"><span class="${colorPL(pl)}">${fmtUSD(pl)}</span><br>
      <button style="padding:2px 6px;font-size:9px;margin-top:3px" onclick="closePos(${i})">Close</button></div></div>`;
  });
  S.sparks.forEach((b,i)=>{
    const pl=sparkPL(b);
    const tag=b.hedged?`<span class="tag" style="background:rgba(11,94,168,.12);color:var(--blue)">Hedged</span>`:`<span class="tag long">Unhedged</span>`;
    html+=`<div class="pos"><div class="pl"><span>${tag} ${(b.mwh/1000).toFixed(0)}k MWh spark</span>
      <small>locked $${b.lockedSpark.toFixed(0)}/MWh · ${b.monthsLeft}mo left${b.hedged?' · flat':''}</small></div>
      <div class="pr"><span class="${colorPL(pl)}">${b.hedged?'flat':fmtUSD(pl)}</span><br>
      <button style="padding:2px 6px;font-size:9px;margin-top:3px" onclick="closeSparkIdx(${i})">Settle</button></div></div>`;
  });
  pb.innerHTML=html||'<div class="hint">'+t('no_pos')+'</div>';

  const rp=document.getElementById('recapPanel'), rb=document.getElementById('recapBox');
  if(S.recap){
    const r=S.recap; const swingCls=colorPL(r.totalSwing);
    let h=`<div style="margin-bottom:10px"><span style="font-family:var(--mono);font-size:10px;color:var(--txt-faint);text-transform:uppercase;letter-spacing:.1em">Open P&L swing</span><br>
      <span class="big-num ${swingCls}" style="font-size:24px">${r.totalSwing>=0?'+':''}${fmtUSD(r.totalSwing)}</span></div>`;
    if(r.moves.length) h+=`<div style="font-size:11px;color:var(--txt-dim);margin-bottom:8px;line-height:1.6"><b style="color:var(--green)">Market moved:</b><br>`+r.moves.map(m=>'· '+m).join('<br>')+`</div>`;
    if(r.lines.length) h+=`<div style="font-size:11.5px;border-top:1px solid var(--line);padding-top:8px;margin-bottom:6px"><b style="color:var(--green)">Position impact:</b><br>`+r.lines.map(l=>{const pos=l.includes('+');return `<div style="padding:2px 0"><span class="${pos?'up':'down'}">${l}</span></div>`;}).join('')+`</div>`;
    if(r.arbDriver) h+=`<div style="font-size:11px;color:var(--txt-dim);border-top:1px solid var(--line);padding-top:8px;line-height:1.6">${r.arbDriver}</div>`;
    if(!r.lines.length && !r.arbDriver) h+='<div class="hint">'+t('r_none')+'</div>';
    rb.innerHTML=h; rp.style.display='block';
  }else rp.style.display='none';
}
function tradeCard(key,name,desc){
  return `<div class="trade-card">
    <div class="tt">${name}</div>
    <div class="td">${desc}</div>
    <div class="qty-row"><label>Lots</label><input type="number" id="q_${key}" value="10" min="1" step="1"></div>
    <div class="btn-row">
      <button class="buy" onclick="trade('${key}','${name}',1,+document.getElementById('q_${key}').value)">Buy / Long</button>
      <button class="sell" onclick="trade('${key}','${name}',-1,+document.getElementById('q_${key}').value)">Sell / Short</button>
    </div></div>`;
}
function instrName(k){ return k==='power'?t('tc_power'):k==='gas'?t('i_gas'):k; }
function closePos(i){ const p=S.pos[i]; if(!p)return; trade(p.key,p.name,-p.side,p.lots); }
function closeSparkIdx(i){ closeSpark(S.sparks[i]); }

/* ---- toast ---- */
let toastT;
function toast(msg,warn){
  const t=document.getElementById('toast');
  t.innerHTML=msg; t.className='toast show'+(warn?' warn':'');
  clearTimeout(toastT); toastT=setTimeout(()=>t.className='toast'+(warn?' warn':''),2600);
}

/* ---- end / debrief ---- */
function endGame(){
  forceLiquidate();
  const finalEq=S.cash, ret=(finalEq-START_CASH)/START_CASH*100;
  const dirTotal=S.directionalRight+S.directionalWrong;
  const dirAcc=dirTotal?Math.round(S.directionalRight/dirTotal*100):0;
  const riskScore=S.maxRiskBreach<0.8?'Disciplined':S.maxRiskBreach<1.5?'Acceptable':'Reckless';
  const sparkScore=S.sparksTaken===0?'Passive':(S.sparksMissed>S.sparksTaken?'Missed opportunities':'Opportunistic');

  let pts=50;
  pts+=Math.max(-40,Math.min(60,ret*1.2));
  pts+=(dirAcc-50)*0.4;
  pts-=S.marginCalls*12;
  pts-=Math.max(0,(S.maxRiskBreach-1)*20);
  pts+=Math.min(15,S.sparksTaken*4);
  pts=Math.max(0,Math.min(100,Math.round(pts)));
  const grade=pts>=85?'A':pts>=70?'B':pts>=55?'C':pts>=40?'D':'F';

  const dbg=[
    ['Final equity', fmtUSD(finalEq)+` (${ret>=0?'+':''}${ret.toFixed(1)}%)`, ret>=0?'up':'down'],
    ['Directional accuracy', `${dirAcc}% (${S.directionalRight}W / ${S.directionalWrong}L)`, dirAcc>=55?'up':dirAcc>=45?'flat':'down'],
    ['Spark spreads', `${sparkScore} — ${S.sparksTaken} locked, ${S.sparksMissed} fat ones missed`, S.sparksTaken>0?'up':'flat'],
    ['Capacity income', S.capacityEarned>0?fmtUSD(S.capacityEarned)+' banked':'None sold', S.capacityEarned>0?'up':'flat'],
    ['Risk discipline', `${riskScore} (peak ${S.maxRiskBreach.toFixed(1)}x leverage)`, S.maxRiskBreach<0.8?'up':S.maxRiskBreach<1.5?'flat':'down'],
    ['Margin calls', S.marginCalls===0?'None — clean book':`${S.marginCalls} forced liquidation(s)`, S.marginCalls===0?'up':'down'],
  ];
  const coaching=buildCoaching(ret,dirAcc,S);
  document.getElementById('modalInner').innerHTML=`
    <h2>Season Debrief <span class="grade" style="background:${grade==='F'||grade==='D'?'var(--neg)':grade==='A'?'var(--green)':'var(--blue)'}">${grade}</span></h2>
    <div class="score ${ret>=0?'up':'down'}">${pts}<span style="font-size:18px;color:var(--txt-dim)">/100</span></div>
    ${dbg.map(d=>`<div class="debrief-row"><span class="lbl">${d[0]}</span><span class="rating ${d[2]}">${d[1]}</span></div>`).join('')}
    <div style="margin-top:16px;padding:14px;background:var(--panel2);border-radius:8px;border-left:3px solid var(--blue)">
      <div style="font-family:var(--disp);color:var(--green);font-size:14px;margin-bottom:6px">Desk notes</div>
      <div style="color:var(--txt-dim);font-size:12px;line-height:1.65">${coaching}</div>
    </div>
    <button class="big-btn" style="margin-top:18px" onclick="restart()">↺ Trade Another Season</button>`;
  document.getElementById('modalBg').classList.add('show');
}
function buildCoaching(ret,dirAcc,s){
  const notes=[];
  if(ret>15) notes.push(t('c_strong'));
  else if(ret<0) notes.push(t('c_down'));
  if(dirAcc<45) notes.push(t('c_diracc'));
  if(s.sparksTaken===0) notes.push(t('c_nospark'));
  if(s.sparksMissed>0) notes.push(`You skipped ${s.sparksMissed} fat spark spread${s.sparksMissed>1?'s':''} — generation traders live on that margin.`);
  if(s.capacityEarned===0) notes.push(t('c_nocap'));
  if(s.marginCalls>0) notes.push(t('c_mc'));
  if(s.maxRiskBreach>1.5) notes.push(t('c_heavy'));
  if(notes.length===0) notes.push(t('c_ok'));
  return notes.join(" ");
}
function restart(){
  document.getElementById('modalBg').classList.remove('show');
  S=freshState();
  document.getElementById('advanceBtn').textContent="▶ Start Season";
  S.newsMode='reset';
  render();
}

/* ---- mode switch ---- */
function startGame(){
  document.getElementById('academy').classList.add('hidden');
  document.getElementById('game').classList.remove('hidden');
  document.getElementById('clock').style.display='block';
  S=freshState(); render();
  window.scrollTo({top:0,behavior:'smooth'});
}
