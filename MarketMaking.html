<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Spread — Market Making, From Scratch | Evolta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f1f7f3;
    --bg2:#ffffff;
    --panel:#ffffff;
    --panel2:#eaf4ee;
    --line:#dcebe2;
    --line2:#cbe0d4;
    /* Green theme */
    --green:#168058;       /* primary emerald */
    --green-lt:#27a06f;
    --teal:#0e7c7b;        /* secondary */
    --teal-lt:#2a9d9b;
    --amber:#d98a1f;       /* accent */
    --accent:#168058;
    --pos:#168058;         /* up (green theme: up is brand green) */
    --neg:#c0392b;         /* down */
    --white:#13251c;
    --txt:#1f332a;
    --txt-dim:#557064;
    --txt-faint:#8fab9e;
    --mono:'IBM Plex Mono',monospace;
    --sans:'Inter',-apple-system,sans-serif;
    --disp:'Fraunces',serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:
      radial-gradient(ellipse at 12% -5%, #ddf0e6 0%, transparent 45%),
      radial-gradient(ellipse at 95% 5%, #daf0ee 0%, transparent 42%),
      var(--bg);
    color:var(--txt);font-family:var(--sans);font-size:13px;line-height:1.5;min-height:100vh;padding:0 0 60px;-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:0 20px;position:relative;z-index:2}
  header{border-bottom:1px solid var(--line);padding:24px 0 20px;margin-bottom:24px;display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
  .brand h1{font-family:var(--disp);font-weight:500;font-size:38px;line-height:.95;letter-spacing:-.02em;color:var(--green)}
  .brand h1 .amp{color:var(--teal);font-style:italic}
  .brand h1 .bolt{color:var(--amber);font-style:normal}
  .brand .sub{color:var(--txt-dim);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;margin-top:8px;font-family:var(--mono)}
  .brand .evolta{color:var(--teal);font-weight:600}
  .topbar{display:flex;align-items:center;gap:14px}
  .back-btn{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;color:var(--txt-dim);text-decoration:none;border:1px solid var(--line2);border-radius:8px;padding:8px 13px;transition:.15s;white-space:nowrap}
  .back-btn:hover{border-color:var(--green);color:var(--green)}
  .clock{text-align:right}
  .clock .month{font-family:var(--disp);font-size:26px;color:var(--teal);font-weight:500}
  .clock .turn{color:var(--txt-faint);font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-family:var(--mono)}

  .grid{display:grid;grid-template-columns:1fr 340px;gap:18px;align-items:start}
  @media(max-width:880px){.grid{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:18px;box-shadow:0 1px 2px rgba(22,128,88,.05),0 6px 22px rgba(14,124,123,.05)}
  .panel h2{font-family:var(--mono);font-weight:500;font-size:11px;color:var(--txt-faint);letter-spacing:.14em;text-transform:uppercase;margin-bottom:14px;display:flex;align-items:center;gap:8px}
  .panel h2 .dot{width:5px;height:5px;border-radius:50%;background:var(--green)}

  .mkt{width:100%;border-collapse:collapse}
  .mkt th{text-align:left;color:var(--txt-faint);font-weight:500;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;padding:4px 8px;border-bottom:1px solid var(--line);font-family:var(--mono)}
  .mkt td{padding:9px 8px;border-bottom:1px solid var(--line)}
  .mkt tr:last-child td{border-bottom:none}
  .mkt .nm{color:var(--txt);font-weight:500}
  .mkt .nm small{display:block;color:var(--txt-faint);font-size:10px;font-weight:400}
  .mkt .px{font-weight:600;font-size:15px;text-align:right;font-family:var(--mono)}
  .mkt .chg{text-align:right;font-size:12px;font-family:var(--mono)}
  .up{color:var(--pos)}.down{color:var(--neg)}.flat{color:var(--txt-faint)}

  .news{border-left:3px solid var(--green);padding:2px 0 2px 14px;margin-bottom:8px}
  .news .hl{color:var(--white);font-weight:600;margin-bottom:4px;font-size:14px}
  .news .src{color:var(--teal);font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-family:var(--mono);font-weight:500}
  .news .ex{color:var(--txt-dim);font-size:12px;margin-top:8px;line-height:1.6;border-top:1px solid var(--line);padding-top:8px}
  .news .ex b{color:var(--green)}

  .trade-card{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:15px}
  .trade-card .tt{font-family:var(--disp);font-size:15px;color:var(--green);margin-bottom:3px;font-weight:500}
  .trade-card .td{color:var(--txt-dim);font-size:10.5px;margin-bottom:11px;line-height:1.5}
  .ctrl-row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .ctrl-row label{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--txt-dim);min-width:110px}
  .ctrl-row .val{font-family:var(--mono);font-size:12px;color:var(--green);font-weight:600;min-width:54px;text-align:right}
  input[type=range]{accent-color:var(--green);width:100%;flex:1}
  .quote-preview{display:flex;justify-content:space-between;gap:10px;margin:10px 0 4px}
  .qbox{flex:1;text-align:center;border:1px solid var(--line2);border-radius:8px;padding:8px}
  .qbox .ql{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--txt-faint)}
  .qbox .qv{font-family:var(--mono);font-size:17px;font-weight:600;margin-top:2px}
  .qbox.bid .qv{color:var(--pos)}.qbox.ask .qv{color:var(--neg)}.qbox.mid .qv{color:var(--teal)}
  button{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.03em;border:1px solid var(--line2);background:var(--bg2);color:var(--txt);padding:8px 10px;border-radius:7px;cursor:pointer;transition:.13s}
  button:hover{border-color:var(--green);color:var(--green)}
  .big-btn{width:100%;padding:15px;font-size:14px;font-family:var(--sans);font-weight:600;background:linear-gradient(135deg,var(--green),var(--teal));color:#fff;border:none;letter-spacing:.02em;border-radius:10px;box-shadow:0 4px 14px rgba(14,124,123,.2)}
  .big-btn:hover{filter:brightness(1.07);color:#fff}
  .ghost-btn{background:transparent;border:1px solid var(--line2);color:var(--txt-dim);padding:10px 16px;border-radius:9px;font-family:var(--mono);font-size:11px}
  .ghost-btn:hover{border-color:var(--green);color:var(--green)}

  .stat{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line)}
  .stat:last-child{border-bottom:none}
  .stat .k{color:var(--txt-dim);font-size:11px}
  .stat .v{font-weight:600;font-family:var(--mono)}
  .big-num{font-family:var(--disp);font-size:32px;font-weight:500;line-height:1;margin:2px 0 8px;color:var(--teal)}

  .blot{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:11.5px;font-family:var(--mono)}
  .blot:last-child{border-bottom:none}
  .tag{display:inline-block;font-size:9px;padding:2px 6px;border-radius:4px;letter-spacing:.05em;text-transform:uppercase;font-weight:600;font-family:var(--mono)}
  .tag.buy{background:rgba(22,128,88,.13);color:var(--pos)}
  .tag.sell{background:rgba(192,57,43,.10);color:var(--neg)}

  .meter{height:7px;background:var(--line);border-radius:5px;overflow:hidden;margin:8px 0;position:relative}
  .meter span{display:block;height:100%;transition:.4s;border-radius:5px}
  .meter.center{background:linear-gradient(90deg,var(--neg),var(--line) 50%,var(--pos))}
  .meter.center i{position:absolute;top:-2px;width:3px;height:11px;background:var(--white);border-radius:2px;transition:.4s;transform:translateX(-50%)}

  .toast{position:fixed;left:50%;top:20px;transform:translateX(-50%);z-index:50;background:var(--bg2);border:1px solid var(--green);border-radius:10px;padding:12px 22px;color:var(--txt);font-size:12px;box-shadow:0 10px 36px rgba(14,124,123,.16);max-width:90vw;opacity:0;transition:.3s;pointer-events:none;font-family:var(--mono)}
  .toast.show{opacity:1;top:32px}
  .toast.warn{border-color:var(--neg);color:var(--neg)}

  .modal-bg{position:fixed;inset:0;background:rgba(19,37,28,.5);backdrop-filter:blur(4px);z-index:40;display:none;align-items:center;justify-content:center;padding:20px}
  .modal-bg.show{display:flex}
  .modal{background:var(--bg2);border:1px solid var(--line);border-radius:18px;padding:30px;max-width:560px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(14,124,123,.22)}
  .modal h2{font-family:var(--disp);font-size:28px;color:var(--green);font-weight:500;margin-bottom:6px}
  .modal .score{font-family:var(--disp);font-size:52px;font-weight:500;line-height:1;margin:10px 0;color:var(--teal)}
  .grade{display:inline-block;font-family:var(--disp);font-size:22px;font-weight:600;padding:3px 16px;border-radius:10px;background:var(--green);color:#fff;margin-left:10px}
  .debrief-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);gap:14px}
  .debrief-row .lbl{color:var(--txt-dim)}
  .debrief-row .rating{font-weight:600;text-align:right;font-family:var(--mono);font-size:11.5px}

  .hint{color:var(--txt-faint);font-size:10.5px;margin-top:6px;line-height:1.5}
  .hint b{color:var(--txt-dim)}
  .tip{cursor:help;border-bottom:1px dotted var(--txt-faint)}
  svg text{font-family:var(--mono)}

  /* Academy */
  #academy{max-width:920px;margin:0 auto}
  .acad-panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px 32px;box-shadow:0 1px 2px rgba(22,128,88,.05),0 10px 36px rgba(14,124,123,.07)}
  .acad-steps{display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap}
  .acad-steps .s{flex:1;min-width:70px;height:5px;border-radius:4px;background:var(--line);transition:.3s}
  .acad-steps .s.done{background:var(--green)}
  .acad-steps .s.cur{background:linear-gradient(90deg,var(--green),var(--teal))}
  .lesson-kicker{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--amber);font-weight:500;margin-bottom:8px}
  .lesson-title{font-family:var(--disp);font-size:30px;font-weight:500;color:var(--green);line-height:1.05;margin-bottom:10px;letter-spacing:-.01em}
  .lesson-lede{color:var(--txt-dim);font-size:14px;line-height:1.65;margin-bottom:6px;max-width:62ch}
  .lesson-lede b{color:var(--green)}
  .lesson-body{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start;margin:22px 0 8px}
  @media(max-width:760px){.lesson-body{grid-template-columns:1fr}}
  .viz-box{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:18px;min-height:300px}
  .viz-controls{margin-top:14px;display:flex;flex-direction:column;gap:12px}
  .chip-row{display:flex;gap:8px;flex-wrap:wrap}
  .chip{font-family:var(--mono);font-size:10.5px;padding:7px 12px;border-radius:20px;border:1px solid var(--line2);background:var(--bg2);color:var(--txt-dim);cursor:pointer;transition:.13s;flex:none}
  .chip:hover{border-color:var(--amber);color:var(--amber)}
  .takeaway{background:rgba(217,138,31,.08);border:1px solid rgba(217,138,31,.26);border-radius:10px;padding:13px 15px;margin-top:6px}
  .takeaway .lab{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);font-weight:600;margin-bottom:5px}
  .takeaway .txt{color:var(--txt);font-size:12.5px;line-height:1.6}
  .takeaway .txt b{color:var(--green)}
  .lesson-points{list-style:none;margin:14px 0}
  .lesson-points li{padding:7px 0 7px 26px;position:relative;color:var(--txt-dim);font-size:13px;line-height:1.55}
  .lesson-points li::before{content:"";position:absolute;left:0;top:9px;width:13px;height:13px;border-radius:50%;border:2px solid var(--green)}
  .lesson-points li b{color:var(--txt)}
  .acad-nav{display:flex;justify-content:space-between;align-items:center;margin-top:24px;gap:12px}
  .acad-nav .right{display:flex;gap:10px}
  .read-out{font-family:var(--mono);font-size:12px;color:var(--txt-dim)}
  .read-out b{font-size:14px;color:var(--teal)}
  .anim{transition:all .45s cubic-bezier(.2,.8,.25,1)}
  .hidden{display:none !important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1>The Spread <span class="bolt">📈</span></h1>
      <div class="sub" id="brandSub"></div>
    </div>
    <div class="topbar">
      <div class="clock" id="clock" style="display:none">
        <div class="month" id="monthLabel">—</div>
        <div class="turn" id="turnLabel"></div>
      </div>
      <button class="back-btn" id="langToggle" type="button" style="cursor:pointer;margin-right:8px">中文</button>
      <a class="back-btn" id="backAll" href="TradingGamePortal.html">‹ All games</a>
    </div>
  </header>

  <!-- ACADEMY -->
  <div id="academy">
    <div class="acad-panel">
      <div class="acad-steps" id="acadSteps"></div>
      <div id="lessonContent"></div>
      <div class="acad-nav">
        <button class="ghost-btn" id="backBtn" onclick="acadBack()" data-i18n="nav_back">‹ Back</button>
        <div class="right">
          <button class="ghost-btn" id="skipBtn" onclick="startGame()" data-i18n="nav_skip">Skip to game ›</button>
          <button class="big-btn" id="nextBtn" onclick="acadNext()" style="width:auto;padding:11px 26px">Next ›</button>
        </div>
      </div>
    </div>
  </div>

  <!-- GAME -->
  <div id="game" class="grid hidden">
    <div>
      <div class="panel" id="newsPanel">
        <h2><span class="dot"></span><span data-i18n="pn_flow">Order-Flow Wire</span></h2>
        <div id="newsBox"></div>
      </div>

      <div class="panel">
        <h2><span class="dot"></span><span data-i18n="pn_book">The Book</span></h2>
        <table class="mkt">
          <thead><tr><th data-i18n="th_level">Level</th><th style="text-align:right" data-i18n="th_price">Price</th><th style="text-align:right" data-i18n="th_tick">Δ tick</th></tr></thead>
          <tbody id="mktBody"></tbody>
        </table>
        <div class="hint" id="bookHint"></div>
      </div>

      <div class="panel">
        <h2><span class="dot"></span><span data-i18n="pn_quotes">Your Quotes</span></h2>
        <div class="trade-card">
          <div class="quote-preview">
            <div class="qbox bid"><div class="ql" data-i18n="q_bid">Your Bid</div><div class="qv" id="bidPrev">—</div></div>
            <div class="qbox mid"><div class="ql" data-i18n="q_mid">Mid</div><div class="qv" id="midPrev">—</div></div>
            <div class="qbox ask"><div class="ql" data-i18n="q_ask">Your Ask</div><div class="qv" id="askPrev">—</div></div>
          </div>
          <div class="ctrl-row"><label class="tip" id="lblWidth" data-i18n="lbl_width" data-i18n-title="tip_width">Spread width</label>
            <input type="range" min="0.4" max="5" step="0.1" value="1.6" id="widthSlider" oninput="updateQuotes()">
            <span class="val" id="widthVal">1.6</span></div>
          <div class="ctrl-row"><label class="tip" id="lblSkew" data-i18n="lbl_skew" data-i18n-title="tip_skew">Skew</label>
            <input type="range" min="-3" max="3" step="0.1" value="0" id="skewSlider" oninput="updateQuotes()">
            <span class="val" id="skewVal">0.0</span></div>
          <div class="hint" id="quoteHint"></div>
        </div>
        <div style="margin-top:14px">
          <button class="big-btn" id="advanceBtn" onclick="startOrAdvance()">▶ Start Session</button>
        </div>
      </div>
    </div>

    <div>
      <div class="panel">
        <h2><span class="dot"></span><span data-i18n="pn_pnl">P&amp;L</span></h2>
        <div class="big-num" id="pnlNum">$0</div>
        <div class="stat"><span class="k tip" data-i18n="k_spread_cap" data-i18n-title="tip_spread_cap">Spread captured</span><span class="v" id="spreadCap">$0</span></div>
        <div class="stat"><span class="k tip" data-i18n="k_inv_pl" data-i18n-title="tip_inv_pl">Inventory P&amp;L</span><span class="v" id="invPL">$0</span></div>
        <div class="stat"><span class="k" data-i18n="k_fills">Fills</span><span class="v" id="fillCt">0</span></div>
      </div>

      <div class="panel">
        <h2><span class="dot"></span><span data-i18n="pn_inv">Inventory</span></h2>
        <div class="big-num" id="invNum" style="font-size:26px"></div>
        <div class="meter center"><i id="invMark" style="left:50%"></i></div>
        <div class="hint" id="invHint"></div>
      </div>

      <div class="panel">
        <h2><span class="dot"></span><span data-i18n="pn_blot">Trade Blotter</span></h2>
        <div id="blotBox"></div>
      </div>

      <div class="panel" id="recapPanel" style="display:none">
        <h2><span class="dot"></span><span data-i18n="pn_recap">This Tick — Breakdown</span></h2>
        <div id="recapBox"></div>
      </div>

      <div class="panel">
        <h2><span class="dot"></span><span data-i18n="pn_gloss">Glossary</span></h2>
        <div style="font-size:11px;color:var(--txt-dim);line-height:1.7" id="glossBox"></div>
        <div style="margin-top:12px"><button class="ghost-btn" onclick="openAcademy()" style="width:100%" data-i18n="replay_acad">↺ Replay the Academy</button></div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modalInner"></div></div>

<script>

/* ================= i18n ================= */
const I18N={
en:{
  doc_title:'The Spread — Market Making | Evolta',
  lang_other:'中文', lang_aria:'Switch to Chinese',
  brand_sub:'Market Making — from scratch · <span class="evolta">Evolta — learn · play · evolve</span>',
  back_all:'‹ All games',
  press_start:'Press start',
  tick_n:n=>'Tick '+n, tick_of:n=>'of '+n,

  nav_back:'‹ Back', nav_skip:'Skip to game ›', nav_next:'Next ›', nav_open:'Open the desk 📈',

  pn_flow:'Order-Flow Wire', pn_book:'The Book', pn_quotes:'Your Quotes',
  pn_pnl:'P&L', pn_inv:'Inventory', pn_blot:'Trade Blotter',
  pn_recap:'This Tick — Breakdown', pn_gloss:'Glossary',

  intro_hl:"You're the market maker.",
  intro_src:'Evolta Trading Floor',
  intro_ex:"You quote a <b>bid</b> (where you'll buy) and an <b>ask</b> (where you'll sell). Buyers and sellers hit your quotes; you pocket the <b>spread</b> — but you carry whatever <b>inventory</b> you accumulate. Set your spread &amp; skew, then advance. Read the flow to avoid getting picked off.",

  th_level:'Level', th_price:'Price', th_tick:'Δ tick',
  q_bid:'Your Bid', q_mid:'Mid', q_ask:'Your Ask',
  lbl_width:'Spread width', lbl_skew:'Skew',
  tip_width:'Total distance between your bid and ask. Tighter = more fills but less edge per trade. Wider = fewer fills, more edge.',
  tip_skew:"Shift both quotes up or down. Skew DOWN to sell off a long inventory; skew UP to buy when you're short.",
  btn_start:'▶ Start Session', btn_advance:'▶ Advance Tick',

  k_spread_cap:'Spread captured', k_inv_pl:'Inventory P&L', k_fills:'Fills',
  tip_spread_cap:'Edge captured by buying at your bid and selling at your ask, vs the mid price.',
  tip_inv_pl:'Gain or loss from price moving while you hold inventory.',
  lots:'lots', no_fills:'No fills yet.',
  replay_acad:'↺ Replay the Academy',

  gloss:'<b style="color:var(--green)">Bid / Ask</b> the prices you\'ll buy / sell at<br><b style="color:var(--green)">Spread</b> ask − bid; your gross edge per round-trip<br><b style="color:var(--green)">Mid</b> the fair price, halfway between bid and ask<br><b style="color:var(--green)">Inventory</b> net lots you\'re holding — your price risk<br><b style="color:var(--green)">Skew</b> shifting quotes to steer your inventory<br><b style="color:var(--green)">Adverse selection</b> getting filled right before the price moves against you',

  row_ask:'Your Ask', row_ask_s:'where you sell',
  row_mid:'Mid', row_mid_s:'fair price',
  row_bid:'Your Bid', row_bid_s:'where you buy',
  row_spread:'Spread', row_spread_s:'your edge',
  centered:'centered', skew_lbl:v=>'skew '+v,
  book_hint:"Mid is the market's fair price; it drifts each tick. You earn the gap between your quotes and the mid — but only on the trades that actually fill.",

    spreadCaptured:0,fills:0,maxAbsInv:0,breaches:0,adverse:0,
    blotter:[],pendingEvent:null,recap:null,startEquity:0,newsMode:'intro',
  };
}
const EVENTS=[
  {id:0,drift:0,vol:0.5,bias:0},
  {id:1,drift:1.5,vol:0.6,bias:1},
  {id:2,drift:-1.5,vol:0.6,bias:-1},
  {id:3,drift:0,vol:2.2,bias:0},
  {id:4,drift:0,vol:0.8,bias:0,thin:true},
  {id:5,drift:2.6,vol:0.7,bias:1,toxic:true},
  {id:6,drift:-2.6,vol:0.7,bias:-1,toxic:true},
  {id:7,drift:0.3,vol:0.5,bias:0},
];
function pickEvent(){return EVENTS[Math.floor(Math.random()*EVENTS.length)];}
function newsHTML(){
  if(S.newsMode==='event'&&S.pendingEvent){
    const n=S.pendingEvent;
    return '<div class="news"><div class="hl">'+t('ev'+n.id+'_hl')+'</div><div class="src">'+t('ev'+n.id+'_src')+'</div>'+
           '<div class="ex"><b>'+t('read_flow')+'</b> '+t('ev'+n.id+'_ex')+'</div></div>';
  }
  if(S.newsMode==='reset'){
    return '<div class="news"><div class="hl">'+t('reset_hl')+'</div><div class="src">'+t('intro_src')+'</div>'+
           '<div class="ex">'+t('reset_ex')+'</div></div>';
  }
  return '<div class="news"><div class="hl">'+t('intro_hl')+'</div><div class="src">'+t('intro_src')+'</div>'+
         '<div class="ex">'+t('intro_ex')+'</div></div>';
}

function bidPrice(){return S.mid - S.width/2 + S.skew;}
function askPrice(){return S.mid + S.width/2 + S.skew;}
function equity(){return S.cash + S.inv*S.mid;}

function updateQuotes(){
  if(!S) return;
  S.width=+document.getElementById('widthSlider').value;
  S.skew=+document.getElementById('skewSlider').value;
  document.getElementById('widthVal').textContent=S.width.toFixed(1);
  document.getElementById('skewVal').textContent=(S.skew>=0?'+':'')+S.skew.toFixed(1);
  document.getElementById('bidPrev').textContent='$'+bidPrice().toFixed(2);
  document.getElementById('askPrev').textContent='$'+askPrice().toFixed(2);
  document.getElementById('midPrev').textContent='$'+S.mid.toFixed(2);
  const qh=document.getElementById('quoteHint');
  let msg='';
  if(S.inv>4 && S.skew>-0.3) msg=t('qh_long',S.inv);
  else if(S.inv<-4 && S.skew<0.3) msg=t('qh_short',Math.abs(S.inv));
  else if(S.width<0.8) msg=t('qh_tight');
  else if(S.width>3.2) msg=t('qh_wide');
  else msg=t('qh_balanced');
  qh.textContent=msg;
}

function startOrAdvance(){
  if(!S.started){S.started=true;S.tick=0;S.pendingEvent=pickEvent();
    document.getElementById('advanceBtn').textContent=t('btn_advance');S.newsMode='event';render();return;}
  resolveTick();
}
function randn(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}

function resolveTick(){
  const ev=S.pendingEvent;
  const before={cash:S.cash,inv:S.inv,mid:S.mid,equity:equity()};
  const fills=[];
  // arriving orders
  let buyers=1+(Math.random()<0.5?1:0);
  let sellers=1+(Math.random()<0.5?1:0);
  if(ev.bias>0)buyers+=1; if(ev.bias<0)sellers+=1;
  if(ev.thin){buyers+=1;sellers+=1;}
  const askEdge=askPrice()-S.mid, bidEdge=S.mid-bidPrice();
  const pAsk=Math.max(0.05,Math.min(0.96,0.92-askEdge*0.3));
  const pBid=Math.max(0.05,Math.min(0.96,0.92-bidEdge*0.3));
  let tickSpread=0;
  // buyers may lift your ask -> you SELL
  for(let i=0;i<buyers;i++){ if(Math.random()<pAsk){
    S.cash+=askPrice(); S.inv-=1; S.fills++; tickSpread+=askEdge;
    fills.push({side:'sell',px:askPrice()});
  }}
  // sellers may hit your bid -> you BUY
  for(let i=0;i<sellers;i++){ if(Math.random()<pBid){
    S.cash-=bidPrice(); S.inv+=1; S.fills++; tickSpread+=bidEdge;
    fills.push({side:'buy',px:bidPrice()});
  }}
  S.spreadCaptured+=tickSpread;

  // adverse selection: toxic flow + you traded the wrong way
  if(ev.toxic){
    const soldIntoRally = ev.drift>0 && fills.some(f=>f.side==='sell');
    const boughtIntoDrop = ev.drift<0 && fills.some(f=>f.side==='buy');
    if(soldIntoRally||boughtIntoDrop) S.adverse++;
  }

  // price moves
  S.lastMid=S.mid;
  S.mid=Math.max(5,+(S.mid+ev.drift+randn()*ev.vol).toFixed(2));

  // inventory bookkeeping
  S.maxAbsInv=Math.max(S.maxAbsInv,Math.abs(S.inv));
  if(Math.abs(S.inv)>POS_LIMIT){
    S.breaches++;
    // forced partial flatten at mid (cross half the spread as penalty)
    const flatten=S.inv>0?-3:3; const px=S.mid;
    S.cash-= flatten*px*0 ; // mark; we flatten at mid minus a small slippage
    const slip=Math.abs(flatten)*0.25;
    S.cash-=slip; S.inv+=flatten;
    toast(t('breach',Math.abs(flatten),fmtUSD(slip*LOT)),true);
  }

  // blotter
  fills.forEach(f=>S.blotter.unshift({...f,tick:S.tick+1}));
  if(S.blotter.length>8)S.blotter=S.blotter.slice(0,8);

  // recap attribution
  const invPLswing=before.inv*(S.mid-before.mid); // value change on inventory held
  S.recap={ev,fills,tickSpread:tickSpread*LOT,invPLswing:invPLswing*LOT,
    move:S.mid-before.mid, endInv:S.inv};

  S.tick++;
  if(S.tick>=TICKS){render();endGame();return;}
  S.pendingEvent=pickEvent();render();
}

/* ---- render ---- */
function fmtUSD(n){const s=n<0?"-":"";const a=Math.abs(n);
  if(a>=1e6)return s+"$"+(a/1e6).toFixed(2)+"M";
  if(a>=1e3)return s+"$"+(a/1e3).toFixed(1)+"k";
  return s+"$"+a.toFixed(0);}
function colorPL(n){return n>0?'up':n<0?'down':'flat';}
function arrow(n){return n>0?'▲':n<0?'▼':'—';}

function render(){
  document.getElementById('monthLabel').textContent=S.started?t('tick_n',Math.min(S.tick+1,TICKS)):"—";
  document.getElementById('turnLabel').textContent=S.started?t('tick_of',TICKS):t('press_start');

  document.getElementById('newsBox').innerHTML=newsHTML();

  // book
  const dMid=S.mid-S.lastMid;
  document.getElementById('mktBody').innerHTML=
    '<tr><td class="nm">'+t('row_ask')+'<small>'+t('row_ask_s')+'</small></td><td class="px down">$'+askPrice().toFixed(2)+'</td><td class="chg flat">—</td></tr>'+
    '<tr><td class="nm">'+t('row_mid')+'<small>'+t('row_mid_s')+'</small></td><td class="px">$'+S.mid.toFixed(2)+'</td><td class="chg '+(dMid>0?'up':dMid<0?'down':'flat')+'">'+(dMid?arrow(dMid)+' '+Math.abs(dMid).toFixed(2):'—')+'</td></tr>'+
    '<tr><td class="nm">'+t('row_bid')+'<small>'+t('row_bid_s')+'</small></td><td class="px up">$'+bidPrice().toFixed(2)+'</td><td class="chg flat">—</td></tr>'+
    '<tr><td class="nm">'+t('row_spread')+'<small>'+t('row_spread_s')+'</small></td><td class="px">$'+S.width.toFixed(2)+'</td><td class="chg flat">'+(S.skew?t('skew_lbl',(S.skew>0?'+':'')+S.skew.toFixed(1)):t('centered'))+'</td></tr>';
  const bh=document.getElementById('bookHint');
  bh.innerHTML = t('book_hint');

  updateQuotes();

  // P&L
  const eq=equity();
  document.getElementById('pnlNum').textContent=fmtUSD(eq*LOT);
  document.getElementById('pnlNum').className='big-num '+colorPL(eq);
  document.getElementById('spreadCap').innerHTML=`<span class="up">${fmtUSD(S.spreadCaptured*LOT)}</span>`;
  const invPL=(eq - S.spreadCaptured)*LOT; // remainder attributable to inventory marks/penalties
  document.getElementById('invPL').innerHTML=`<span class="${colorPL(invPL)}">${fmtUSD(invPL)}</span>`;
  document.getElementById('fillCt').textContent=S.fills;

  // inventory
  document.getElementById('invNum').innerHTML=S.inv+' <span style="font-size:13px;color:var(--txt-faint)">'+t('lots')+'</span>';
  document.getElementById('invNum').className='big-num '+(Math.abs(S.inv)>8?'down':'');
  document.getElementById('invNum').style.fontSize='26px';
  const mark=document.getElementById('invMark');
  const pct=50+Math.max(-50,Math.min(50,S.inv/POS_LIMIT*50));
  mark.style.left=pct+'%';
  const dir=S.inv>0?t('long'):t('short'), amt=Math.abs(S.inv);
  document.getElementById('invHint').textContent=
    S.inv===0?t('inv_flat'):
    amt<5?t('inv_modest',dir,amt):
    amt<POS_LIMIT?t('inv_reduce',dir,amt):
    t('inv_limit',dir,amt);

  // blotter
  const bb=document.getElementById('blotBox');
  bb.innerHTML=S.blotter.length?S.blotter.map(f=>
    '<div class="blot"><span><span class="tag '+f.side+'">'+(f.side==='buy'?t('bought'):t('sold'))+'</span> '+t('one_lot')+'</span><span>@ $'+f.px.toFixed(2)+' <span style="color:var(--txt-faint)">t'+f.tick+'</span></span></div>'
  ).join(''):'<div class="hint">'+t('no_fills')+'</div>';

  // recap
  const rp=document.getElementById('recapPanel'), rb=document.getElementById('recapBox');
  if(S.recap){const r=S.recap;
    let h=`<div style="font-size:11.5px;color:var(--txt-dim);line-height:1.7">`;
    h+='<b style="color:var(--green)">'+t('r_fills')+'</b> '+(r.fills.length?r.fills.map(f=>f.side==='buy'?t('r_bought'):t('r_sold')).join('、'):t('r_none'))+'<br>';
    h+='<b style="color:var(--green)">'+t('r_spread')+'</b> <span class="up">'+fmtUSD(r.tickSpread)+'</span><br>';
    h+='<b style="color:var(--green)">'+t('r_move')+'</b> '+(r.move>=0?'+':'')+'$'+r.move.toFixed(2)+' → '+t('r_invpl')+' <span class="'+colorPL(r.invPLswing)+'">'+fmtUSD(r.invPLswing)+'</span></div>';
    if(r.ev.toxic && S.adverse>0) h+='<div class="hint" style="margin-top:8px;color:var(--neg)">'+t('r_adverse')+'</div>';
    else if(Math.abs(r.endInv)>8) h+='<div class="hint" style="margin-top:8px">'+t('r_piling')+'</div>';
    rb.innerHTML=h; rp.style.display='block';
  } else rp.style.display='none';
}

let toastT;
function toast(msg,warn){const t=document.getElementById('toast');t.innerHTML=msg;t.className='toast show'+(warn?' warn':'');
  clearTimeout(toastT);toastT=setTimeout(()=>t.className='toast'+(warn?' warn':''),2600);}

function endGame(){
  // flatten remaining inventory at mid for final P&L
  const eq=equity()*LOT;
  const spreadCap=S.spreadCaptured*LOT;
  const invPL=eq-spreadCap;
  let pts=50;
  pts+=Math.max(-30,Math.min(45,eq/40));
  pts+=Math.min(18,S.fills*0.7);
  pts-=Math.max(0,(S.maxAbsInv-8)*2.5);
  pts-=S.breaches*7;
  pts-=S.adverse*5;
  pts=Math.max(0,Math.min(100,Math.round(pts)));
  const grade=pts>=85?'A':pts>=70?'B':pts>=55?'C':pts>=40?'D':'F';
  const invScore=S.maxAbsInv<6?t('d_tight'):S.maxAbsInv<POS_LIMIT?t('d_loose'):t('d_ooc');
  const dbg=[
    [t('d_total'), fmtUSD(eq), eq>=0?'up':'down'],
    [t('d_spread'), fmtUSD(spreadCap)+t('d_fills',S.fills), spreadCap>0?'up':'flat'],
    [t('d_invpl'), fmtUSD(invPL), invPL>=0?'up':'down'],
    [t('d_control'), t('d_peak',invScore,S.maxAbsInv), S.maxAbsInv<6?'up':S.maxAbsInv<POS_LIMIT?'flat':'down'],
    [t('d_breach'), S.breaches===0?t('d_clean'):t('d_flattens',S.breaches), S.breaches===0?'up':'down'],
    [t('d_adverse'), S.adverse===0?t('d_dodged'):t('d_picked',S.adverse), S.adverse===0?'up':'down'],
  ];
  const coaching=coach(eq,spreadCap,invPL,S);
  document.getElementById('modalInner').innerHTML=`
    <h2>${t('d_title')} <span class="grade" style="background:${grade==='F'||grade==='D'?'var(--neg)':grade==='A'?'var(--green)':'var(--teal)'}">${grade}</span></h2>
    <div class="score ${eq>=0?'up':'down'}">${pts}<span style="font-size:18px;color:var(--txt-dim)">/100</span></div>
    ${dbg.map(d=>`<div class="debrief-row"><span class="lbl">${d[0]}</span><span class="rating ${d[2]}">${d[1]}</span></div>`).join('')}
    <div style="margin-top:16px;padding:14px;background:var(--panel2);border-radius:8px;border-left:3px solid var(--green)">
      <div style="font-family:var(--disp);color:var(--green);font-size:14px;margin-bottom:6px">${t('d_notes')}</div>
      <div style="color:var(--txt-dim);font-size:12px;line-height:1.65">${coaching}</div>
    </div>
    <button class="big-btn" style="margin-top:18px" onclick="restart()">${t('d_again')}</button>`;
  document.getElementById('modalBg').classList.add('show');
}
function coach(eq,sc,ip,s){
  const n=[];
  if(eq>300) n.push(t('c_strong'));
  else if(eq<0) n.push(t('c_red'));
  if(ip<-100) n.push(t('c_invpl'));
  if(s.maxAbsInv>POS_LIMIT-1) n.push(t('c_limit'));
  if(s.adverse>0) n.push(t('c_adverse',s.adverse));
  if(sc<60) n.push(t('c_lowcap'));
  if(n.length===0) n.push(t('c_ok'));
  return n.join(' ');
}
function restart(){
  document.getElementById('modalBg').classList.remove('show');
  S=freshState();
  document.getElementById('advanceBtn').textContent=t('btn_start');
  document.getElementById('widthSlider').value=1.6; document.getElementById('skewSlider').value=0;
  S.newsMode='reset';
  render();
}
function startGame(){
  document.getElementById('academy').classList.add('hidden');
  document.getElementById('game').classList.remove('hidden');
  document.getElementById('clock').style.display='block';
  S=freshState(); document.getElementById('advanceBtn').textContent=t('btn_start'); render(); window.scrollTo({top:0,behavior:'smooth'});
}
/* ================= LANGUAGE ================= */
function applyLang(){
  document.documentElement.lang=LANG==='zh'?'zh-CN':'en';
  document.body.classList.toggle('lang-zh',LANG==='zh');
  document.title=t('doc_title');
  const tog=document.getElementById('langToggle');
  tog.textContent=t('lang_other');
  tog.setAttribute('aria-label',t('lang_aria'));

  document.getElementById('brandSub').innerHTML=t('brand_sub');
  document.getElementById('backAll').textContent=t('back_all');
  document.getElementById('glossBox').innerHTML=t('gloss');
  document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=t(el.dataset.i18n)});
  document.querySelectorAll('[data-i18n-title]').forEach(el=>{el.title=t(el.dataset.i18nTitle)});

  if(S){
    document.getElementById('advanceBtn').textContent=S.started?t('btn_advance'):t('btn_start');
    render();
  }else{
    document.getElementById('turnLabel').textContent=t('press_start');
  }
  renderAcademy();
}
document.getElementById('langToggle').addEventListener('click',()=>{
  LANG=LANG==='en'?'zh':'en';
  try{localStorage.setItem('evolta_lang',LANG)}catch(e){}
  applyLang();
});

applyLang();
</script>
