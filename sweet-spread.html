<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sweet Spread — Sugar Trading Simulation | Evolta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f7f5;
    --bg2:#ffffff;
    --panel:#ffffff;
    --panel2:#f0f5f2;
    --line:#e2e9e4;
    --line2:#d6e0da;
    /* Pink confection palette */
    --green:#c2185b;       /* primary raspberry (brand) */
    --green-lt:#e35d8a;
    --blue:#8e3b8f;        /* secondary plum */
    --blue-lt:#b85cb8;
    --accent:#c2185b;
    --pos:#1a7a4c;         /* up — stays green for P&L meaning */
    --neg:#c0392b;         /* down */
    --white:#1a2622;       /* on light, "white" text role = darkest ink */
    --txt:#243530;
    --txt-dim:#5e7068;
    --txt-faint:#94a59d;
    --mono:'IBM Plex Mono',monospace;
    --sans:'Inter',-apple-system,sans-serif;
    --disp:'Fraunces',serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:
      radial-gradient(ellipse at 12% -5%, #fbe6ef 0%, transparent 45%),
      radial-gradient(ellipse at 95% 5%, #f6e9f6 0%, transparent 42%),
      var(--bg);
    color:var(--txt);
    font-family:var(--sans);
    font-size:13px;
    line-height:1.5;
    min-height:100vh;
    padding:0 0 60px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:0 20px;position:relative;z-index:2}

  /* Header */
  header{
    border-bottom:1px solid var(--line);
    padding:30px 0 20px;
    margin-bottom:24px;
    display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;
  }
  .brand h1{
    font-family:var(--disp);font-weight:500;font-size:40px;line-height:.95;
    letter-spacing:-.02em;color:var(--green);
  }
  .brand h1 .amp{color:var(--blue);font-style:italic}
  .brand .sub{color:var(--txt-dim);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;margin-top:8px;font-family:var(--mono)}
  .brand .evolta{color:var(--blue);font-weight:600}
  .topbar{display:flex;align-items:center;gap:14px}
  .back-btn{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;color:var(--txt-dim);text-decoration:none;border:1px solid var(--line2);border-radius:8px;padding:8px 13px;transition:.15s;white-space:nowrap}
  .back-btn:hover{border-color:var(--green);color:var(--green)}
  .clock{text-align:right}
  .clock .month{font-family:var(--disp);font-size:28px;color:var(--blue);font-weight:500}
  .clock .turn{color:var(--txt-faint);font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-family:var(--mono)}

  /* Layout */
  .grid{display:grid;grid-template-columns:1fr 340px;gap:18px;align-items:start}
  @media(max-width:880px){.grid{grid-template-columns:1fr}}

  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:18px 20px;
    margin-bottom:18px;
    box-shadow:0 1px 2px rgba(26,122,76,.04), 0 6px 22px rgba(11,94,168,.04);
  }
  .panel h2{
    font-family:var(--mono);font-weight:500;font-size:11px;color:var(--txt-faint);
    letter-spacing:.14em;text-transform:uppercase;
    margin-bottom:14px;display:flex;align-items:center;gap:8px;
  }
  .panel h2 .dot{width:5px;height:5px;border-radius:50%;background:var(--green)}

  /* Market table */
  .mkt{width:100%;border-collapse:collapse}
  .mkt th{text-align:left;color:var(--txt-faint);font-weight:500;font-size:9.5px;
    letter-spacing:.1em;text-transform:uppercase;padding:4px 8px;border-bottom:1px solid var(--line);font-family:var(--mono)}
  .mkt td{padding:9px 8px;border-bottom:1px solid var(--line)}
  .mkt tr:last-child td{border-bottom:none}
  .mkt .nm{color:var(--txt);font-weight:500}
  .mkt .nm small{display:block;color:var(--txt-faint);font-size:10px;font-weight:400}
  .mkt .px{font-weight:600;font-size:15px;text-align:right;font-family:var(--mono)}
  .mkt .chg{text-align:right;font-size:12px;font-family:var(--mono)}
  .up{color:var(--pos)}.down{color:var(--neg)}.flat{color:var(--txt-faint)}

  /* News */
  .news{border-left:3px solid var(--green);padding:2px 0 2px 14px;margin-bottom:8px}
  .news .hl{color:var(--white);font-weight:600;margin-bottom:4px;font-size:14px}
  .news .src{color:var(--blue);font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-family:var(--mono);font-weight:500}
  .news .ex{color:var(--txt-dim);font-size:12px;margin-top:8px;line-height:1.6;
    border-top:1px solid var(--line);padding-top:8px}
  .news .ex b{color:var(--green)}

  /* Actions */
  .act-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .trade-card{
    background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:13px;
  }
  .trade-card .tt{font-family:var(--disp);font-size:15px;color:var(--green);margin-bottom:3px;font-weight:500}
  .trade-card .td{color:var(--txt-dim);font-size:10.5px;margin-bottom:11px;min-height:30px;line-height:1.5}
  .qty-row{display:flex;align-items:center;gap:6px;margin-bottom:9px}
  .qty-row label{color:var(--txt-dim);font-size:10px;flex:1;font-family:var(--mono);text-transform:uppercase;letter-spacing:.05em}
  input[type=number]{
    width:64px;background:var(--bg2);border:1px solid var(--line2);color:var(--txt);
    font-family:var(--mono);font-size:13px;padding:5px 7px;border-radius:6px;text-align:right;
  }
  input[type=number]:focus{outline:none;border-color:var(--blue)}
  .btn-row{display:flex;gap:6px}
  button{
    font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.03em;
    border:1px solid var(--line2);background:var(--bg2);color:var(--txt);
    padding:8px 10px;border-radius:7px;cursor:pointer;transition:.13s;flex:1;
  }
  button:hover{border-color:var(--blue);color:var(--blue)}
  button.buy:hover{border-color:var(--green);color:var(--green);background:rgba(26,122,76,.06)}
  button.sell:hover{border-color:var(--neg);color:var(--neg);background:rgba(192,57,43,.05)}
  button:active{transform:translateY(1px)}
  button:disabled{opacity:.4;cursor:not-allowed}
  .big-btn{
    width:100%;padding:15px;font-size:14px;font-family:var(--sans);font-weight:600;
    background:linear-gradient(135deg,var(--green),var(--blue));color:#fff;border:none;
    letter-spacing:.02em;border-radius:10px;box-shadow:0 4px 14px rgba(11,94,168,.18);
  }
  .big-btn:hover{filter:brightness(1.07);color:#fff}

  /* Sidebar stats */
  .stat{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line)}
  .stat:last-child{border-bottom:none}
  .stat .k{color:var(--txt-dim);font-size:11px}
  .stat .v{font-weight:600;font-family:var(--mono)}
  .big-num{font-family:var(--disp);font-size:32px;font-weight:500;line-height:1;margin:2px 0 8px;color:var(--blue)}

  /* Position rows */
  .pos{display:flex;justify-content:space-between;align-items:center;padding:8px 0;
    border-bottom:1px solid var(--line);font-size:12px}
  .pos:last-child{border-bottom:none}
  .pos .pl{color:var(--txt);display:flex;flex-direction:column;gap:2px}
  .pos .pl small{color:var(--txt-faint);font-size:10px;font-family:var(--mono)}
  .pos .pr{text-align:right;font-family:var(--mono)}
  .tag{display:inline-block;font-size:9px;padding:2px 6px;border-radius:4px;letter-spacing:.05em;
    text-transform:uppercase;font-weight:600;font-family:var(--mono)}
  .tag.long{background:rgba(26,122,76,.12);color:var(--green)}
  .tag.short{background:rgba(192,57,43,.10);color:var(--neg)}

  /* Risk meter */
  .meter{height:7px;background:var(--line);border-radius:5px;overflow:hidden;margin:8px 0}
  .meter span{display:block;height:100%;transition:.4s;border-radius:5px}

  /* Toast / margin call */
  .toast{
    position:fixed;left:50%;top:20px;transform:translateX(-50%);z-index:50;
    background:var(--bg2);border:1px solid var(--green);border-radius:10px;padding:12px 22px;
    color:var(--txt);font-size:12px;box-shadow:0 10px 36px rgba(11,94,168,.16);max-width:90vw;
    opacity:0;transition:.3s;pointer-events:none;font-family:var(--mono);
  }
  .toast.show{opacity:1;top:32px}
  .toast.warn{border-color:var(--neg);color:var(--neg)}

  /* Modal */
  .modal-bg{position:fixed;inset:0;background:rgba(26,38,34,.55);backdrop-filter:blur(4px);z-index:40;display:none;
    align-items:center;justify-content:center;padding:20px}
  .modal-bg.show{display:flex}
  .modal{background:var(--bg2);border:1px solid var(--line);
    border-radius:18px;padding:30px;max-width:560px;width:100%;max-height:88vh;overflow:auto;
    box-shadow:0 20px 60px rgba(11,94,168,.22)}
  .modal h2{font-family:var(--disp);font-size:28px;color:var(--green);font-weight:500;margin-bottom:6px}
  .modal .score{font-family:var(--disp);font-size:52px;font-weight:500;line-height:1;margin:10px 0;color:var(--blue)}
  .grade{display:inline-block;font-family:var(--disp);font-size:22px;font-weight:600;
    padding:3px 16px;border-radius:10px;background:var(--green);color:#fff;margin-left:10px}
  .debrief-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);gap:14px}
  .debrief-row .lbl{color:var(--txt-dim)}
  .debrief-row .rating{font-weight:600;text-align:right;font-family:var(--mono);font-size:11.5px}

  .hint{color:var(--txt-faint);font-size:10.5px;margin-top:6px;line-height:1.5}
  .hint b{color:var(--txt-dim)}
  .tip{cursor:help;border-bottom:1px dotted var(--txt-faint)}
  .intro-list{list-style:none;margin:10px 0}
  .intro-list li{padding:5px 0 5px 20px;position:relative;color:var(--txt-dim);font-size:12px}
  .intro-list li::before{content:"◆";position:absolute;left:0;color:var(--green);font-size:9px;top:7px}

  /* ===== Academy ===== */
  #academy{max-width:920px;margin:0 auto}
  .acad-panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px 32px;box-shadow:0 1px 2px rgba(194,24,91,.05),0 10px 36px rgba(142,59,143,.07)}
  .acad-steps{display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap}
  .acad-steps .s{flex:1;min-width:70px;height:5px;border-radius:4px;background:var(--line);transition:.3s}
  .acad-steps .s.done{background:var(--green)}
  .acad-steps .s.cur{background:linear-gradient(90deg,var(--green),var(--blue))}
  .lesson-kicker{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--blue);font-weight:500;margin-bottom:8px}
  .lesson-title{font-family:var(--disp);font-size:30px;font-weight:500;color:var(--green);line-height:1.05;margin-bottom:10px;letter-spacing:-.01em}
  .lesson-lede{color:var(--txt-dim);font-size:14px;line-height:1.65;margin-bottom:6px;max-width:62ch}
  .lesson-lede b{color:var(--green)}
  .lesson-body{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start;margin:22px 0 8px}
  @media(max-width:760px){.lesson-body{grid-template-columns:1fr}}
  .viz-box{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:18px;min-height:300px}
  .viz-controls{margin-top:14px;display:flex;flex-direction:column;gap:12px}
  .ctrl-row{display:flex;align-items:center;gap:10px}
  .ctrl-row label{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--txt-dim);min-width:96px}
  .chip-row{display:flex;gap:8px;flex-wrap:wrap}
  .chip{font-family:var(--mono);font-size:10.5px;padding:7px 12px;border-radius:20px;border:1px solid var(--line2);background:var(--bg2);color:var(--txt-dim);cursor:pointer;transition:.13s;flex:none}
  .chip:hover{border-color:var(--blue);color:var(--blue)}
  .chip.amber{border-color:var(--green);color:var(--green);background:rgba(194,24,91,.07)}
  .ctrl-row input[type=range]{accent-color:var(--green);flex:1}
  .takeaway{background:rgba(142,59,143,.07);border:1px solid rgba(142,59,143,.24);border-radius:10px;padding:13px 15px;margin-top:6px}
  .takeaway .lab{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);font-weight:600;margin-bottom:5px}
  .takeaway .txt{color:var(--txt);font-size:12.5px;line-height:1.6}
  .takeaway .txt b{color:var(--green)}
  .lesson-points{list-style:none;margin:14px 0}
  .lesson-points li{padding:7px 0 7px 26px;position:relative;color:var(--txt-dim);font-size:13px;line-height:1.55}
  .lesson-points li::before{content:"";position:absolute;left:0;top:9px;width:13px;height:13px;border-radius:50%;border:2px solid var(--green)}
  .lesson-points li b{color:var(--txt)}
  .acad-nav{display:flex;justify-content:space-between;align-items:center;margin-top:24px;gap:12px}
  .acad-nav .right{display:flex;gap:10px}
  .read-out{font-family:var(--mono);font-size:12px;color:var(--txt-dim)}
  .read-out b{font-size:14px;color:var(--blue)}
  .ghost-btn{background:transparent;border:1px solid var(--line2);color:var(--txt-dim);padding:10px 16px;border-radius:9px;font-family:var(--mono);font-size:11px;flex:none}
  .ghost-btn:hover{border-color:var(--green);color:var(--green)}
  .bar-anim{transition:all .5s cubic-bezier(.2,.8,.25,1)}
  .hidden{display:none !important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1>Sweet <span class="amp">&</span> Spread</h1>
      <div class="sub" id="brandSub"></div>
    </div>
    <div class="topbar">
      <div class="clock" id="clock" style="display:none">
        <div class="month" id="monthLabel">—</div>
        <div class="turn" id="turnLabel"></div>
      </div>
      <button class="back-btn" id="langToggle" type="button" style="cursor:pointer;margin-right:8px">中文</button>
      <a class="back-btn" id="backAll" href="TradingGamePortal.html">‹ All games</a>
    </div>
  </header>

  <!-- ACADEMY -->
  <div id="academy">
    <div class="acad-panel">
      <div class="acad-steps" id="acadSteps"></div>
      <div id="lessonContent"></div>
      <div class="acad-nav">
        <button class="ghost-btn" id="backBtn" onclick="acadBack()" data-i18n="nav_back">‹ Back</button>
        <div class="right">
          <button class="ghost-btn" id="skipBtn" onclick="startGame()" data-i18n="nav_skip">Skip to trading ›</button>
          <button class="big-btn" id="nextBtn" onclick="acadNext()" style="width:auto;padding:11px 26px">Next ›</button>
        </div>
      </div>
    </div>
  </div>

  <div class="grid hidden" id="game">
    <!-- LEFT COLUMN -->
    <div>
      <div class="panel" id="newsPanel">
        <h2><span class="dot"></span><span data-i18n="pn_wire">Market Wire</span></h2>
        <div id="newsBox"></div>
      </div>

      <div class="panel">
        <h2><span class="dot"></span><span data-i18n="pn_board">Market Board</span></h2>
        <table class="mkt">
          <thead><tr><th data-i18n="th_instrument">Instrument</th><th style="text-align:right" data-i18n="th_price">Price</th><th style="text-align:right" data-i18n="th_chg">Δ mo</th></tr></thead>
          <tbody id="mktBody"></tbody>
        </table>
        <div class="hint" id="arbHint"></div>
      </div>

      <div class="panel">
        <h2><span class="dot"></span><span data-i18n="pn_desk">Trade Desk</span></h2>
        <div class="act-grid" id="tradeGrid"></div>
        <div style="margin-top:14px">
          <button class="big-btn" id="advanceBtn" onclick="startOrAdvance()">▶ Start Season</button>
        </div>
      </div>
    </div>

    <!-- RIGHT COLUMN -->
    <div>
      <div class="panel">
        <h2><span class="dot"></span><span data-i18n="pn_pnl">P&amp;L</span></h2>
        <div class="big-num" id="equityNum">$10.00M</div>
        <div class="stat"><span class="k" data-i18n="k_realised">Realised P&amp;L</span><span class="v" id="realisedPL">$0</span></div>
        <div class="stat"><span class="k" data-i18n="k_open">Open P&amp;L</span><span class="v" id="openPL">$0</span></div>
        <div class="stat"><span class="k" data-i18n="k_cash">Cash</span><span class="v" id="cashVal">$10.00M</span></div>
        <div class="stat"><span class="k" data-i18n="k_margin">Margin used</span><span class="v" id="marginVal">$0</span></div>
      </div>

      <div class="panel">
        <h2><span class="dot"></span><span data-i18n="pn_risk">Risk</span></h2>
        <div class="stat"><span class="k tip" data-i18n="k_netexp" data-i18n-title="tip_netexp">Net exposure</span><span class="v" id="netExp">$0</span></div>
        <div class="meter"><span id="riskBar" style="width:0%;background:var(--green)"></span></div>
        <div class="hint" id="riskHint"></div>
      </div>

      <div class="panel">
        <h2><span class="dot"></span><span data-i18n="pn_pos">Open Positions</span></h2>
        <div id="posBox"></div>
      </div>

      <div class="panel" id="recapPanel" style="display:none">
        <h2><span class="dot"></span><span data-i18n="pn_recap">This Month's P&amp;L — Why</span></h2>
        <div id="recapBox"></div>
      </div>

      <div class="panel">
        <h2><span class="dot"></span><span data-i18n="pn_gloss">Glossary</span></h2>
        <div style="font-size:11px;color:var(--txt-dim);line-height:1.7" id="glossBox"></div>
        <div style="margin-top:12px"><button class="ghost-btn" onclick="openAcademy()" style="width:100%" data-i18n="replay_acad">↺ Replay the Academy</button></div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="modal-bg" id="modalBg">
  <div class="modal" id="modalInner"></div>
</div>

<script>
/* ============ CONSTANTS ============ */

/* ================= i18n ================= */
const I18N={

  doc_title:'Sweet Spread — Sugar Trading | Evolta',

  a0_ttl:'Two sugars, one spread',
  a0_lede:'The world trades two kinds of sugar. <b>Raw</b> (ICE "No.11", quoted in ¢/lb) is the unrefined cane sugar. <b>White</b> (London "No.5", quoted in $/tonne) is the refined product on your table. To compare them you convert raw into $/tonne — and the gap between white and raw is the <b>white premium</b>. Drag the white price and watch it.',

  a0_p1:'<b>You can bet on each directly.</b> Long raw if you think the world crop tightens; short white if you think refined demand softens.',
  a0_p2:'<b>Different drivers.</b> Raw moves on Brazilian/Indian harvests and ethanol; white moves on refined demand and refining capacity.',
  a0_p3:'<b>The premium is the prize.</b> A wide white premium means refining raw into white is lucrative — which is the trade the next lesson is all about.',

  a1_ttl:'Going long, going short',
  a1_lede:"You don't only make money when prices rise. <b>Long</b> means you buy now and profit if the price goes <b>up</b>. <b>Short</b> means you sell first (borrowing the sugar) and profit if the price goes <b>down</b>, buying it back cheaper later. Pick a side, then drag the price and watch your P&L flip.",
  a1_entry:'entry', a1_golong:'▲ Go Long (buy)', a1_goshort:'▼ Go Short (sell)', a1_pxmove:'Price move',
  a1_p1:'<b>Long = bullish.</b> Buy a No.11 raw or No.5 white future; if it rises, you sell higher and pocket the gain.',
  a1_p2:'<b>Short = bearish.</b> Sell first without owning it; if the price falls, you buy it back cheaper and keep the difference.',
  a1_p3:'<b>Either direction can profit — or lose.</b> Get the call wrong and a long loses as prices fall, a short loses as they rise.',
  a1_p4:'<b>You can combine them.</b> Long raw + short white is a bet that the white premium will <i>narrow</i> — a spread trade, not a pure direction.',
  a1_lab:'Why shorting matters',
  a1_txt:'When the news is clearly bearish — a bumper harvest, an export glut — a trader who can only buy is stuck watching. <b>Shorting lets you profit from falling prices too</b>, so every headline is an opportunity.',

  a2_ttl:'The refining arbitrage',
  a2_lede:"Here's the trade physical sugar desks live on: <b>buy raw, refine it into white, sell the white</b>, and lock the margin today. But the white premium isn't free profit — you pay a <b>refining toll</b>, <b>freight</b>, <b>financing</b>, and you lose ~8% in conversion. What's left is the <b>net margin</b>. Drag the prices and watch it.",
  a2_sold:'White sold', a2_costs:'All costs', a2_net:'Net margin',
  a2_formula:'raw÷0.92 + $70 toll + freight + financing',
  a2_wt:'White $/t', a2_rc:'Raw ¢/lb', a2_fr:'Freight $/t',
  a2_p1:'<b>Net margin = white − raw-in (÷0.92 yield) − $70 toll − freight − financing.</b> Only this is real profit.',
  a2_p2:"<b>Lock it when it's fat.</b> Above ~$25/t the arb is attractive, near-riskless carry; below zero, refining loses money.",
  a2_p3:'<b>Hedge it</b> and you fix both legs so the margin is secured until the cargo settles — no swings, small cost.',
  a2_lab:'Try this',
  a2_txt:"Push raw up to 26¢ while white stays at $600 — the net margin goes <b>negative</b>. The headline premium still looks positive, but after costs you'd be refining at a loss. <b>Read the net, not the premium.</b>",

  a3_ttl:'Leverage &amp; the margin call',
  a3_lede:'Futures let you control a big position while posting only a small deposit — your <b>margin</b>. That\'s <b>leverage</b>, and it cuts both ways. If the market moves against you and your losses eat through your deposit, the exchange issues a <b>margin call</b> and force-closes your positions at the worst possible moment. Pick a leverage, then drag the adverse move.',
  a3_equity:'Your equity', a3_maint:'maintenance', a3_mc:'⚠ MARGIN CALL',
  a3_lev2:'2× leverage', a3_lev5:'5×', a3_lev10:'10×', a3_vs:'Market vs you',
  a3_p1:'<b>Higher leverage = thinner cushion.</b> At 10×, a move of just a few percent against you can wipe out your whole deposit.',
  a3_p2:"<b>The maintenance line is the danger zone.</b> Fall below it and you're force-liquidated — your positions sold at the bottom, locking in the loss.",
  a3_p3:'<b>Margin calls hit at the worst time</b> — during a spike, when prices are most extreme and you\'d most want to hold on.',
  a3_p4:'<b>Defence:</b> keep a cash buffer, size positions sensibly, and don\'t run the book at maximum leverage.',
  a3_lab:'Try this',
  a3_txt:'Set <b>10×</b> and drag the adverse move — equity collapses past the maintenance line almost immediately. Now try <b>2×</b>: the same move barely dents you. <b>Leverage is the difference between a rough month and a blown account.</b>',

  a4_ttl:"You're ready for the desk",
  a4_lede:"Three things drive every call you'll make over the next 12 months:",
  a4_p1:'<b>Directional trades</b> — go long or short raw (No.11) and white (No.5) on supply &amp; demand news.',
  a4_p2:'<b>The refining arb</b> — lock white − costs as a net margin; hedge it to secure the spread until settlement.',
  a4_p3:'<b>Risk</b> — trades use leverage, so an oversized book can get <b>margin-called</b> in a spike. Keep some cash buffer.',

  a4_txt:'Start with <b>$10M</b>. Read each headline, decide if it\'s bullish or bearish for raw, white, or the arb, and size accordingly. A scored <b>debrief</b> grades you at the end — and you can replay this Academy anytime from the Glossary panel.',

/* Refining economics (toll-refining arb), kept close to real desk math:
   - raw->white conversion yield ~92% (need ~1.087 t raw per 1 t white)
   - refining toll: energy, labour, processing — separate from freight
   - freight charged in full
   - financing carry on the raw input while the cargo is held */
const REFINE_TOLL_PER_T = 70;          // $/t white: energy, labour, processing loss
const CONV_YIELD        = 0.92;        // tonnes white per tonne raw
const FINANCE_RATE_ANN  = 0.08;        // 8%/yr cost of capital on raw input

/* Each event: headline, source, explainer, and effect fn mutating drifts */

  {id:5,  eff:s=>{s.dBRL+=0.30; s.dN11-=1.2;}},
  {id:6,  eff:s=>{s.dFreight+=14;}},
  {id:7,  eff:s=>{s.dFreight-=10;}},
  {id:8,  eff:s=>{s.dN5-=14;}},

function pickNews(){
  return NEWS_POOL[Math.floor(Math.random()*NEWS_POOL.length)];
}
function newsHTML(){
  if(S.newsMode==='news'&&S.pendingNews){
    const n=S.pendingNews;
    return '<div class="news"><div class="hl">'+t('news'+n.id+'_hl')+'</div><div class="src">'+t('news'+n.id+'_src')+'</div>'+
           '<div class="ex"><b>'+t('why_matters')+'</b> '+t('news'+n.id+'_ex')+'</div></div>';
  }
  if(S.newsMode==='reset'){
    return '<div class="news"><div class="hl">'+t('reset_hl')+'</div><div class="src">'+t('intro_src')+'</div>'+
           '<div class="ex">'+t('reset_ex')+'</div></div>';

  return '<div class="news"><div class="hl">'+t('intro_hl')+'</div><div class="src">'+t('intro_src')+'</div>'+
         '<div class="ex">'+t('intro_ex')+'</div></div>';
}

/* ============ MARKET MOVE ============ */
function applyMonth(news){
  // drift accumulators
  S.dN11=0; S.dN5=0; S.dBRL=0; S.dFreight=0; S.dEth=0;
  news.eff(S);
  // random noise
  const noise = ()=> (Math.random()-0.5);
  S.lastN11 = S.n11; S.lastN5 = S.n5;
  S.lastBrl = S.brl; S.lastFreight = S.freight; S.lastEth = S.ethanolParity;
  S.lastPrem = whitePremium();
  S.n11 = Math.max(8, +(S.n11 + S.dN11 + noise()*1.4).toFixed(2));
  S.n5  = Math.max(250, Math.round(S.n5 + S.dN5 + noise()*18));
  S.brl = Math.max(3.5, +(S.brl + S.dBRL + noise()*0.12).toFixed(2));
  S.freight = Math.max(15, Math.round(S.freight + S.dFreight + noise()*5));
  S.ethanolParity = +(S.ethanolParity + S.dEth + noise()*0.2).toFixed(2);
}

/* convert raw ¢/lb to white-equivalent $/t for premium calc */
function rawToTonneUSD(centsPerLb){ return (centsPerLb/100)*LB_PER_TONNE; }
function whitePremium(){ return S.n5 - rawToTonneUSD(S.n11); }

/* Net refining-arb margin, $ per tonne of WHITE produced.
   Raw input is grossed up by the conversion yield (need >1 t raw per t white). */
function rawInputCostPerWhiteT(){ return rawToTonneUSD(S.n11)/CONV_YIELD; }
function financeCostPerT(){ return rawInputCostPerWhiteT()*FINANCE_RATE_ANN*(ARB_MONTHS/12); }
function arbNetMargin(){
  return S.n5 - rawInputCostPerWhiteT() - REFINE_TOLL_PER_T - S.freight - financeCostPerT();
}

/* ============ POSITION VALUATION ============ */
function instrPrice(key){
  if(key==='n11') return S.n11;
  if(key==='n5')  return S.n5;
  return 0;
}
// notional USD per lot
function lotNotional(key){
  if(key==='n11') return (S.n11/100)*LB_PER_LOT_11;     // ¢/lb -> $/lb * lb
  if(key==='n5')  return S.n5*T_PER_LOT_5;
  return 0;
}
function posOpenPL(p){
  const cur = instrPrice(p.key);
  if(p.key==='n11'){
    // ¢/lb move * lb/lot /100
    return p.side * (cur - p.entryPx)/100 * LB_PER_LOT_11 * p.lots;
  }else{ // n5 $/t
    return p.side * (cur - p.entryPx) * T_PER_LOT_5 * p.lots;
  }
}
function physicalPL(c){
  // Cargo value moves with the achievable net arb margin vs what was locked.
  // c.tonnes = raw tonnes bought; white produced = raw * yield.
  // A HEDGED cargo locked both futures legs, so its MTM stays ~flat until settlement.
  if(c.hedged) return 0;
  const curMargin = arbNetMargin();
  const whiteT = c.tonnes * CONV_YIELD;
  return (curMargin - c.lockedMargin) * whiteT;
}
function totalOpenPL(){
  let pl=0;
  S.pos.forEach(p=>pl+=posOpenPL(p));
  S.physical.forEach(c=>pl+=physicalPL(c));
  return pl;
}
function marginUsed(){
  let m=0;
  S.pos.forEach(p=> m += lotNotional(p.key)*p.lots*MARGIN_RATE );
  S.physical.forEach(c=> m += rawToTonneUSD(S.n11)*c.tonnes*MARGIN_RATE );
  return m;
}
function netExposure(){
  let e=0;
  S.pos.forEach(p=> e += p.side * lotNotional(p.key) * p.lots );
  S.physical.forEach(c=> e += rawToTonneUSD(S.n11)*c.tonnes ); // long raw exposure
  return e;
}
function equity(){ return S.cash + totalOpenPL(); }

/* ============ TRADING ============ */
function trade(key,name,side,lots){
  if(!S.started){ toast(t('toast_start')); return; }
  lots=Math.max(1,Math.floor(lots||1));
  // check margin
  const addMargin = lotNotional(key)*lots*MARGIN_RATE;
  if(marginUsed()+addMargin > equity()){ toast(t('toast_margin'),true); return; }
  // see if offsetting an existing opposite position -> realise
  let p = S.pos.find(x=>x.key===key);
  const px = instrPrice(key);
  if(p){
    if(p.side===side){
      // add — average
      const totLots=p.lots+lots;
      p.entryPx = (p.entryPx*p.lots + px*lots)/totLots;
      p.lots=totLots;
    }else{
      // reduce/close/flip
      const closeLots=Math.min(p.lots,lots);
      const realised = (key==='n11')
        ? p.side*(px-p.entryPx)/100*LB_PER_LOT_11*closeLots
        : p.side*(px-p.entryPx)*T_PER_LOT_5*closeLots;
      S.realised+=realised; S.cash+=realised;
      trackDirectional(realised);
      p.lots-=closeLots;
      const remain=lots-closeLots;
      if(p.lots<=0){
        S.pos=S.pos.filter(x=>x!==p);
        if(remain>0){ S.pos.push({key,name,side,lots:remain,entryPx:px}); }
      }
    }
  }else{
    S.pos.push({key,name,side,lots,entryPx:px});
  }
  render();
}

function trackDirectional(realised){
  if(realised>0.0001) S.directionalRight++;
  else if(realised<-0.0001) S.directionalWrong++;
}

/* Refining arb: buy raw + refine + sell white, locking current net margin.
   hedged=true also locks both futures legs, removing weekly MTM swing. */
function lockArb(tonnes,hedged){
  if(!S.started){ toast(t('toast_start')); return; }
  tonnes=Math.max(1000,Math.floor(tonnes||1000));
  let netMargin = arbNetMargin();
  // a hedge isn't free: small cost (bid/offer + carry on the paper legs)
  const hedgeCostPerT = hedged ? 4 : 0;
  netMargin -= hedgeCostPerT;
  const addMargin = rawToTonneUSD(S.n11)*tonnes*MARGIN_RATE;
  if(marginUsed()+addMargin>equity()){ toast(t('toast_margin_cargo'),true); return; }
  S.physical.push({tonnes,lockedMargin:netMargin,monthsLeft:ARB_MONTHS,netAtLock:netMargin,hedged:!!hedged});
  S.arbsTaken++;
  if(hedged) toast(t('toast_hedged'));
  else if(netMargin>20) toast(t('toast_unhedged'));
  else if(netMargin<0) toast(t('toast_negative'),true);
  render();
}
function closePhysical(c){
  // Hedged cargo realizes the margin it locked, regardless of where the market moved.
  const pl = c.hedged ? c.lockedMargin * c.tonnes * CONV_YIELD : physicalPL(c);
  S.realised+=pl; S.cash+=pl;
  trackDirectional(pl);
  S.physical=S.physical.filter(x=>x!==c);
  toast(t('toast_cargo_pl',(pl>=0?"+":"")+fmtUSD(pl)));
  render();
}

/* ============ WEEKLY RECAP ============ */
function buildRecap(news,before){
  const moves=[];
  const fmtMove=(label,b,a,dp,unit)=>{
    const d=a-b; if(Math.abs(d)<(dp===2?0.005:0.5)) return null;
    const dir=d>0?t('r_rose'):t('r_fell');
    return t('r_move',label,dir,Math.abs(d).toFixed(dp),unit,b.toFixed(dp),a.toFixed(dp));
  };
  [
    fmtMove(t('m_raw'),before.n11,S.n11,2,'¢'),
    fmtMove(t('m_white'),before.n5,S.n5,0,''),
    fmtMove(t('m_freight'),before.freight,S.freight,0,''),
    fmtMove(t('m_brl'),before.brl,S.brl,2,''),
  ].forEach(m=>{ if(m) moves.push(m); });

  // per-position P&L attribution
  const lines=[];
  S.pos.forEach(p=>{
    const nowPL=posOpenPL(p);
    const prev=before.posPL.find(x=>x.name===p.name && x.side===p.side);
    const delta=nowPL-(prev?prev.pl:0);
    if(Math.abs(delta)<1) return;
    const dir=p.side>0?'long':'short';
    lines.push({txt:t('r_posline',p.side>0?t('long'):t('short'),p.name,(delta>=0?'+':'')+fmtUSD(delta)),delta});
  });

  // arb cargo attribution — decompose the net-margin move into drivers
  let arbDelta=0, arbDriver='';
  if(S.physical.some(c=>!c.hedged)){
    const whiteT=S.physical.filter(c=>!c.hedged).reduce((s,c)=>s+c.tonnes*CONV_YIELD,0);
    const marginNow=arbNetMargin();
    arbDelta=(marginNow-before.margin)*whiteT;
    // which driver moved the margin most?
    const dRaw=-(rawToTonneUSD(S.n11)-rawToTonneUSD(before.n11))/CONV_YIELD; // raw up = margin down
    const dWhite=S.n5-before.n5;
    const dFreight=-(S.freight-before.freight);
    const drivers=[[t('d_white'),dWhite],[t('d_raw'),dRaw],[t('d_freight'),dFreight]]
      .sort((a,b)=>Math.abs(b[1])-Math.abs(a[1]));
    const top=drivers[0];
    arbDriver = t('r_arb',(arbDelta>=0?'+':'')+fmtUSD(arbDelta),top[1]>=0?t('r_favourable'):t('r_adverse'),top[0],(top[1]>=0?'+':'-')+'$'+Math.abs(top[1]).toFixed(0));
    if(lines.length===0 && S.pos.length===0){} // arb only
  }
  if(S.physical.some(c=>c.hedged)){
    arbDriver += (arbDriver?' ':'')+t('r_hedged_flat');
  }

  const totalSwing=totalOpenPL()-before.openPL;

  S.recap={
    month:MON(S.turn),
    newsId:news.id,
    moves,
    lines:lines.sort((a,b)=>Math.abs(b.delta)-Math.abs(a.delta)).map(l=>l.txt),
    arbDriver,
    totalSwing,
  };
}

/* ============ TURN ADVANCE ============ */
function startOrAdvance(){
  if(!S.started){
    S.started=true;
    S.turn=0;
    S.pendingNews=pickNews();S.newsMode='news';
    document.getElementById('advanceBtn').textContent="▶ Advance Month";
    render();
    return;
  }
  // resolve current month: apply the news that was showing
  const news=S.pendingNews;
  // detect missed arb BEFORE move (was a fat premium available and ignored?)
  const fatArb = arbNetMargin() > 25;
  if(fatArb && S.physical.length===0) S.arbsMissed++;

  // --- snapshot BEFORE the move, for the weekly recap attribution ---
  const before={
    n11:S.n11, n5:S.n5, brl:S.brl, freight:S.freight, eth:S.ethanolParity,
    margin:arbNetMargin(),
    openPL:totalOpenPL(),
    posPL:S.pos.map(p=>({name:p.name,side:p.side,pl:posOpenPL(p)})),
  };

  applyMonth(news);

  // physical cargoes age
  S.physical.forEach(c=>{ if(c.monthsLeft>0)c.monthsLeft--; });

  // --- build the weekly recap (what drove the P&L swing) ---
  buildRecap(news,before);

  // margin call check
  const eq=equity(), mm=marginUsed()*MAINT_RATE/MARGIN_RATE;
  if(eq < mm){
    S.marginCalls++;
    forceLiquidate();
    toast(t('toast_mc'),true);
  }
  // risk breach tracking (net exp > 1.5x equity)
  const lev = Math.abs(netExposure())/Math.max(1,equity());
  if(lev>S.maxRiskBreach) S.maxRiskBreach=lev;

  S.history.push({m:MON(S.turn),eq:equity()});
  S.turn++;

  if(S.turn>=12){
    render();
    endGame();
    return;
  }
  S.pendingNews=pickNews();S.newsMode='news';
  render();
}

function forceLiquidate(){
  // close everything at current px
  S.pos.forEach(p=>{ S.realised+=posOpenPL(p); S.cash+=posOpenPL(p); });
  S.physical.forEach(c=>{ const pl=physicalPL(c); S.realised+=pl; S.cash+=pl; });
  S.pos=[]; S.physical=[];
}

  if(a>=1e3) return sign+"$"+(a/1e3).toFixed(1)+"k";
  return sign+"$"+a.toFixed(0);
}

/* FX hedge: simplified — reduces net exposure sensitivity, small carry cost */
function fxHedge(mn){
  if(!S.started){toast(t('toast_start'));return;}
  const cost=mn*1000*2; // small hedge cost
  S.cash-=cost; S.realised-=cost;
  toast(`Hedged $${mn}M BRL exposure (cost ${fmtUSD(cost)}).`);

/* ============ TOAST ============ */
let toastT;
function toast(msg,warn){
  const t=document.getElementById('toast');
  t.textContent=msg; t.className='toast show'+(warn?' warn':'');
  clearTimeout(toastT);
  toastT=setTimeout(()=>t.className='toast'+(warn?' warn':''),2600);
}

/* ============ END / DEBRIEF ============ */
function endGame(){
  forceLiquidate();
  const finalEq=S.cash;
  const ret=(finalEq-START_CASH)/START_CASH*100;
  // scoring
  const dirTotal=S.directionalRight+S.directionalWrong;
  const dirAcc=dirTotal?Math.round(S.directionalRight/dirTotal*100):0;
  const riskScore = S.maxRiskBreach<0.8?t('d_disciplined'):S.maxRiskBreach<1.5?t('d_acceptable'):t('d_reckless');
  const arbScore = S.arbsTaken===0?t('d_passive'):(S.arbsMissed>S.arbsTaken?t('d_missed'):t('d_opportunistic'));

  let pts=50;
  pts+=Math.max(-40,Math.min(60,ret*1.2));
  pts+=(dirAcc-50)*0.4;
  pts-=S.marginCalls*12;
  pts-=Math.max(0,(S.maxRiskBreach-1)*20);
  pts+=Math.min(15,S.arbsTaken*4);
  pts=Math.max(0,Math.min(100,Math.round(pts)));
  const grade=pts>=85?'A':pts>=70?'B':pts>=55?'C':pts>=40?'D':'F';

  const dbg=[
    [t('d_final'), t('d_final_v',fmtUSD(finalEq),(ret>=0?'+':'')+ret.toFixed(1)+'%'), ret>=0?'up':'down'],
    [t('d_diracc'), t('d_dir_v',dirAcc,S.directionalRight,S.directionalWrong), dirAcc>=55?'up':dirAcc>=45?'flat':'down'],
    [t('d_arbs'), t('d_arb_v',arbScore,S.arbsTaken,S.arbsMissed), S.arbsTaken>0?'up':'flat'],
    [t('d_risk'), t('d_risk_v',riskScore,S.maxRiskBreach.toFixed(1)), S.maxRiskBreach<0.8?'up':S.maxRiskBreach<1.5?'flat':'down'],
    [t('d_mc'), S.marginCalls===0?t('d_mc_none'):t('d_mc_n',S.marginCalls), S.marginCalls===0?'up':'down'],
  ];

  const coaching = buildCoaching(ret,dirAcc,S);

  document.getElementById('modalInner').innerHTML=`
    <h2>${t('d_title')} <span class="grade" style="background:${grade==='F'||grade==='D'?'var(--neg)':grade==='A'?'var(--green)':'var(--blue)'}">${grade}</span></h2>
    <div class="score ${ret>=0?'up':'down'}">${pts}<span style="font-size:18px;color:var(--txt-dim)">/100</span></div>
    ${dbg.map(d=>`<div class="debrief-row"><span class="lbl">${d[0]}</span><span class="rating ${d[2]}">${d[1]}</span></div>`).join('')}
    <div style="margin-top:16px;padding:14px;background:var(--panel2);border-radius:8px;border-left:3px solid var(--blue)">
      <div style="font-family:var(--disp);color:var(--green);font-size:14px;margin-bottom:6px">${t('d_notes')}</div>
      <div style="color:var(--txt-dim);font-size:12px;line-height:1.65">${coaching}</div>
    </div>
    <button class="big-btn" style="margin-top:18px" onclick="restart()">${t('d_again')}</button>`;
  document.getElementById('modalBg').classList.add('show');
}

function buildCoaching(ret,dirAcc,s){
  const notes=[];
  if(ret>15) notes.push(t('c_strong'));
  else if(ret<0) notes.push(t('c_down'));
  if(dirAcc<45) notes.push(t('c_diracc'));
  if(s.arbsTaken===0) notes.push(t('c_noarb'));
  if(s.arbsMissed>0) notes.push(t('c_missed',s.arbsMissed));
  if(s.marginCalls>0) notes.push(t('c_mc'));
  if(s.maxRiskBreach>1.5) notes.push(t('c_heavy'));
  if(notes.length===0) notes.push(t('c_ok'));
  return notes.join(' ');
}

    render();
  }else{
    document.getElementById('turnLabel').textContent=t('press_start');
  }
  renderAcademy();
}
document.getElementById('langToggle').addEventListener('click',()=>{
  LANG=LANG==='en'?'zh':'en';
  try{localStorage.setItem('evolta_lang',LANG)}catch(e){}
  applyLang();
});
applyLang();
</script>
</body>
</html>
